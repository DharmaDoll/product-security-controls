      decisions, but does not prove live settings or all provider capabilities.
  - from:
      kind: engineering-pattern
      id: ENG-DEPS-001
      path: ../engineering/dependency-security/dependency-release-cooldown/README.md
    to:
      kind: control-record
      id: PSB-DEPS-001
      path: ../controls/records/dependency-security/psb-deps-001-dependency-release-cooldown/README.md
