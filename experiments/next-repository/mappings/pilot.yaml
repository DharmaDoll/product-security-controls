schema_version: "0.1-pilot"
relationships:
  - from:
      kind: engineering-pattern
      id: ENG-SOURCE-001
      path: ../engineering/source-protection/source-access-credential-lifecycle/README.md
    to:
      kind: control-record
      id: PSB-SOURCE-004
