      - DCR-002
      - DCR-003
      - DCR-004
      - DCR-006
      - DCR-007
limitations:
  - Normalized lock graph fixtures require package-manager-specific read-only adapters for production use.
  - Fixture graph digests and provenance statuses are synthetic identities and do not perform actual artifact or statement signature verification.
  - Advisory version-range evaluation is delegated to an adapter that produces exact PURL records.
  - License compatibility requires product distribution context and legal review beyond identifier deny policy.
  - Unknown vulnerabilities malicious-but-not-advised code maintainer intent and runtime behavior remain residual risk.
  - The repository does not install or execute GitHub Dependency Review Action or contact advisory providers in normal tests.
  - Framework mappings show relevant evidence relationships and do not claim complete OSPS SSDF or MITRE coverage.
status: adopted
owner: product-security
evidence_level: E3
