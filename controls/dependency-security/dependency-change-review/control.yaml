limitations:
  - GitHub-native enforcement requires a supported repository plan dependency graph manifest ecosystem active ruleset and live required review.
  - Ecosystem support for transitive relationships and license metadata varies and unsupported coverage remains NOT_CHECKED.
  - Dependency Review Action v5 reports unknown licenses but does not guarantee that every unknown license fails the job.
  - Snapshot warning retry and a successful fixture do not prove complete current provider data or organization adoption.
  - The offline normalized graph fixture is not a package-manager lockfile parser or live GitHub evidence collector.
  - Artifact integrity registry routing install-time execution provenance and exception lifecycle belong to their owning controls.
  - Unknown vulnerabilities malicious-but-not-advised code maintainer intent and runtime behavior remain residual risk.
  - Framework mappings show relevant evidence relationships and do not claim complete OSPS SSDF or MITRE coverage.
status: reference
owner: product-security
evidence_level: E3
