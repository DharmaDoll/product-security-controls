    id: PW.4.1
    relationship: supports
    confidence: high
    rationale: Exact dependency change source advisory license provenance approval and exception evidence supports controlled acquisition and maintenance of third-party components.
    reviewer: product-security
    review_date: "2026-07-31"
    applies_to:
      - DCR-001
      - DCR-002
      - DCR-003
      - DCR-004
      - DCR-005
