id: PSB-DEPS-004
title: Review dependency graph changes before merge
domain: dependency-security
summary: Bind the exact base-to-head dependency delta to fresh advisory license source provenance approval and time-bound exception evidence.
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: DEPENDENCY-CHANGE-RISK-HIDDEN
    description: A direct or transitive dependency package version source or edge change introduces malicious vulnerable or incompatible content without focused review.
  - id: DEPENDENCY-RISK-EVIDENCE-FAIL-OPEN
    description: Stale partial malformed or unavailable advisory and policy evidence is interpreted as no dependency risk.
  - id: DEPENDENCY-REVIEW-BYPASS
    description: Self approval incomplete change inventory or broad permanent exception permits a dependency change outside reviewed policy.
implementations:
  insecure:
    - insecure/proposed-lock.json
    - insecure/advisories.json
    - insecure/review.json
  secure:
    - secure/policy.json
    - secure/base-lock.json
    - secure/proposed-lock.json
    - secure/advisories.json
    - secure/review.json
    - scripts/verify.py
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-004
  expected:
    - only exact base-to-head direct transitive package version source and edge changes are reviewed
    - fresh complete advisory license and provenance evidence is evaluated for changed dependencies
    - exact computed delta receives one non-author dependency reviewer approval
    - broad self-approved expired exceptions are rejected
    - incomplete stale malformed or unavailable evidence returns ERROR rather than approval
checks:
  - id: DCR-001
    title: Review decision binds exact base head graph and policy identities
    required_state: full base and head commit SHAs graph digests policy bundle digest and advisory snapshot digest exactly match review evidence
    responsible_role: repository-admin
    applies_to:
      - dependency-change
      - pull-request
    context:
      threat_actor: contributor review bot race condition or operator reusing evidence from another change
      attack_or_failure_scenario: a valid review decision is attached to a different commit graph or policy
      why_required: dependency risk evidence has meaning only when bound to the exact graph transition being merged
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-004
      expected: mismatched base head graph policy or advisory snapshot identity returns ERROR
      evidence:
        - sanitized graph binding result
    mapping_status: reviewed
  - id: DCR-002
    title: Direct transitive package and edge delta is complete
    required_state: added removed version source and dependency edge changes retain direct transitive and scope context
    responsible_role: developer
    applies_to:
      - dependency-graph
      - transitive-dependency
    context:
      threat_actor: malicious package update incomplete lockfile adapter or reviewer focusing only on manifest roots
      attack_or_failure_scenario: a risky transitive package or newly introduced edge is hidden behind an approved direct dependency
      why_required: reviewing only direct package names misses code that is installed through changed transitive graph relationships
    verification:
      type: automated
      method: compute a normalized graph delta and compare it with approved change IDs
      expected: every direct transitive and edge change appears exactly once and duplicate approval IDs are rejected
      evidence:
        - sanitized dependency delta result
    mapping_status: reviewed
  - id: DCR-003
    title: Changed dependency uses exact version and approved immutable source
    required_state: exact PURL approved registry source repository and full source commit
    responsible_role: developer
    applies_to:
      - dependency-source
      - dependency-version
    context:
      threat_actor: dependency confusion publisher takeover mutable source reference or unapproved registry
      attack_or_failure_scenario: a reviewed name resolves to attacker-controlled or later-changing source content
      why_required: vulnerability and license results for one version do not authorize content from another source or mutable revision
    verification:
      type: automated
      method: compare every impacted package source identity with repository-owned policy
      expected: unapproved registry and mutable source commit are blocked
      evidence:
        - sanitized source decision
    mapping_status: reviewed
  - id: DCR-004
    title: Fresh complete advisory evidence blocks threshold vulnerabilities
    required_state: complete digest-bound advisory snapshot within freshness limit and no changed PURL at or above threshold
    responsible_role: security
    applies_to:
      - dependency-advisory
      - vulnerability-gate
    context:
      threat_actor: vulnerable dependency advisory provider outage partial pagination or stale cache
      attack_or_failure_scenario: a known vulnerable change is merged or unavailable advisory data is presented as zero findings
      why_required: a clean vulnerability decision requires both no matching record and proof that the advisory query completed
    verification:
      type: automated
      method: validate snapshot identity freshness completeness and exact PURL severity matches
      expected: threshold matches block and stale partial malformed evidence returns ERROR
      evidence:
        - sanitized advisory decision
    mapping_status: reviewed
  - id: DCR-005
    title: Changed dependency license satisfies documented policy
    required_state: normalized license identifier is not denied or unknown under repository policy
    responsible_role: repository-admin
    applies_to:
      - dependency-license
      - distribution-policy
    context:
      threat_actor: dependency update with incompatible unknown or incorrectly normalized license terms
      attack_or_failure_scenario: a package creates distribution obligations or restrictions not accepted by the product
      why_required: vulnerability-free code can still create material legal and distribution risk requiring an independent policy check
    verification:
      type: automated
      method: compare changed package license identifiers with the reviewed deny policy
      expected: denied and unknown licenses block the change
      evidence:
        - sanitized license decision
    mapping_status: reviewed
  - id: DCR-006
    title: Changed dependency has verified subject-bound provenance
    required_state: verified provenance statement identity names the exact changed package PURL
    responsible_role: security
    applies_to:
      - dependency-provenance
      - dependency-source
    context:
      threat_actor: forged package publisher registry substitution or unrelated provenance reuse
      attack_or_failure_scenario: review trusts origin evidence that was not verified or belongs to another package version
      why_required: registry and version identity do not establish how or by whom dependency content was produced
    verification:
      type: hybrid
      method: require adapter-verified provenance status exact subject PURL and statement digest
      expected: missing unverified mismatched or unidentified provenance is blocked
      evidence:
        - sanitized provenance binding result
    mapping_status: reviewed
  - id: DCR-007
    title: One non-author dependency reviewer approves the exact computed delta
    required_state: approved change IDs exactly equal computed changes and reviewer is distinct from author with dependency-reviewer role
    responsible_role: repository-admin
    applies_to:
      - pull-request-review
      - dependency-change
    context:
      threat_actor: malicious contributor compromised update bot or incomplete automated review summary
      attack_or_failure_scenario: an author self-approves or reviewers approve a partial list that hides a transitive or source change
      why_required: independent approval over the computed set creates accountability and prevents summary-to-actual-diff mismatch
    verification:
      type: automated
      method: compare computed change IDs with review evidence and reviewer identity
      expected: self approval role mismatch or incomplete delta blocks or errors
      evidence:
        - sanitized approval result
    mapping_status: reviewed
  - id: DCR-008
    title: Dependency exceptions are exact owned independently approved and short-lived
    required_state: exact finding key owner separate approver meaningful justification and expiry within policy maximum
    responsible_role: security
    applies_to:
      - dependency-exception
      - risk-acceptance
    context:
      threat_actor: contributor or reviewer using broad permanent or self-approved suppression
      attack_or_failure_scenario: one accepted risk silently exempts unrelated future dependencies advisories or licenses
      why_required: exact expiry-bound exceptions limit accepted risk to one reviewed finding and force timely reassessment
    verification:
      type: automated
      method: validate exact finding key ownership independent approval creation and expiry
      expected: wildcard self-approved expired and excessive-duration exceptions are blocked
      evidence:
        - sanitized exception decision
    mapping_status: reviewed
  - id: DCR-009
    title: Dependency review evaluation failure is never an approval
    required_state: missing malformed stale partial unreadable or unsupported evidence returns ERROR
    responsible_role: ci-platform
    applies_to:
      - dependency-review-gate
      - advisory-provider
    context:
      threat_actor: provider outage parser defect missing fixture policy engine failure or malformed pull-request data
      attack_or_failure_scenario: review cannot complete but CI reports no dependency findings and permits merge
      why_required: availability failure and verified absence of risk are different states and must produce different merge decisions
    verification:
      type: automated
      method: exercise incomplete stale malformed and missing evidence fixtures
      expected: every evaluation failure exits 2 with RESULT ERROR
      evidence:
        - fail-closed negative-test output
    mapping_status: reviewed
mappings:
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-VM-05.01
    relationship: supports
    confidence: high
    rationale: The repository-owned policy defines vulnerability and license thresholds plus exact exception requirements for dependency change decisions.
    reviewer: product-security
    review_date: "2026-07-31"
    applies_to:
      - DCR-004
      - DCR-005
      - DCR-008
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-VM-05.02
    relationship: supports
    confidence: medium
    rationale: The blocking dependency review supplies pre-merge evidence for addressing SCA violations but does not by itself prove every release gate uses the result.
    reviewer: product-security
    review_date: "2026-07-31"
    applies_to:
      - DCR-004
      - DCR-005
      - DCR-007
      - DCR-008
  - framework: openssf-osps-baseline
    version: "2026.02.19"
