id: PSB-DEPS-004
title: Review dependency graph changes before merge
domain: dependency-security
summary: pull requestのbase-to-head dependency差分を既知脆弱性、license policy、required check、non-author reviewへ結び付け、評価不能をmerge許可にしない。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: DEPENDENCY-CHANGE-RISK-HIDDEN
    description: A direct or transitive dependency change introduces vulnerable malicious or incompatible content without focused review.
  - id: DEPENDENCY-RISK-EVIDENCE-FAIL-OPEN
    description: Missing partial unsupported or unavailable dependency graph and advisory evidence is interpreted as no dependency risk.
  - id: DEPENDENCY-REVIEW-BYPASS
    description: A non-required workflow self approval stale approval or broad inline exception permits a dependency change outside reviewed policy.
implementations:
  insecure:
    - insecure/github/dependency-review.yml
    - insecure/proposed-lock.json
    - insecure/advisories.json
    - insecure/review.json
  secure:
    - secure/github/dependency-review.yml
    - docs/github-adoption.md
    - docs/manual-review-fallback.md
    - secure/policy.json
    - secure/base-lock.json
    - secure/proposed-lock.json
    - secure/advisories.json
    - secure/review.json
    - scripts/verify_github_workflow.py
    - scripts/verify.py
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-004
  expected:
    - the copyable GitHub workflow uses pull_request a pinned Dependency Review Action contents read and blocking vulnerability and license policy
    - the exact supported base-to-head direct and transitive dependency delta is reviewable before merge
    - high or critical vulnerabilities in runtime development and unknown scopes block the required check
    - the SPDX allowlist is explicit and unknown licenses require non-author manual review
    - the latest dependency change requires one non-author approval through an active ruleset
    - missing unsupported partial or unavailable graph workflow and provider evidence never produces approval
checks:
  - id: DCR-001
    title: Required dependency review binds the exact pull request base and head
    required_state: a stable required Dependency Review check evaluates the current pull request base and latest head revision before merge
    responsible_role: repository-admin
    applies_to:
      - dependency-change
      - pull-request
    context:
      threat_actor: contributor stale workflow result race condition or administrator attaching a check from another revision
      attack_or_failure_scenario: a dependency decision for an older or different graph is accepted after the pull request head or base changes
      why_required: vulnerability and license evidence is meaningful only when the required check is attached to the exact revision pair being merged
    verification:
      type: hybrid
      method: verify the stable workflow identity locally then confirm the active GitHub ruleset and latest pull request check in a sandbox repository
      expected: missing stale neutral or differently sourced dependency review cannot satisfy the merge rule
      evidence:
        - sanitized workflow verification output
        - live required-check setting and test pull-request receipt
    mapping_status: reviewed
  - id: DCR-002
    title: Supported direct and transitive dependency delta is complete
    required_state: every supported added removed or updated dependency retains direct transitive scope manifest and dependency-path context
    responsible_role: developer
    applies_to:
      - dependency-graph
      - transitive-dependency
    context:
      threat_actor: malicious dependency incomplete provider graph unsupported manifest or reviewer focusing only on direct manifest entries
      attack_or_failure_scenario: a risky transitive package or newly introduced dependency path is omitted from the review summary
      why_required: reviewing only manifest roots misses code brought into the product through changed transitive graph relationships
    verification:
      type: hybrid
      method: confirm the manifest is in the current supported ecosystem list and compare provider summary with a harmless base-to-head lockfile change
      expected: direct and transitive changes are shown or the unsupported or incomplete target remains NOT_CHECKED and blocked
      evidence:
        - supported-ecosystem decision
        - sanitized dependency review summary receipt
    mapping_status: reviewed
  - id: DCR-004
    title: High or critical vulnerabilities in changed dependencies are blocked
    required_state: vulnerability checking is enabled for runtime development and unknown scopes with a high threshold and warn-only disabled
    responsible_role: security
    applies_to:
      - dependency-advisory
      - vulnerability-gate
    context:
      threat_actor: vulnerable dependency compromised update account advisory provider failure or maintainer weakening workflow inputs
      attack_or_failure_scenario: a pull request introduces a known high-severity dependency vulnerability but the workflow only warns or excludes its scope
      why_required: visible findings do not prevent vulnerable code from merging unless the policy check returns a required non-success result
    verification:
      type: automated
      method: run the local workflow verifier and an inert known-vulnerable lockfile-only pull request in a sandbox repository
      expected: high and critical findings fail the required Dependency Review check without installing dependency code
      evidence:
        - sanitized workflow policy result
        - live inert negative-test receipt
    mapping_status: reviewed
  - id: DCR-005
    title: Changed dependency licenses follow an explicit SPDX policy
    required_state: license checking and a reviewed SPDX allowlist are enabled while unknown licenses require non-author review rather than automatic approval
    responsible_role: security
    applies_to:
      - dependency-license
      - distribution-policy
    context:
      threat_actor: dependency update with incompatible missing or incorrectly normalized license metadata
      attack_or_failure_scenario: a vulnerability-free package introduces distribution terms that the product has not accepted or an unknown license is treated as approved
      why_required: vulnerability policy does not address legal and distribution restrictions and the provider does not always fail on unknown license metadata
    verification:
      type: hybrid
      method: verify the reference allowlist locally then exercise allowed incompatible and unknown license changes in a sandbox repository
      expected: licenses outside the reviewed list fail where provider metadata is available and unknown licenses remain pending manual review
      evidence:
        - sanitized license-policy verification output
        - live allowed denied and unknown-license review receipts
    mapping_status: reviewed
  - id: DCR-007
    title: One non-author reviewer approves the latest dependency change
    required_state: an active ruleset requires at least one approval and stale or latest-push settings ensure the author cannot reuse approval for changed dependency content
    responsible_role: repository-admin
    applies_to:
      - pull-request-review
      - dependency-change
    context:
      threat_actor: malicious contributor compromised update bot self approver or contributor adding content after review
      attack_or_failure_scenario: dependency changes merge with author-only approval or with an approval that predates the latest head revision
      why_required: automated policy cannot judge all dependency context and independent approval prevents a passing summary from replacing accountability for the actual latest diff
    verification:
      type: manual
      method: inspect the active ruleset and test author-only approval plus a post-approval push in a sandbox pull request
      expected: author-only and stale approval cannot satisfy the default-branch merge rule
      evidence:
        - live ruleset identity and review-setting receipt
        - sanitized negative merge-attempt result
    mapping_status: reviewed
  - id: DCR-009
    title: Dependency review evaluation failure is never an approval
    required_state: missing unsupported partial unreadable cancelled timed-out or unavailable dependency review returns ERROR or NOT_CHECKED and cannot satisfy the merge rule
    responsible_role: ci-platform
    applies_to:
      - dependency-review-gate
      - dependency-provider
    context:
      threat_actor: provider outage runner incompatibility parser defect unsupported manifest partial graph or administrator removing a required check
      attack_or_failure_scenario: dependency review cannot complete but an empty diff warning missing job or neutral result permits merge
      why_required: absence of evaluated findings and verified absence of risk are different states and must produce different merge decisions
    verification:
      type: hybrid
      method: exercise missing malformed and unsafe local workflow fixtures then confirm graph runner API and missing-check failure behavior in a sandbox repository
      expected: every evaluation or coverage failure remains non-mergeable and is never reported as a clean dependency review
      evidence:
        - fail-closed local negative-test output
        - live provider-error and unsupported-manifest receipt
    mapping_status: reviewed
