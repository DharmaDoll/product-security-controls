id: PSB-DEPS-004
title: Review dependency graph changes before merge
domain: dependency-security
summary: pull requestでbuildやruntimeへ入るdirect／transitive dependency変更を表示し、既知high以上のaffected versionと評価失敗をrequired merge checkで止める。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: DEPENDENCY-CHANGE-RISK-HIDDEN
    description: A pull request selects a known-vulnerable direct or transitive dependency that is installed packaged or executed but the dependency-specific change is not shown before merge.
  - id: DEPENDENCY-REVIEW-NONBLOCKING
    description: A known vulnerability failed job provider error or missing check does not prevent merge so an unevaluated affected component reaches build or runtime use.
implementations:
  insecure:
    - insecure/github/dependency-review.yml
  secure:
    - secure/github/dependency-review.yml
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-004
  expected:
    - the reference workflow runs on pull requests with a full SHA-pinned read-only Dependency Review Action
    - supported direct and transitive dependency changes are visible in a live pull request
    - a changed dependency with a high or critical known vulnerability fails the job
    - failed errored cancelled or missing required dependency review cannot merge
checks:
  - id: DCR-001
    title: Pull request shows the changed dependency graph
    required_state: the current pull request base-to-head diff shows every supported added or updated direct and transitive dependency with its version scope and manifest or lockfile context
    responsible_role: ci-platform
    applies_to:
      - dependency-change
      - pull-request
    context:
      threat_actor: malicious contributor compromised update account incomplete provider graph or reviewer focused only on manifest roots
      attack_or_failure_scenario: a transitive dependency used by the build or product changes to an affected version without appearing in the dependency-specific pull-request review
      why_required: reviewers cannot investigate reachability advisory impact or remediation when the exact external code entering build or runtime use is not visible before merge
    verification:
      type: hybrid
      method: confirm the manifest is supported then create a harmless lockfile-only update and inspect the live base-to-head dependency review
      expected: the changed direct and transitive dependencies are displayed or incomplete and unsupported coverage remains NOT_CHECKED
      evidence:
        - supported manifest decision
        - sanitized live dependency-diff receipt
    mapping_status: reviewed
  - id: DCR-004
    title: Known high and critical vulnerabilities in changed dependencies fail the check
    required_state: vulnerability checking covers runtime development and unknown scopes at high severity with warn-only disabled
    responsible_role: security
    applies_to:
      - changed-dependency
      - vulnerability-gate
    context:
      threat_actor: vulnerable dependency compromised maintainer or configuration change that weakens the severity or scope gate
      attack_or_failure_scenario: a pull request selects a known high-severity affected version whose vulnerable function is later exposed to attacker input or executed by a valuable CI job but the check passes or only warns
      why_required: actual impact depends on use and reachability but merge must pause before the affected component enters a production artifact developer install or privileged build
    verification:
      type: hybrid
      method: inspect the reference workflow and open an inert lockfile-only pull request containing a fixed known-high affected version without installing it
      expected: the Dependency Review job fails and reports the changed package and advisory
      evidence:
        - local workflow regression output
        - sanitized live negative-test receipt
    mapping_status: reviewed
  - id: DCR-009
    title: Dependency review non-success cannot merge
    required_state: an active default-branch ruleset requires Dependency Review and rejects failure error cancellation and missing check states
    responsible_role: repository-admin
    applies_to:
      - dependency-review-check
      - default-branch-ruleset
    context:
      threat_actor: provider outage runner failure administrator bypass or contributor relying on an absent or cancelled job
      attack_or_failure_scenario: dependency risk was not successfully evaluated but the pull request merges and the unresolved component is installed built or deployed because the workflow is optional or missing
      why_required: no finding and no completed evaluation are different states and only a required merge rule prevents unavailable evidence from becoming implicit approval
    verification:
      type: manual
      method: inspect the active ruleset then attempt merge with a failed job and with a cancelled or missing required check in a sandbox repository
      expected: every non-success state is rejected by the default-branch merge rule
      evidence:
        - live ruleset identity and required-check receipt
        - sanitized failed and missing-check merge rejection
    mapping_status: reviewed
mappings:
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-VM-05.01
    relationship: supports
    confidence: medium
    rationale: The reference profile defines the high-severity changed-dependency vulnerability gate while broader organization vulnerability and license policy remain outside this control.
    reviewer: product-security
    review_date: "2026-09-03"
    applies_to:
      - DCR-004
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-VM-05.02
    relationship: supports
    confidence: high
    rationale: A required pull-request dependency review supplies a concrete pre-merge path for blocking an applicable known vulnerability without claiming all release gates use it.
    reviewer: product-security
    review_date: "2026-09-03"
    applies_to:
      - DCR-004
      - DCR-009
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-VM-05.03
    relationship: supports
    confidence: medium
    rationale: The workflow automatically evaluates known vulnerabilities in changed supported dependencies but does not detect unknown or unadvised malicious packages.
    reviewer: product-security
    review_date: "2026-09-03"
    applies_to:
      - DCR-001
      - DCR-004
      - DCR-009
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PW.4.1
    relationship: supports
    confidence: medium
    rationale: Pre-merge visibility and blocking of known-vulnerable changed third-party components supports controlled component acquisition without covering origin integrity or ongoing vulnerability management.
    reviewer: product-security
    review_date: "2026-09-03"
    applies_to:
      - DCR-001
      - DCR-004
      - DCR-009
  - framework: mitre-attack
    version: "v19.1"
    id: T1195.001
    relationship: mitigates
    confidence: medium
    rationale: Focused required review of changed direct and transitive dependencies reduces adoption of known-vulnerable software dependencies but cannot establish package trustworthiness.
    reviewer: product-security
    review_date: "2026-09-03"
    applies_to:
      - DCR-001
      - DCR-004
      - DCR-009
limitations:
  - A separate control is unnecessary when an existing required pull-request SCA check already provides dependency diff risk failure and merge enforcement.
  - GitHub-native enforcement requires a supported repository plan dependency graph manifest ecosystem and active ruleset.
  - Provider and ecosystem coverage for transitive dependency relationships varies and incomplete coverage remains NOT_CHECKED.
  - A provider high-severity label does not prove product-specific reachability exploitability or business impact and requires contextual triage after blocking.
  - Static repository tests cannot prove live dependency graph data provider availability or merge enforcement.
  - Unknown vulnerabilities malicious-but-unadvised packages registry substitution install-time execution and provenance remain outside this control.
  - Framework mappings are supporting relationships and do not claim complete OSPS SSDF or MITRE coverage.
status: reference
owner: product-security
evidence_level: E3
