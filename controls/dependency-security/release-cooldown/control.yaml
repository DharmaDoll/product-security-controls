limitations:
  - 7日のcooldownは運用baselineであり、packageが安全になることを保証する時間ではない。
  - 待機期間を過ぎたmalware、長期潜伏、typosquatting、dependency confusionは別controlが必要である。
  - Metadata snapshotの真正性とregistry自体の非侵害はこのlocal verifierだけでは証明できない。
  - 緊急security updateでは期限付きexact version例外が必要になる場合がある。
  - Cooldownはlockfile、integrity、dependency review、SCA、registry制限と組み合わせる必要がある。
  - Metadata取得または検証器の失敗をcleanな結果として扱ってはいけない。
  - Proxy blocklistは既知またはproviderが検知したpackageに依存し、malicious packageをすべて遮断できるとは限らない。
  - このlocal fixtureはMDM適用状態、public registryへの実network egress拒否、またはproxy serviceの可用性を単独では証明しない。
  - Native profileはpackage managerの対応version、設定precedence、registryのpublish-time metadataに依存し、local fixtureだけでは実端末への適用状態を証明しない。
  - Direct-public npm adapterは一つのexact package versionだけを判定するため、CIはPSB-DEPS-004のtrusted graph deltaから全候補を列挙する必要がある。
  - Direct-public registryではmanaged proxyのmalware blocking、download tracking、breach notification、central egress enforcementを利用できない。
  - Repository .npmrcより優先されるCLI、environment、user設定はlive effective-config verificationなしでは検出できない。
  - npm 11.10.0未満はmin-release-ageを保持または表示してもnative enforcementを提供しないため、trusted CI adapterが必要である。
  - cooldowns.devはcommunity-maintainedな機能発見用referenceであり、framework mappingまたは公式な設定仕様として扱わない。
  - cooldowns helper scriptは実行せず、global user configurationを暗黙変更する導入方法をこのcontrolは許可しない。
status: prototype
owner: product-security
evidence_level: E3
