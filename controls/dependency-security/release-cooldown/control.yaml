id: PSB-DEPS-001
title: managed registry proxyとrelease cooldownで依存パッケージ採用を制御
domain: dependency-security
summary: 依存パッケージの取得を管理対象プロキシへ固定し、新バージョンの採用を一定期間遅らせて、レジストリ迂回と公開直後のサプライチェーン攻撃への露出を減らす。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: DEPENDENCY-NEW-RELEASE-COMPROMISE
    description: 侵害されたmaintainerまたはregistryから公開された直後のmalicious versionを開発端末やCIが自動採用する。
  - id: DEPENDENCY-COOLDOWN-BYPASS
    description: allowlist外registry、integrity欠落、広すぎる例外、またはmetadata検証失敗によってcooldownが迂回される。
  - id: DEPENDENCY-PROXY-BYPASS
    description: 開発者設定のdrift、direct fallback、またはpublic registryへの直接通信により、managed security proxyの検査と追跡が迂回される。
implementations:
  insecure:
    - insecure/cooldown-policy.json
    - insecure/lockfile.json
    - insecure/registry-metadata.json
    - insecure/artifacts/brand-new-lib-9.9.9.artifact
    - insecure/registry-proxy-policy.json
    - insecure/native-cooldown-policy.json
    - insecure/clients/npmrc
    - insecure/clients/pip.conf
    - insecure/clients/uv.toml
    - insecure/clients/pnpm-workspace.yaml
    - insecure/clients/yarnrc.yml
    - insecure/clients/go.env
    - insecure/clients/composer.json
    - insecure/direct-public-registry/.npmrc
  secure:
    - secure/cooldown-policy.json
    - secure/lockfile.json
    - secure/registry-metadata.json
    - secure/artifacts/stable-lib-1.4.0.artifact
    - secure/artifacts/urgent-security-fix-2.0.1.artifact
    - secure/registry-proxy-policy.json
    - secure/native-cooldown-policy.json
    - secure/clients/npmrc
    - secure/clients/pip.conf
    - secure/clients/uv.toml
    - secure/clients/pnpm-workspace.yaml
    - secure/clients/yarnrc.yml
    - secure/clients/go.env
    - secure/clients/composer.json
    - secure/direct-public-registry/.npmrc
    - scripts/check_npm_release_age.py
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-001
  expected:
    - 7日以上経過したdependencyが許可される
    - exactかつowner、理由、承認者、期限付きの緊急例外だけがcooldownを迂回できる
    - cooldownが短すぎるpolicy、公開直後version、allowlist外registry、integrity欠落が拒否される
    - lockfile artifactのsha256がmetadataおよび実ファイルと一致する
    - metadata欠落、JSON破損、artifact読取失敗がcleanな結果と区別される
    - npm、pip、Go、Composerがmanaged registry proxyだけを使用し、direct fallbackを持たない
    - proxy障害はERRORとなり、malicious-package blocklistを168時間cooldownの代替として扱わない
    - npm、pip、uv、pnpm、Yarnのnative cooldown sampleが168時間baselineを維持する
    - metadata欠落をfail-openにする設定と永続的なpackage除外が拒否される
    - official npm registryのexact versionがinstall前に判定され、fresh releaseはCOOLDOWN_WAITとなる
    - direct-public npm設定の短縮、永続除外、before override、range保存、lockfile無効化が拒否される
    - npm registry metadataの欠落、malformed response、network failure、live clock overrideがERRORとなる
checks:
  - id: COOL-001
    title: New dependency releases observe the minimum cooldown
    required_state: release age is at least seven days
    responsible_role: repository-admin
    applies_to:
      - dependency-update
    context:
      threat_actor: attacker publishing a compromised package version through a maintainer account
      attack_or_failure_scenario: automation adopts the release immediately before community detection yanking or advisory publication
      why_required: a minimum observation window reduces exposure to attacks whose warning signals emerge shortly after release
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: releases younger than the policy minimum are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: COOL-002
    title: Urgent dependency exceptions are exact and time bound
    required_state: exact version owner reason approver and expiry required
    responsible_role: security
    applies_to:
      - dependency-update
    context:
      threat_actor: maintainer bypassing cooldown for urgent fixes or attacker abusing a broad exception
      attack_or_failure_scenario: an exception covers extra packages versions or time beyond the reviewed emergency
      why_required: exact owned expiring approval permits urgent response without permanently removing the observation window
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: broad incomplete and expired exceptions are rejected
      evidence:
        - sanitized verifier output
        - exception approval
    mapping_status: reviewed
  - id: COOL-003
    title: Cooldown policy cannot be weakened below the baseline
    required_state: minimum cooldown is seven days
    responsible_role: repository-admin
    applies_to:
      - dependency-policy
    context:
      threat_actor: configuration drift or contributor reducing the waiting period for convenience
      attack_or_failure_scenario: nominal cooldown remains enabled but its value is lowered below the reviewed baseline
      why_required: enforcing the policy floor prevents semantic weakening that a simple enabled check would miss
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: shorter cooldown policy values are rejected
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: COOL-004
    title: Dependency metadata comes from an approved registry
    required_state: credential-free HTTPS registry allowlist
    responsible_role: repository-admin
    applies_to:
      - dependency-registry
    context:
      threat_actor: dependency-confusion publisher or registry metadata source controlled by an attacker
      attack_or_failure_scenario: release age and version facts come from an unapproved registry origin
      why_required: cooldown decisions are trustworthy only when metadata is bound to an approved credential-free HTTPS source
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: metadata from an unapproved registry is rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: COOL-005
    title: Cooldown inputs and artifacts are integrity verified
    required_state: lockfile metadata and artifact SHA-256 values match
    responsible_role: developer
    applies_to:
      - dependency-artifact
    context:
      threat_actor: metadata tampering cache poisoning or artifact replacement after age approval
      attack_or_failure_scenario: an old enough version passes cooldown but its metadata or downloaded bytes differ from expected content
      why_required: integrity checks ensure cooldown applies to the exact artifact under review rather than only its version label
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: missing or mismatched integrity values are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: COOL-006
    title: Cooldown verification failures are not clean results
    required_state: metadata parse and artifact read failures produce an error
    responsible_role: repository-admin
    applies_to:
      - dependency-verifier
    context:
      threat_actor: registry failure malformed metadata missing artifact or assessment tooling error
      attack_or_failure_scenario: release age or integrity cannot be established but dependency adoption is reported clean
      why_required: operational failure must block or escalate because no observation guarantee was verified
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: input failures use a distinct non-zero result
      evidence:
        - negative-test output
    mapping_status: unmapped
  - id: COOL-007
    title: Managed dependency proxy is mandatory and fail closed
    required_state: centrally distributed proxy-only routes with no direct fallback and ERROR on outage
    responsible_role: security
    applies_to:
      - developer-endpoint
      - dependency-registry
    context:
      threat_actor: malicious package publisher or local process attempting to bypass registry inspection
      attack_or_failure_scenario: package-manager drift direct fallback or public-registry egress avoids proxy blocking tracking and notification
      why_required: a centrally enforced proxy route turns an optional developer setting into a consistent dependency acquisition guardrail
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-DEPS-001 and inspect MDM or CI distribution plus public-registry egress policy
      expected: npm pip Go and Composer use only the managed proxy; direct fallback is denied and proxy failure is ERROR
      evidence:
        - sanitized verifier output
        - managed configuration export
        - egress policy evidence
    mapping_status: reviewed
  - id: COOL-008
    title: Proxy malware blocking does not replace release cooldown
    required_state: repository-owned 168-hour pre-resolution verifier remains authoritative
    responsible_role: repository-admin
    applies_to:
      - dependency-update
      - dependency-registry
    context:
      threat_actor: newly malicious publisher whose release is not yet present in provider blocklists
      attack_or_failure_scenario: teams treat proxy allow or block results as proof that a newly published version completed an observation period
      why_required: malware intelligence and package age answer different questions and both controls are required
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-001
      expected: policy retains the 168-hour repository verifier and explicitly does not rely on undocumented proxy minimum-age behavior
      evidence:
        - sanitized verifier output
        - proxy capability review
    mapping_status: reviewed
  - id: COOL-009
    title: Native package-manager cooldown profiles preserve the baseline
    required_state: reviewed repository or managed templates enforce at least 168 hours and fail closed
    responsible_role: repository-admin
    applies_to:
      - dependency-update
      - developer-endpoint
      - build-environment
    context:
      threat_actor: compromised maintainer publishing a malicious release or contributor weakening a local client setting
      attack_or_failure_scenario: a package manager resolves a release before the repository verifier or treats missing publication metadata as eligible
      why_required: native client gates reduce accidental early resolution while the repository-owned verifier remains the authoritative cross-ecosystem decision
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-DEPS-001 and inspect the managed client configuration inventory
      expected: npm pip uv pnpm and Yarn retain the 168-hour floor; missing metadata and precedence overrides are not accepted as clean
      evidence:
        - sanitized verifier output
        - managed client configuration inventory
    mapping_status: reviewed
  - id: COOL-010
    title: Native cooldown bypasses are non-persistent and exception-bound
    required_state: no package wildcard or durable client exclusion; emergency adoption uses the exact expiring repository exception
    responsible_role: security
    applies_to:
      - dependency-update
      - dependency-policy
    context:
      threat_actor: maintainer requesting an urgent update or attacker exploiting a broad package-manager exclusion
      attack_or_failure_scenario: a temporary bypass remains in client configuration and silently admits later malicious releases
      why_required: binding emergency adoption to the reviewed exact-version exception avoids creating a permanent alternate path around cooldown
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-DEPS-001 and review active exception records
      expected: persistent native exclusions are rejected and urgent bypasses are represented only by exact owner-approved expiring exceptions
      evidence:
        - negative-test output
        - exception approval
    mapping_status: reviewed
