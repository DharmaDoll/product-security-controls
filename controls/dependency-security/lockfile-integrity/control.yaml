id: PSB-DEPS-003
title: lockfileと取得artifactの完全性を強制する
domain: dependency-security
summary: 固定された依存関係グラフとマニフェスト、管理対象プロキシの取得元、正確なバージョン、成果物の完全性が一致することを検証する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: DEPENDENCY-LOCKFILE-INTEGRITY-BYPASS
    description: Lockfile書換え、未承認registry、version range、またはartifact差替えによりreview済みdependency graphが迂回される。
implementations:
  insecure:
    - insecure/policy.json
    - insecure/manifest.json
    - insecure/lockfile.json
    - insecure/artifacts/floating-lib-9.9.9.pkg
  secure:
    - secure/policy.json
    - secure/manifest.json
    - secure/lockfile.json
    - secure/artifacts/stable-lib-1.4.0.pkg
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-003
  expected:
    - frozen lockfileとmanifestのdependency集合およびversionが一致する
    - registryがcredentialなしHTTPS allowlistに限定される
    - artifact SHA-256がlockfileと一致する
    - version range、lockfile書換え、artifact改ざんが拒否される
    - 入力欠落またはparse失敗がcleanな結果と区別される
    - lockfileのregistry originがmanaged security proxyへ固定され、direct fallbackとclean-on-outageが拒否される
checks:
  - id: LOCK-001
    title: Manifest and frozen lockfile dependency graphs match
    required_state: identical dependency names and exact versions
    responsible_role: developer
    applies_to:
      - dependency-graph
    context:
      threat_actor: contributor or tooling changing dependencies without regenerating reviewed lock state
      attack_or_failure_scenario: manifest intent and installed exact graph diverge so reviewers assess different dependencies than builds use
      why_required: graph equality makes the lockfile a faithful executable representation of the reviewed manifest
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: graph drift and implicit lockfile rewrites are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: LOCK-002
    title: Dependency origin is bound to the managed security proxy
    required_state: approved credential-free HTTPS proxy only with no direct fallback and ERROR on outage
    responsible_role: repository-admin
    applies_to:
      - dependency-registry
    context:
      threat_actor: dependency-confusion publisher network attacker or credential-bearing registry misconfiguration
      attack_or_failure_scenario: packages resolve from an unapproved origin direct fallback bypasses inspection or registry access leaks credentials
      why_required: binding lockfile origin to a credential-free HTTPS managed proxy constrains source transport and the enforced inspection path
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: unapproved origins direct fallback clean-on-outage and embedded credentials are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: LOCK-003
    title: Downloaded artifact digest matches the lockfile
    required_state: verified SHA-256 for every artifact
    responsible_role: developer
    applies_to:
      - dependency-artifact
    context:
      threat_actor: registry compromise cache poisoning or artifact substitution in transit
      attack_or_failure_scenario: the resolved package name and version are correct but downloaded bytes differ from reviewed content
      why_required: artifact digest verification protects the content boundary that version pinning alone cannot
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: modified artifacts and missing integrity values are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: LOCK-004
    title: Floating versions and dependency graph changes are rejected
    required_state: exact versions and frozen reviewed lockfile
    responsible_role: developer
    applies_to:
      - dependency-graph
    context:
      threat_actor: contributor introducing ranges floating selectors or implicit lockfile updates
      attack_or_failure_scenario: future resolution changes the dependency graph without a corresponding reviewed repository diff
      why_required: exact frozen resolution makes dependency changes explicit and reproducible
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: version ranges lockfile changes and substitutions fail validation
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: LOCK-005
    title: Lockfile verification failures are not clean results
    required_state: missing unreadable or malformed input produces an error
    responsible_role: developer
    applies_to:
      - dependency-verifier
    context:
      threat_actor: unreadable malformed or missing manifest lockfile metadata or artifact
      attack_or_failure_scenario: integrity comparison cannot complete yet reports a clean dependency graph
      why_required: ERROR state preserves the difference between verified equality and unavailable evidence
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: verifier errors use a distinct non-zero result
      evidence:
        - negative-test output
    mapping_status: unmapped
mappings:
  - framework: mitre-attack
    version: "v19.1"
    id: T1195.001
    relationship: mitigates
    confidence: high
    rationale: Software dependencyの解決結果と取得artifactを固定・検証し、dependency compromiseや取得経路改ざんによる差替えを抑制する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - LOCK-001
      - LOCK-002
      - LOCK-003
      - LOCK-004
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PW.4.1
    relationship: supports
    confidence: high
    rationale: Third-party componentの取得元、version、dependency graph、integrityを機械検証しcontrolled acquisitionを支援する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - LOCK-001
      - LOCK-002
      - LOCK-003
      - LOCK-004
limitations:
  - 正しいhashはartifactの安全性を証明しない。
  - 実package manager固有lockfileには個別adapterが必要である。
  - Registry、package manager、review済みlockfile自体の侵害は別controlが必要である。
  - 検証器または入力読取失敗をcleanな結果として扱ってはいけない。
  - Local fixtureはendpointの実network egress制御またはmanaged proxyの可用性を証明しない。
status: prototype
owner: product-security
evidence_level: E3
