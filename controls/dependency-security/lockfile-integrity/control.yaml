id: PSB-DEPS-003
title: native lockfileと取得artifactの完全性を強制する
domain: dependency-security
summary: Native package managerのimmutable installを使い、review済みmanifestとdirect／transitive lock graphの鮮度、lockfile不変性、取得artifact integrityを検証する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: DEPENDENCY-LOCKFILE-INTEGRITY-BYPASS
    description: Manifest drift、暗黙の再解決またはlockfile更新、cache／mirror／registry上のartifact差替えにより、review済みdependency graphとbuild inputが乖離する。
implementations:
  insecure:
    - insecure/javascript/npm/install-mutable.sh
    - insecure/python/uv/install-frozen-without-freshness.sh
  secure:
    - secure/javascript/npm/install-locked.sh
    - secure/javascript/npm/verify-package-lock.mjs
    - secure/javascript/pnpm/install-locked.sh
    - secure/javascript/pnpm/PNPM_VERSION
    - secure/javascript/pnpm/RUNTIME.md
    - secure/javascript/yarn/.yarnrc.yml
    - secure/javascript/yarn/README.md
    - secure/javascript/bun/bunfig.toml
    - secure/javascript/bun/README.md
    - secure/python/pip/install-locked.sh
    - secure/python/uv/install-locked.sh
    - secure/python/uv/install-locked-wheel-only.sh
    - secure/python/uv/sync-hashed-requirements.sh
    - secure/python/uv/UV_VERSION
    - secure/python/uv/RUNTIME.md
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-003
  expected:
    - npm、pip、uvのnative immutable installがdirect／transitive fixtureで成功する
    - digest検証済みpnpm 11.25.0 runtimeを指定した場合にnative frozen installが成功する
    - manifest driftがlockfileを書き換えずに拒否される
    - transitive artifactをvalidだがbyte-differentなpackageへ差し替えると拒否される
    - hash欠落、lockfile欠落、runtime欠落がclean resultと区別される
    - uv --lockedがstale manifestを拒否し、--frozenだけでは同じ鮮度を保証しないことが実証される
checks:
  - id: LOCK-001
    title: Manifest and lockfile freshness is enforced
    required_state: immutable install rejects a manifest that requires lockfile regeneration
    responsible_role: developer
    applies_to:
      - dependency-manifest
      - native-lockfile
    context:
      threat_actor: contributor or dependency update automation changing a manifest without a reviewed lockfile update
      attack_or_failure_scenario: build proceeds from a stale or implicitly regenerated lockfile so the reviewed manifest and installed resolution do not correspond
      why_required: explicit freshness validation makes the manifest-to-lock transition visible in the same reviewed change
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: npm ci, pnpm frozen install, and uv --locked reject manifest drift; pip hash mode rejects non-exact requirements
      evidence:
        - sanitized native installer output
    mapping_status: reviewed
  - id: LOCK-002
    title: Direct and transitive dependency records are locked
    required_state: the native lock or hashed requirements file records the complete install graph supported by the selected profile
    responsible_role: developer
    applies_to:
      - direct-dependency
      - transitive-dependency
    context:
      threat_actor: compromised upstream metadata or later resolver output selecting a different transitive dependency
      attack_or_failure_scenario: a direct version remains unchanged while a transitive package changes during a later resolution
      why_required: preserving the resolver's complete reviewed graph prevents ordinary builds from silently selecting a new transitive package
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: native installers reproduce direct and transitive fixture records without regenerating the lock
      evidence:
        - sanitized direct and transitive fixture output
    mapping_status: reviewed
  - id: LOCK-003
    title: Downloaded artifact integrity matches the lock record
    required_state: every supported external artifact has strong integrity metadata and byte verification succeeds
    responsible_role: developer
    applies_to:
      - dependency-artifact
      - package-cache
    context:
      threat_actor: registry, mirror, or cache attacker substituting package bytes after dependency resolution
      attack_or_failure_scenario: the selected package name and version match review but the bytes consumed by the build differ from the locked artifact
      why_required: content integrity closes the gap left by name and version pinning alone
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: missing transitive integrity and valid but byte-different tarballs or wheels are rejected
      evidence:
        - sanitized native integrity failure output
    mapping_status: reviewed
  - id: LOCK-004
    title: Normal install cannot rewrite the reviewed lockfile
    required_state: the build uses the native immutable command and the lockfile digest is unchanged
    responsible_role: repository-admin
    applies_to:
      - build-install-step
      - native-lockfile
    context:
      threat_actor: CI configuration or developer command invoking a mutable install during an ordinary build
      attack_or_failure_scenario: the package manager repairs or rewrites the lockfile before installing and hides an unreviewed graph change in ephemeral build state
      why_required: a separate immutable install path ensures dependency changes occur only in an explicit reviewable update workflow
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: successful native installs leave package-lock.json, pnpm-lock.yaml, and uv.lock unchanged
      evidence:
        - before and after lockfile digests from the self-test
    mapping_status: reviewed
  - id: LOCK-005
    title: Unavailable lock verification is an error
    required_state: missing input, unsupported schema, or unavailable runtime returns a non-zero error rather than a clean result
    responsible_role: repository-admin
    applies_to:
      - dependency-install-verifier
    context:
      threat_actor: broken CI environment, missing package manager, or malformed lock input suppressing verification
      attack_or_failure_scenario: integrity comparison never runs but downstream automation treats tool absence or parser failure as a verified graph
      why_required: fail-closed error handling preserves the distinction between successful verification and unavailable evidence
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-003
      expected: missing runtimes and inputs use a non-zero error path and pnpm absence is explicitly reported as NOT_CHECKED
      evidence:
        - sanitized missing-runtime and malformed-input output
    mapping_status: unmapped
mappings:
  - framework: mitre-attack
    version: "v19.1"
    id: T1195.001
    relationship: mitigates
    confidence: high
    rationale: Reviewed dependency graphと取得artifact bytesをnative lockへ固定して通常buildで再検証し、software dependency差替えの機会を狭める。
    reviewer: product-security
    review_date: "2026-08-31"
    applies_to:
      - LOCK-001
      - LOCK-002
      - LOCK-003
      - LOCK-004
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PW.4.1
    relationship: supports
    confidence: high
    rationale: Third-party componentの完全graph、version、artifact integrityをreview可能なnative lockで維持し、controlled component acquisitionを支援する。
    reviewer: product-security
    review_date: "2026-08-31"
    applies_to:
      - LOCK-001
      - LOCK-002
      - LOCK-003
      - LOCK-004
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-BR-05.01
    relationship: supports
    confidence: medium
    rationale: npm、pnpm、pip、uvというstandardized dependency management toolingのnative immutable modeをcopy可能なbuild手順として提供する。
    reviewer: product-security
    review_date: "2026-08-31"
    applies_to:
      - LOCK-001
      - LOCK-002
      - LOCK-004
limitations:
  - Lockfileはresolverが選択した推移的dependencyを固定するが、そのdependencyが安全、脆弱性なし、または組織policyに適合することは証明しない。
  - Review済みlockfile自体へ悪意ある変更が入った場合は、CODEOWNER reviewやdependency change reviewが別途必要である。
  - npm preflightが許可するdeclared workspace以外のlocal directory、mutable VCS、hash無しsourceは別profileまたは期限付き例外が必要である。
  - Platform-specific、optional、native、source-build dependencyは採用projectの実platform matrixでも確認が必要である。
  - Registry origin、dependency confusion、network egress、credential injectionはこのcontrolのboundary外である。
  - Lifecycle scriptはwrapperで無効にするが、scriptを必要とするpackageの承認と隔離はinstall-script controlが必要である。
  - YarnとBunの設定はreference-onlyであり、このrepositoryのnative tamper testを通したimplementationではない。
  - Local fixtureは採用組織のlive registry、branch protection、runtime provenance、またはorganization adoptionを証明しない。
status: prototype
owner: product-security
evidence_level: E3
