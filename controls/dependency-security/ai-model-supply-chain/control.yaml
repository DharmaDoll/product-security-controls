limitations:
  - Synthetic tiny Safetensors and dataset fixtures do not establish security quality accuracy bias privacy or robustness of a live model or dataset.
  - The repository-native parser verifies the fields needed by this control and is not the full Safetensors 0.8.0 implementation or full CycloneDX 1.7 JSON Schema validator.
  - Safetensors removes embedded Python object execution but parsers loaders tensor values downstream kernels and model code can still contain denial-of-service memory-safety or logic risks.
  - Signed clean inspection cannot detect every malware payload semantic backdoor poisoned weight or poisoned dataset and a compromised authorized signer can sign harmful evidence.
  - Dataset license use authorization consent and personal-data classification require organization-owned evidence; the repository fixture proves only the contract.
  - The checked-in Ed25519 public key and signatures are test-only and do not model HSM custody certificate chains transparency logs timestamp services or live revocation.
  - The central worker uses local filesystem namespaces to verify state promotion and readback behavior; it does not prove live OCI registry IAM KMS egress or audit-log configuration.
  - The local one-shot worker has both quarantine and trusted write access; high-value production deployments should split fetch and promotion identities as described in the adoption guide.
  - RAG source authorization tenant isolation index deletion retrieval provenance and poisoning tests are intentionally deferred to a separate control.
  - AI TEVV adversarial model evaluation and release thresholds are intentionally deferred to a detection-verification control.
  - This control is not evidence that an AI system or any framework category is completely secure or compliant.
