id: PSB-DEPS-005
title: Verify AI model and dataset supply-chain integrity
domain: dependency-security
summary: AI model、dataset、loader、CycloneDX ML-BOM、署名済みinspection、deployment handoffをexact digestへ結び、unsafe serializationと不完全な検証を隔離する。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: AI-MODEL-MUTABLE-ACQUISITION
    description: A mutable model or dataset revision changes after review and supplies different bytes under the same human-readable name.
  - id: AI-MODEL-UNSAFE-SERIALIZATION
    description: Pickle or custom loader behavior executes attacker-controlled code while loading model weights.
  - id: AI-MODEL-INCOMPLETE-INVENTORY
    description: Model dataset loader and application relationships are absent or mismatched in the ML-BOM and impact analysis misses the deployed dependency.
  - id: AI-MODEL-TAMPERED-ATTESTATION
    description: Model bytes inspection results or signer identity are substituted after security review.
  - id: AI-DATASET-UNAUTHORIZED-USE
    description: Unversioned unlicensed or unauthorized dataset bytes enter training or fine-tuning without attributable provenance.
  - id: AI-MODEL-QUARANTINE-BYPASS
    description: A failed or unverified model is handed to deployment by trusting a declared ACCEPTED status rather than exact evidence.
  - id: AI-MODEL-VERIFIER-FAIL-OPEN
    description: Missing stale malformed or unavailable signer and inspection evidence is interpreted as a clean model result.
implementations:
  insecure:
    - insecure/intake-request.json
    - insecure/acquisition.json
    - insecure/artifacts/inert-unsafe-model.pkl.b64
    - insecure/artifacts/synthetic-training.jsonl
    - insecure/model.mlbom.cdx.json
    - insecure/intake-attestation.json
    - insecure/intake-attestation.sig.b64
    - insecure/deployment-handoff.json
  secure:
    - secure/service-policy.json
    - secure/intake-request.json
    - secure/policy.json
    - secure/acquisition.json
    - secure/artifacts/tiny-model.safetensors.b64
    - secure/artifacts/synthetic-training.jsonl
    - secure/model.mlbom.cdx.json
    - secure/intake-attestation.json
    - secure/intake-attestation.sig.b64
    - secure/signer-status.json
    - secure/trust/model-intake-test-public.pem
    - secure/deployment-handoff.json
    - scripts/intake_worker.py
    - scripts/verify.py
    - docs/CENTRAL_INTAKE_ADOPTION.md
verification:
  commands:
    - make verify-control CONTROL=PSB-DEPS-005
  expected:
    - immutable HTTPS model and dataset identities bind exact local bytes
    - CycloneDX 1.7 ML-BOM binds the application model dataset and pinned loader graph
    - only bounded Safetensors structure is inspected without importing the model or loader
    - unsafe serialization custom loader remote-code and inspection findings are quarantined
    - Ed25519 signature exact materials inspector identity and current signer lifecycle are verified
    - dataset license use authorization and personal-data declaration match consumer policy
    - deployment handoff binds only the accepted model ML-BOM dataset and PSB-DEPS-003 loader identity
    - unavailable stale malformed or failed verification exits 2 as ERROR rather than clean
    - evidence excludes model bytes dataset rows signatures keys and source credentials
    - central intake snapshots the exact request bundle in quarantine before verification and promotes only accepted staging bytes
    - central promotion is idempotent rejects request ID reuse and verifies the trusted digest after write
    - quarantine findings and verification errors leave the trusted namespace unchanged
checks:
  - id: AMS-001
    title: Model acquisition identity and bytes are immutable
    required_state: exact HTTPS source model ID version full revision decoded artifact SHA-256 and byte size match consumer-owned policy
    responsible_role: build-platform
    applies_to:
      - model-registry-acquisition
      - model-weight-artifact
    context:
      threat_actor: compromised model publisher registry operator dependency updater or developer selecting a mutable latest revision
      attack_or_failure_scenario: reviewed model bytes are replaced under the same model name tag or branch before training evaluation or deployment
      why_required: an exact source revision and independently recomputed artifact digest identify the same bytes across review quarantine and deployment
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: the central worker stores the secure full-revision digest-bound model under its quarantine digest while mutable source HTTP latest revision and changed bytes never reach trusted storage
      evidence:
        - sanitized AMS-001 result
        - model ID version revision digest and size without model content
    mapping_status: reviewed
  - id: AMS-002
    title: ML-BOM records the exact application model dataset and loader graph
    required_state: CycloneDX 1.7 root application depends on one exact machine-learning-model which depends on exact data and loader components with matching hashes and provenance properties
    responsible_role: build-platform
    applies_to:
      - cyclonedx-mlbom
      - ai-dependency-graph
    context:
      threat_actor: incomplete inventory generator malicious supplier or operator attaching a valid model inventory to the wrong product
      attack_or_failure_scenario: incident and vulnerability lookup cannot identify which dataset and loader produced or serves an affected deployed model
      why_required: artifact integrity alone does not preserve model-to-data-to-loader-to-application relationships needed for impact analysis and controlled handoff
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: exact component types identities hashes model-card dataset reference and dependency edges pass while omitted or mismatched relationships quarantine
      evidence:
        - sanitized AMS-002 result
        - ML-BOM serial and digest without dataset rows or weight bytes
    mapping_status: reviewed
  - id: AMS-003
    title: Model loading uses a non-executable format and pinned loader
    required_state: serialization is Safetensors remote code is false executable extensions are denied and loader version source commit and PSB-DEPS-003 handoff are exact
    responsible_role: build-platform
    applies_to:
      - model-serialization
      - model-loader-dependency
      - remote-code-policy
    context:
      threat_actor: malicious model publisher compromised registry or developer enabling trust_remote_code or a convenient custom loader
      attack_or_failure_scenario: loading a model deserializes attacker-controlled objects imports repository code or executes a mutable loader with developer or service authority
      why_required: a correct hash authenticates dangerous bytes but does not make executable serialization safe so the accepted format and loader need an independent deny-by-default boundary
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: Safetensors and the exact pinned loader pass while pickle custom loader executable extensions and remote-code requests quarantine
      evidence:
        - sanitized AMS-003 result
        - serialization and loader identity without executing either artifact
    mapping_status: reviewed
  - id: AMS-004
    title: Safetensors structure is inspected without model execution
    required_state: base64-decoded fixture has a bounded valid unique-key JSON header allowed dtype and dimensions and a complete non-overlapping tensor buffer
    responsible_role: security
    applies_to:
      - model-static-inspection
      - safetensors-weight-artifact
    context:
      threat_actor: malicious artifact author crafting oversized duplicate-key overlapping truncated or polyglot-like tensor data
      attack_or_failure_scenario: a parser consumes unbounded metadata accepts ambiguous ranges or allocates from hostile shapes before the model reaches a runtime sandbox
      why_required: choosing a non-code format reduces arbitrary execution but does not replace bounded parsing and structural validation of untrusted binary input
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: the minimal safe tensor is parsed from raw bytes without import while invalid header size duplicate keys dtype shape gaps overlaps and changed bytes quarantine
      evidence:
        - sanitized AMS-004 result
        - header size tensor count dtype and structural decision without tensor values
    mapping_status: reviewed
  - id: AMS-005
    title: Inspection materials and signer lifecycle are cryptographically bound
    required_state: a valid Ed25519 signature from one current model-scoped signer binds exact acquisition ML-BOM dataset model and pinned verifier digests to complete clean inspection
    responsible_role: security
    applies_to:
      - model-intake-attestation
      - inspection-receipt
      - signer-status
    context:
      threat_actor: model supplier forger compromised transfer path revoked signer or pipeline reusing a favorable scan from different bytes
      attack_or_failure_scenario: an unsigned changed stale or finding-bearing model is presented with unrelated clean inspection metadata and accepted
      why_required: recomputing artifact hashes detects changes but a trusted signature and current scope are needed to attribute the security decision to the exact inspected materials
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: exact signed materials and active scoped signer pass while tampering unknown expired revoked stale incomplete or finding-bearing evidence cannot pass
      evidence:
        - sanitized AMS-005 result
        - signer ID status receipt ID and material digests without signature or key body
    mapping_status: reviewed
  - id: AMS-006
    title: Dataset provenance license and use authorization are exact
    required_state: dataset ID version HTTPS source full revision digest license approved-use reason and no-personal-data declaration match policy and ML-BOM
    responsible_role: shared
    applies_to:
      - training-dataset
      - fine-tuning-dataset
      - dataset-license
    context:
      threat_actor: poisoned dataset publisher unauthorized data contributor careless data scientist or mutable dataset registry
      attack_or_failure_scenario: changed unlicensed personal or unapproved data enters training while the model record retains an unrelated benign dataset name
      why_required: model artifact checks cannot establish which exact data was authorized for use so dataset identity governance remains an independent dependency decision
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-DEPS-005 and review organization data authorization evidence
      expected: exact synthetic dataset bytes and approved license and use reason pass while latest unknown-license personal-data or digest mismatch quarantine
      evidence:
        - sanitized AMS-006 result
        - dataset ID version revision digest license and authorization reference without dataset rows
    mapping_status: reviewed
  - id: AMS-007
    title: Only an accepted exact bundle is handed to deployment
    required_state: staging handoff repeats exact model artifact ML-BOM serial and digest dataset digest pinned loader and PSB-DEPS-003 identity with remote code disabled
    responsible_role: release-manager
    applies_to:
      - model-deployment-handoff
      - model-serving-release
    context:
      threat_actor: compromised deployment job confused deputy or operator copying a declared ACCEPTED field from an unrelated model review
      attack_or_failure_scenario: quarantine is bypassed and a different model dataset loader target environment or remote-code mode reaches serving
      why_required: acceptance has operational effect only when the deployment consumer rechecks the exact evidence identities instead of trusting a free-standing status label
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: exact staging handoff is promoted by immutable digest with readback while production bypass latest model digest substitution custom loader and remote code quarantine without a trusted write
      evidence:
        - sanitized AMS-007 result
        - target environment and immutable dependency digests
    mapping_status: reviewed
  - id: AMS-008
    title: Verification infrastructure failure remains ERROR
    required_state: malformed trusted policy unavailable or stale signer snapshot and missing crypto executable exit 2 as ERROR and never emit accepted or clean
    responsible_role: security
    applies_to:
      - model-intake-verifier
      - signer-status-source
      - cryptographic-verifier
    context:
      threat_actor: service outage stale cache schema change damaged trust store or missing OpenSSL installation
      attack_or_failure_scenario: the model cannot be evaluated but absence of a finding is recorded as permission to deploy
      why_required: operational inability to verify trust is different from both a clean model and a known content violation and must fail closed for reliable automation
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: unavailable stale malformed crypto execution and invalid central storage fixtures return ERROR with exit code 2 and leave trusted storage unchanged
      evidence:
        - sanitized AMS-008 error state
        - operations alert reference without model or dataset content
    mapping_status: reviewed
  - id: AMS-009
    title: Model intake evidence is metadata-only
    required_state: evidence excludes weight bytes dataset rows signatures public or private key material and source credentials
    responsible_role: security
    applies_to:
      - model-security-evidence
      - dataset-confidentiality
      - signing-material
    context:
      threat_actor: broad CI log reader evidence exporter or assessment workbook consumer outside the model and dataset access boundary
      attack_or_failure_scenario: proving control execution creates a second broadly retained copy of proprietary weights training data credentials or trust material
      why_required: decision metadata and digests are sufficient for traceability while copying protected content would create a new supply-chain disclosure path
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-DEPS-005
      expected: metadata-only state and promotion receipts pass while any model dataset signature key or credential inclusion setting quarantines
      evidence:
        - sanitized AMS-009 result
        - check IDs decisions and digests only
    mapping_status: unmapped
