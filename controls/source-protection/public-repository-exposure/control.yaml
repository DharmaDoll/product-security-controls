      - PRE-012
      - PRE-013
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-BR-07.01
    relationship: supports
    confidence: medium
    rationale: Public-surface secret detection push protection and credential-first remediation support secure handling of project secrets without establishing full baseline conformance.
    reviewer: product-security
    review_date: "2026-07-28"
    applies_to:
      - PRE-003
      - PRE-004
      - PRE-005
      - PRE-007
      - PRE-009
  - framework: cisa-product-security-bad-practices
    version: "2 (January 2025)"
    id: CISA-PSBP-PP-08
    relationship: detects
    confidence: medium
    rationale: Current and historical public-source scanning can detect representative hardcoded credentials and secret patterns but does not prove their complete absence.
    reviewer: product-security
    review_date: "2026-07-28"
    applies_to:
      - PRE-003
      - PRE-004
      - PRE-007
      - PRE-009
limitations:
  - GitHub Code Search is not an all-history scanner and search behavior can change.
  - GitHub Code Search is non-exhaustive and limited to indexed default-branch content and at most 100 displayed results.
  - Secret Scanning does not detect every secret type or organization-specific sensitive information.
  - A local clone may omit remote branches refs deleted objects GitHub collaboration content and artifacts.
  - Public forks external indexes cached views screenshots downloads and prior clones may remain outside repository-owner control.
  - Changing public visibility to private does not make existing public forks private.
  - History rewrite changes commit identifiers and can be recontaminated by an old clone.
  - Zero findings are evidence of completed configured checks not proof that no sensitive information exists.
  - Organization indicators cannot classify unregistered codenames encoded split encrypted image-based or semantically confidential code.
status: reference
owner: product-security
evidence_level: E3
