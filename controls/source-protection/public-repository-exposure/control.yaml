id: PSB-SOURCE-003
title: 自社domainを起点とするpublic repository exposure monitoring
domain: source-protection
summary: 自社domainをanchorにGitHubのpublic code、Issue、PR、Gistを攻撃者視点で定期検索し、state branchとの差分から新規・再出現候補を検出してreviewへ渡す。
check_context_version: "1.0"
security_functions:
  - detect
  - verify
  - respond
threats:
  - id: SOURCE-PUBLIC-RECONNAISSANCE
    description: 外部攻撃者が通常のGitHub／Web検索から自社domain、従業員email suffix、内部endpoint、設定情報を収集し、資産列挙やcredential探索へ利用する。
  - id: SOURCE-UNKNOWN-PUBLIC-COPY
    description: Inventory外のpublic repository、個人repository、fork、mirror、Gist、Issue、PRに自社関連情報が残り、既知repository単位の検査では発見できない。
  - id: SOURCE-REVIEW-REAPPEARANCE
    description: 一度reviewまたはremediationした公開候補が変更・再出現しても既知扱いのまま通知されず、継続露出になる。
  - id: SOURCE-MONITOR-FALSE-CLEAN
    description: API、pagination、truncation、rate limit、state更新の失敗が0 findingsとして扱われ、未検査範囲がcleanと誤認される。
implementations:
  insecure:
    - insecure/domain-monitor.json
  secure:
    - secure/domain-monitor.json
    - secure/state/findings.json
    - secure/.github/workflows/public-exposure-monitor.yml
    - scripts/monitor-public-exposure.py
    - docs/PUBLIC_EXPOSURE_MONITOR_POC_SPEC.md
verification:
  commands:
    - make verify-control CONTROL=PSB-SOURCE-003
  expected:
    - 自社domainだけからpublic code、Issue、PR、Gistおよびbrowser review用の固定query catalogが生成される
    - private repository result、incomplete result、pagination逸脱、Gist truncationがcleanとして扱われない
    - provider resultがmatched contentを持たないallow-list fieldだけへ正規化される
    - 初出はNEW、同一resultはknown、review期限切れとremediated後の再出現はREOPENEDになる
    - state updateが専用branchのexact base blob SHAを使うcompare-and-swapになる
    - workflowがtrusted trigger、最小permission、full SHA pin、分離したsearch／state identityを使う
    - scanner failureがfindingなしのexit 0と異なるexit 2になる
checks:
  - id: MON-001
    title: Reconnaissance queries are anchored to owned domains
    required_state: every automatic and browser query is derived from a reviewed stable ID and organization-owned domain
    responsible_role: security
    applies_to:
      - public-github-search
      - organization-domain
    context:
      threat_actor: GitHubやWeb indexで自社固有のidentityとinfrastructureを探索する外部攻撃者、および第三者を誤って対象にするassessment実行者
      attack_or_failure_scenario: domain anchorがないgeneric queryでは自社候補の差分が再現できず、無関係な第三者情報を大量収集するか未知の自社copyを見逃す。
      why_required: stableな所有domainを全queryのanchorにすると、repository inventory外も探索しながら対象とprovenanceを限定できる。
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-003
      expected: valid domain creates the versioned catalog and URL wildcard email address IP literal and duplicate domain are rejected
      evidence:
        - sanitized unit-test output
        - reviewed domain ownership record
    mapping_status: reviewed
  - id: MON-002
    title: Supported public GitHub surfaces are collected and sanitized
    required_state: code Issue PR and new or updated public Gist results are complete public-only and normalized without matched content
    responsible_role: security
    applies_to:
      - github-code-search
      - github-issues
      - github-pull-requests
      - github-gists
    context:
      threat_actor: Public codeとcollaboration contentからdomain、email、endpoint、credential周辺情報を収集する外部攻撃者とcrawler
      attack_or_failure_scenario: codeだけ、または一つの既知repositoryだけを調べると、Issue、PR、Gist、inventory外repositoryにある攻撃に有用な情報が監視対象から外れる。
      why_required: 公式public APIの複数surfaceを一つのsanitized observation contractへ統合することで、cloneせず低コストにattacker-viewの差分を取得できる。
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-003
      expected: public provider fixtures normalize and deduplicate while private malformed incomplete and truncated fixtures return an error
      evidence:
        - sanitized unit-test output
    mapping_status: reviewed
  - id: MON-003
    title: Findings retain exact expiring review state and notify on recurrence
    required_state: sanitized fingerprints and reviews persist on the dedicated state branch and only NEW or REOPENED occurrences enter notification output
    responsible_role: security
    applies_to:
      - exposure-finding
      - monitor-state
      - notification-handoff
    context:
      threat_actor: Review fatigueを生む重複通知、期限切れ判断を放置する運用、またはremediation済み対象を再公開する変更
      attack_or_failure_scenario: durableでexactなstateがないと同一候補を毎回通知する一方、object変更、review期限切れ、remediation後の再出現を新たな対応対象として区別できない。
      why_required: Provider object identityに結び付くfingerprintと期限付きdispositionは、通知量を抑えつつ再発を再通知するために必要である。
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-SOURCE-003 and inspect a live state commit plus notification handoff in the private monitor repository
      expected: NEW known review-expiry remediated-recurrence and changed-object transitions match the state machine without storing matched content
      evidence:
        - sanitized unit-test output
        - access-controlled live state commit
        - notification delivery record
    mapping_status: reviewed
  - id: MON-004
    title: Scheduled monitoring separates public search from state write authority
    required_state: trusted schedule or manual dispatch uses a public-only search identity and an exact-repository state writer with minimum workflow permissions
    responsible_role: repository-admin
    applies_to:
      - github-actions-workflow
      - github-token
      - state-branch
    context:
      threat_actor: Private codeを検索結果へ混入させる過剰権限token、stateを改ざんするuntrusted pull request、または広いrepository write権限を悪用する侵害process
      attack_or_failure_scenario: 一つの強いcredentialとuntrusted triggerで監視するとprivate resultをpublic exposureと誤認し、入力codeからstate write権限を奪われ得る。
      why_required: Public検索identityとstate更新identityを分離しtrusted triggerだけにwriteを与えることで、attacker-viewの意味とstate integrityを同時に保つ。
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-SOURCE-003 and inspect live Actions permissions token ownership and branch rules
      expected: workflow uses trusted triggers explicit contents write a full-SHA Action and no checkout credential persistence while the search account has no private access
      evidence:
        - sanitized unit-test output
        - live workflow run URL
        - access-controlled identity permission review
        - state branch ruleset export
    mapping_status: unmapped
  - id: MON-005
    title: Browser-only reconnaissance receives a human baseline review
    required_state: generated GitHub Gist and generic Web GET queries are executed by an approved public-only reviewer and dispositioned separately from automated coverage
    responsible_role: security
    applies_to:
      - github-browser-search
      - public-web-index
      - historical-gist-baseline
    context:
      threat_actor: API indexやdelta windowに現れないpublic page、過去Gist、raw content、外部indexを通常browser検索で発見する外部攻撃者
      attack_or_failure_scenario: API runだけを完全な攻撃者視点とみなすと、Web UI固有query、過去baseline、外部indexに残る候補を確認済みと誤認する。
      why_required: HTML scrapingを行わず人が同じGET queryを実行する境界を残すことで、provider policyを守りながらAPI外coverageを明示的に補完できる。
    verification:
      type: manual
      method: execute the generated links using an approved public-only browser identity and retain an access-controlled review record
      expected: every baseline query has execution time reviewer result count and disposition and is not inferred from URL generation
      evidence:
        - access-controlled browser review record
    mapping_status: reviewed
  - id: MON-006
    title: Collection and state failures never report a clean scan
    required_state: input provider pagination truncation and state read or write failures return exit 2 separately from no findings
    responsible_role: security
    applies_to:
      - public-exposure-scanner
      - github-api
      - monitor-state
    context:
      threat_actor: API rate limit、provider response変化、Gist truncation、concurrent state update、malformed data、および監視停止を利用する外部攻撃者
      attack_or_failure_scenario: 検索やstate永続化が完了していないのに0件へ変換されると、未検査の時間帯が安全なrunとして承認される。
      why_required: Detection availabilityは露出の有無と別のsecurity propertyであり、ERRORをfindingなしから分離しなければcontrol failureを見逃す。
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-003
      expected: incomplete malformed escaped private truncated and state-conflict paths fail closed with a distinct scanner error
      evidence:
        - negative-test output
    mapping_status: reviewed
mappings:
  - framework: mitre-attack
    version: "v19.1"
    id: T1593.003
    relationship: detects
    confidence: high
    rationale: Owned-domain searches across public code repositories and related GitHub surfaces mirror the Code Repositories reconnaissance behavior to detect information an attacker can discover; they do not prevent the behavior or cover every public index.
    reviewer: product-security
    review_date: "2026-08-26"
    applies_to:
      - MON-001
      - MON-002
      - MON-005
  - framework: mitre-attack
    version: "v19.1"
    id: T1552.001
    relationship: detects
    confidence: medium
    rationale: Domain-anchored public code and Gist searches can identify candidate credentials or credential-adjacent configuration in files, but do not validate credential presence or validity and are not a complete secret scanner.
    reviewer: product-security
    review_date: "2026-08-26"
    applies_to:
      - MON-002
      - MON-005
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: RV.1.1
    relationship: supports
    confidence: medium
    rationale: Repeatable public-surface collection, durable review state, browser baseline review, and explicit failure handling support gathering information to identify and confirm potential security issues without proving their absence.
    reviewer: product-security
    review_date: "2026-08-26"
    applies_to:
      - MON-001
      - MON-002
      - MON-003
      - MON-005
      - MON-006
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-BR-07.01
    relationship: supports
    confidence: low
    rationale: Monitoring public files and collaboration content for domain-anchored credential exposure candidates supports secure handling of secrets but does not itself block publication rotate credentials or establish baseline conformance.
    reviewer: product-security
    review_date: "2026-08-26"
    applies_to:
      - MON-002
      - MON-003
      - MON-005
limitations:
  - GitHub Search is not exhaustive and is affected by index scope default branch file limits result caps rate limits and provider changes.
  - The public Gist delta covers new or updated Gists after its cursor and does not create a complete historical baseline.
  - Browser query generation does not execute or review the search and is not automated evidence.
  - Deleted history old clones external caches screenshots images binaries split strings and obfuscated content can remain undetected.
  - Domain matches are reconnaissance candidates and can be intentional public information or false positives.
  - The PoC does not deliver Slack messages validate credentials or perform remediation; those operations remain organization-owned.
  - Zero findings means only that the configured automated scope completed; it does not prove no public exposure exists or existed.
status: prototype
owner: product-security
evidence_level: E3
