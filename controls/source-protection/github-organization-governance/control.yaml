limitations:
  - The E3 verifier evaluates normalized synthetic metadata and does not call GitHub or an IdP mutate Organization settings remove access install security configurations or configure audit streaming.
  - A complete provider adapter needs GitHub plan-specific permissions stable IDs complete pagination API versioning rate-limit handling and IdP or SCIM joins that this offline slice does not supply.
  - SAML SCIM enterprise-managed users SHA pinning security configurations and audit retention capabilities depend on the adopted GitHub plan and may require a PSB-GOV-002 exception or compensating control rather than silent downgrade.
  - Snapshot PASS is not live Organization adoption and the public fixtures contain no real users repository names application identities credentials or production evidence.
  - Organization Owner or GitHub provider compromise can falsify hosted state and requires independent identity audit and backup boundaries.
  - Repository deletion transfer important-ref recovery and GitHub-independent backup remain PSB-SOURCE-005 rather than this posture verifier.
  - Credential issuance storage rotation and revocation remain PSB-SOURCE-004 and PSB-GOV-004.
  - Exact administrator change approval execution and provider-event correlation remain PSB-CICD-008.
  - Repository-local workflow semantics ruleset target correctness CODEOWNERS behavior and application code risk require their owning controls even when the Organization baseline passes.
  - Allstar is not installed or authorized and no automated remediation is performed by this control.
