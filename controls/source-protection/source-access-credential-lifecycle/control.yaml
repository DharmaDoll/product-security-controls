limitations:
  - The verifier checks policy metadata and fixtures but does not enumerate revoke or test live GitHub credentials.
  - OAuth PAT SSH and GitHub App capabilities differ and must be evaluated against the actual actor resource and operation.
  - Fine-grained PATs still become excessive when owner repository permissions or duration are broader than the task.
  - Hardware-backed SSH keys can be misused from a compromised authenticated endpoint session.
  - Organization SSO PAT approval audit retention and token lifetime controls depend on source-platform plan and configuration.
  - Revocation must include related sessions and downstream credentials and cannot be replaced by deleting source history.
  - The 90-day maximum is a reference upper bound and organizations should require shorter task-specific lifetimes where supported.
