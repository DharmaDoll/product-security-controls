id: PSB-SOURCE-002
title: リポジトリ所有の開発者向けGit hooksセキュリティベースライン
domain: source-protection
summary: commit前とpushで導入される全履歴から情報漏洩の可能性を検出する。
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: SOURCE-LOCAL-SECRET-COMMIT
    description: 開発者がローカルworktreeからsecret、機密ファイル、credentialを含むmetadataをcommitする。
  - id: SOURCE-PUSH-HISTORICAL-DISCLOSURE
    description: 機密情報を最新treeから削除してもpushで導入される過去commitに残っている。
  - id: SOURCE-UNTRUSTED-GIT-HOOK
    description: Gitがglobal、絶対パス、共有hooks pathから未レビューのhook codeを実行する。
  - id: SOURCE-DEVELOPER-IDENTITY-DISCLOSURE
    description: Git metadataまたはremote設定から個人メールアドレスやcredentialが意図せず漏洩する。
implementations:
  insecure:
    - insecure/recommended.gitconfig
    - insecure/pre-commit-framework/.pre-commit-config.yaml
  secure:
    - secure/recommended.gitconfig
    - secure/pre-commit-framework/.pre-commit-config.yaml
    - secure/.githooks/pre-commit
    - secure/.githooks/commit-msg
    - secure/.githooks/pre-push
    - secure/.githooks/pre-push-pre-commit
    - secure/.githooks/scan-sensitive.py
verification:
  commands:
    - make verify-control CONTROL=PSB-SOURCE-002
  expected:
    - 安全なlocal Git設定と必須のrepository-owned hooksが受け入れられる
    - 共有hooks、平文credential保存、wildcard safe.directory、未署名履歴、広いpush defaultが拒否される
    - 禁止対象の実行形式、archive、database、生成物、key store、metadata、環境設定ファイルが拒否される
    - AWS、Google、JWT、Bearer、GitHub、private key、Slack、generic credential patternが値を表示せず拒否される
    - 5 MiBの方針値を超えるファイルが拒否される
    - stagedされた機密ファイル、commit message、push履歴内のsecretが値を表示せず拒否される
    - pre-commit framework sampleが3 stageをrepository-owned scannerへ接続しfloating external hookを拒否する
    - Gitleaksがreview済みfull commit SHAへ固定され、staged stateをredacted outputで独立検査する
    - scanner実行エラーがcleanな結果と区別される
checks:
  - id: GHK-001
    title: Security hooks are repository owned
    required_state: reviewed relative core.hooksPath and required hook files
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: the secure repository-owned hook profile is accepted
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: GHK-002
    title: Global absolute and shared hook paths are rejected
    required_state: no unreviewed external hook execution path
    responsible_role: developer
    applies_to:
      - developer-endpoint
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: unsafe hook paths fail validation
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-003
    title: Plaintext credential storage is disabled in Git configuration
    required_state: approved credential helper and no embedded remote credentials
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: plaintext credentials and unsafe credential settings are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: GHK-004
    title: Wildcard safe.directory is rejected
    required_state: only explicitly trusted repository paths
    responsible_role: developer
    applies_to:
      - developer-endpoint
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: wildcard repository trust fails validation
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-005
    title: Commit signing and narrow push behavior are required
    required_state: signed commits and non-broad push default
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: unsigned history and broad push defaults are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: GHK-006
    title: Prohibited sensitive file formats are rejected
    required_state: reviewed deny rules for executables archives databases key stores and sensitive metadata
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: sanitized prohibited-file fixtures fail before commit
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-007
    title: Secret patterns are rejected without disclosing values
    required_state: approved secret patterns with redacted findings
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: representative fake credentials fail and their values are not printed
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-008
    title: Oversized files are rejected by repository policy
    required_state: staged files do not exceed the reviewed five MiB policy
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: a sanitized oversized fixture fails before commit
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-009
    title: Staged content is scanned before commit
    required_state: sensitive files and secrets in the index are rejected
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: staged sensitive content is rejected
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-010
    title: Commit messages are scanned before commit
    required_state: credentials and sensitive metadata in commit messages are rejected
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: sanitized secret-bearing commit messages are rejected
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-011
    title: All introduced push history is scanned
    required_state: secrets in any newly pushed commit are rejected
    responsible_role: developer
    applies_to:
      - source-repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: removing a secret from the latest tree does not bypass history scanning
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-012
    title: Hook and scanner failures block the operation
    required_state: execution error is distinct from clean and fails closed
    responsible_role: developer
    applies_to:
      - source-verifier
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: missing tools and scanner errors cannot report clean
      evidence:
        - negative-test output
    mapping_status: unmapped
  - id: GHK-013
    title: Pre-commit framework configuration uses repository-owned security hooks
    required_state: reviewed local hooks for pre-commit commit-msg and pre-push with no mutable external revisions
    responsible_role: developer
    applies_to:
      - source-repository
      - developer-endpoint
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: the framework sample invokes every required stage and rejects floating external hook revisions
      evidence:
        - sanitized verifier output
        - reviewed .pre-commit-config.yaml
    mapping_status: reviewed
  - id: GHK-014
    title: Gitleaks provides an independent staged secret scan
    required_state: Gitleaks v8.30.1 source pinned to a reviewed full commit SHA with redacted fail-closed execution
    responsible_role: developer
    applies_to:
      - source-repository
      - developer-endpoint
    verification:
      type: hybrid
      method: verify the pinned pre-commit configuration then run Gitleaks on sanitized positive and negative fixtures in the adopted environment
      expected: clean staged content passes while synthetic secrets and tool execution failures block the commit without exposing matched values
      evidence:
        - reviewed .pre-commit-config.yaml
        - sanitized Gitleaks output
        - pinned tool installation evidence
    mapping_status: reviewed
mappings:
  - framework: mitre-attack
    version: "v19.1"
    id: T1552.001
    relationship: mitigates
    confidence: medium
    rationale: ローカルでのsecretおよび機密ファイル検査はファイル内credentialの誤公開を減らすが、回避可能でpatternにも限界がある。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - GHK-003
      - GHK-007
      - GHK-009
      - GHK-010
      - GHK-011
      - GHK-013
      - GHK-014
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PS.3.1
    relationship: supports
    confidence: medium
    rationale: レビューで保護されたrepository-owned hooksとローカルのcredentialおよびidentity保護は、source codeと開発環境の保護を支援する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
