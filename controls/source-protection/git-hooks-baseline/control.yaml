limitations:
  - Local hooksは回避、変更、省略できるため、独立したserver-sideおよびCI enforcementが必要である。
  - pre-commit frameworkのSKIPと--no-verifyも回避手段になるため、local executionだけをenforcementとして扱ってはいけない。
  - Gitleaks source buildには初回取得時のnetworkとGo toolchainが必要であり、取得・build・実行失敗をcleanな結果として扱ってはいけない。
  - Pattern matchingはすべての機密値を検出できず、非機密fixtureを拒否する可能性もある。
  - 5 MiBのfile size上限はrepository方針であり、標準が定めるsecurity boundaryではない。
  - Reference scannerは顧客データ、社外秘source、内部architecture、すべての個人情報を分類しない。
  - Commit署名はkeyを認証するが、commit内容が安全であることを証明しない。
  - Credential helper、署名identity、公開用email方針にはplatformおよび組織固有の設定が必要である。
  - Hookまたはscannerの失敗はローカル操作をblockし、cleanな結果として扱ってはいけない。
status: prototype
owner: product-security
evidence_level: E3
