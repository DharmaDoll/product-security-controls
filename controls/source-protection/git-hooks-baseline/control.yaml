id: PSB-SOURCE-002
title: リポジトリ所有の開発者向けGit hooksセキュリティベースライン
domain: source-protection
summary: コミット前とプッシュ前に、追加される内容と到達可能なGit履歴を検査し、情報漏洩につながる変更を検出する。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: SOURCE-LOCAL-SECRET-COMMIT
    description: 開発者がローカルworktreeからsecret、機密ファイル、credentialを含むmetadataをcommitする。
  - id: SOURCE-PUSH-HISTORICAL-DISCLOSURE
    description: 機密情報を最新treeから削除してもpushで導入される過去commitに残っている。
  - id: SOURCE-UNTRUSTED-GIT-HOOK
    description: Gitがglobal、絶対パス、共有hooks pathから未レビューのhook codeを実行する。
  - id: SOURCE-DEVELOPER-IDENTITY-DISCLOSURE
    description: Git metadataまたはremote設定から個人メールアドレスやcredentialが意図せず漏洩する。
implementations:
  insecure:
    - insecure/recommended.gitconfig
    - insecure/pre-commit-framework/.pre-commit-config.yaml
  secure:
    - secure/recommended.gitconfig
    - secure/pre-commit-framework/.pre-commit-config.yaml
    - secure/.githooks/pre-commit
    - secure/.githooks/commit-msg
    - secure/.githooks/pre-push
    - secure/.githooks/pre-push-pre-commit
    - secure/.githooks/scan-sensitive.py
verification:
  commands:
    - make verify-control CONTROL=PSB-SOURCE-002
  expected:
    - 安全なlocal Git設定と必須のrepository-owned hooksが受け入れられる
    - 共有hooks、平文credential保存、wildcard safe.directory、未署名履歴、広いpush defaultが拒否される
    - 禁止対象の実行形式、archive、database、生成物、key store、metadata、環境設定ファイルが拒否される
    - AWS、Google、JWT、Bearer、GitHub、private key、Slack、generic credential patternが値を表示せず拒否される
    - 5 MiBの方針値を超えるファイルが拒否される
    - stagedされた機密ファイル、commit message、push履歴内のsecretが値を表示せず拒否される
    - pre-commit framework sampleが3 stageをrepository-owned scannerへ接続しfloating external hookを拒否する
    - Gitleaksがreview済みfull commit SHAへ固定され、staged stateをredacted outputで独立検査する
    - scanner実行エラーがcleanな結果と区別される
checks:
  - id: GHK-001
    title: Security hooks are repository owned
    required_state: reviewed relative core.hooksPath and required hook files
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - source-repository
    context:
      threat_actor: attacker or compromised shared filesystem replacing executable Git hooks
      attack_or_failure_scenario: a commit or push silently runs unreviewed code outside the repository security review boundary
      why_required: repository-relative reviewed hooks make the executed prevention logic visible and governable
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: the secure repository-owned hook profile is accepted
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: GHK-002
    title: Global absolute and shared hook paths are rejected
    required_state: no unreviewed external hook execution path
    responsible_role: developer
    applies_to:
      - developer-endpoint
    context:
      threat_actor: local attacker installer or stale global configuration redirecting hook execution
      attack_or_failure_scenario: Git loads hooks from an absolute shared or globally managed path that repository reviewers cannot inspect
      why_required: rejecting external hook paths prevents repository policy from being substituted at runtime
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: unsafe hook paths fail validation
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-003
    title: Plaintext credential storage is disabled in Git configuration
    required_state: approved credential helper and no embedded remote credentials
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - source-repository
    context:
      threat_actor: malware local user backup process or accidental remote URL disclosure
      attack_or_failure_scenario: Git stores reusable credentials in plaintext or embeds them in repository configuration
      why_required: approved helpers and credential-free URLs remove persistent secrets outside content scanning coverage
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: plaintext credentials and unsafe credential settings are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: GHK-004
    title: Wildcard safe.directory is rejected
    required_state: only explicitly trusted repository paths
    responsible_role: developer
    applies_to:
      - developer-endpoint
    context:
      threat_actor: attacker controlling a repository owned by another local account
      attack_or_failure_scenario: wildcard safe.directory causes Git to trust ownership-unsafe worktrees and execute their configuration
      why_required: exact trusted paths preserve Git ownership checks instead of disabling them globally
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: wildcard repository trust fails validation
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-005
    title: Commit signing and narrow push behavior are required
    required_state: signed commits and non-broad push default
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: impersonating contributor or user accidentally pushing more refs than intended
      attack_or_failure_scenario: unsigned history obscures author identity or broad push defaults publish unrelated branches and tags
      why_required: signing and narrow push behavior protect identity and publication scope beyond content scanning
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: unsigned history and broad push defaults are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: GHK-006
    title: Prohibited sensitive file formats are rejected
    required_state: reviewed deny rules for executables archives databases key stores and sensitive metadata
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: developer tool or malware adding binaries archives databases key stores or sensitive metadata
      attack_or_failure_scenario: dangerous non-text content enters Git while evading ordinary secret regex review
      why_required: explicit file-format denial covers opaque and high-risk artifacts that content patterns cannot reliably inspect
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: sanitized prohibited-file fixtures fail before commit
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-007
    title: Secret patterns are rejected without disclosing values
    required_state: approved secret patterns with redacted findings
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: accidental contributor or malware placing credential-like content in a file
      attack_or_failure_scenario: supported secret patterns are committed and scanner output further leaks the matched value
      why_required: detection with redacted reporting blocks representative credentials without creating a second disclosure channel
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: representative fake credentials fail and their values are not printed
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-008
    title: Oversized files are rejected by repository policy
    required_state: staged files do not exceed the reviewed five MiB policy
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: user or tool adding a large opaque file that exceeds local review and scanner limits
      attack_or_failure_scenario: sensitive content hides in an oversized file that is skipped for performance
      why_required: rejecting rather than skipping enforces an explicit artifact-storage decision and prevents an unscanned gap
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: a sanitized oversized fixture fails before commit
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: GHK-009
    title: Staged content is scanned before commit
    required_state: sensitive files and secrets in the index are rejected
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: contributor accidentally staging a sensitive file or credential
      attack_or_failure_scenario: content reaches immutable local history before the developer receives feedback
      why_required: index scanning acts at the earliest exact commit boundary and avoids scanning unrelated working-tree state
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: staged sensitive content is rejected
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-010
    title: Commit messages are scanned before commit
    required_state: credentials and sensitive metadata in commit messages are rejected
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: contributor copying a token internal URL or sensitive text into a commit message
      attack_or_failure_scenario: metadata becomes permanently searchable even when all committed files are clean
      why_required: commit messages are a separate Git publication surface not inspected by staged-file scanning
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: sanitized secret-bearing commit messages are rejected
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-011
    title: All introduced push history is scanned
    required_state: secrets in any newly pushed commit are rejected
    responsible_role: developer
    applies_to:
      - source-repository
    context:
      threat_actor: contributor bypassing commit hooks then deleting the secret in a later commit
      attack_or_failure_scenario: latest tree is clean but the pushed range introduces an earlier recoverable secret
      why_required: pre-push range scanning covers every introduced commit and closes latest-state and no-verify bypasses
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: removing a secret from the latest tree does not bypass history scanning
      evidence:
        - sanitized negative-test output
    mapping_status: reviewed
  - id: GHK-012
    title: Hook and scanner failures block the operation
    required_state: execution error is distinct from clean and fails closed
    responsible_role: developer
    applies_to:
      - source-verifier
    context:
      threat_actor: missing Git scanner crash malformed input or operator treating hook failure as success
      attack_or_failure_scenario: the operation proceeds because inspection could not run rather than because content was clean
      why_required: distinct fail-closed errors preserve the security meaning of a zero-finding result
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: missing tools and scanner errors cannot report clean
      evidence:
        - negative-test output
    mapping_status: unmapped
  - id: GHK-013
    title: Pre-commit framework configuration uses repository-owned security hooks
    required_state: reviewed local hooks for pre-commit commit-msg and pre-push with no mutable external revisions
    responsible_role: developer
    applies_to:
      - source-repository
      - developer-endpoint
    context:
      threat_actor: configuration drift mutable external hook or incomplete pre-commit installation
      attack_or_failure_scenario: framework adoption omits commit-message or push-history checks or downloads changing hook code
      why_required: reviewed three-stage repository-owned configuration preserves native control coverage under the alternate framework
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-SOURCE-002
      expected: the framework sample invokes every required stage and rejects floating external hook revisions
      evidence:
        - sanitized verifier output
        - reviewed .pre-commit-config.yaml
    mapping_status: reviewed
  - id: GHK-014
    title: Gitleaks provides an independent staged secret scan
    required_state: Gitleaks v8.30.1 source pinned to a reviewed full commit SHA with redacted fail-closed execution
    responsible_role: developer
    applies_to:
      - source-repository
      - developer-endpoint
    context:
      threat_actor: credential exposure outside the repository-owned scanner rule set or compromised mutable scanner source
      attack_or_failure_scenario: a secret pattern is missed by one engine or scanner output and installation drift weaken detection
      why_required: an independently pinned redacted Gitleaks scan adds rule diversity while retaining controlled execution
    verification:
      type: hybrid
      method: verify the pinned pre-commit configuration then run Gitleaks on sanitized positive and negative fixtures in the adopted environment
      expected: clean staged content passes while synthetic secrets and tool execution failures block the commit without exposing matched values
      evidence:
        - reviewed .pre-commit-config.yaml
        - sanitized Gitleaks output
        - pinned tool installation evidence
    mapping_status: reviewed
mappings:
  - framework: mitre-attack
    version: "v19.1"
    id: T1552.001
    relationship: mitigates
    confidence: medium
    rationale: ローカルでのsecretおよび機密ファイル検査はファイル内credentialの誤公開を減らすが、回避可能でpatternにも限界がある。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - GHK-003
      - GHK-007
      - GHK-009
      - GHK-010
      - GHK-011
      - GHK-013
      - GHK-014
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PS.3.1
    relationship: supports
    confidence: medium
    rationale: レビューで保護されたrepository-owned hooksとローカルのcredentialおよびidentity保護は、source codeと開発環境の保護を支援する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
