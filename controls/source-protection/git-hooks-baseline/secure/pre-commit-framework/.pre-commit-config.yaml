{
  "minimum_pre_commit_version": "4.2.0",
  "default_install_hook_types": [
    "pre-commit",
    "commit-msg",
    "pre-push"
  ],
  "repos": [
    {
      "repo": "local",
      "hooks": [
        {
          "id": "psb-sensitive-staged",
          "name": "PSB staged sensitive-data scan",
          "entry": "sh .githooks/pre-commit",
          "language": "system",
          "pass_filenames": false,
          "always_run": true,
          "stages": [
            "pre-commit"
          ]
        },
        {
          "id": "psb-sensitive-commit-message",
          "name": "PSB commit-message sensitive-data scan",
          "entry": "sh .githooks/commit-msg",
          "language": "system",
          "pass_filenames": true,
          "always_run": true,
          "stages": [
            "commit-msg"
          ]
        },
        {
          "id": "psb-sensitive-push-history",
          "name": "PSB introduced-history sensitive-data scan",
          "entry": "sh .githooks/pre-push-pre-commit",
          "language": "system",
          "pass_filenames": false,
          "always_run": true,
          "stages": [
            "pre-push"
          ]
        }
      ]
    },
    {
      "repo": "https://github.com/gitleaks/gitleaks",
      "rev": "83d9cd684c87d95d656c1458ef04895a7f1cbd8e",
      "hooks": [
        {
          "id": "gitleaks",
          "name": "Gitleaks independent staged secret scan",
          "args": [
            "--redact"
          ],
          "pass_filenames": false,
          "always_run": true,
          "stages": [
            "pre-commit"
          ]
        }
      ]
    }
  ]
}
