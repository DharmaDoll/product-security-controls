id: PSB-SOURCE-005
title: Critical repositoryの破壊耐性と独立した復旧可能性を検証する
domain: source-protection
summary: 単一のsource-platform管理権限による不可逆な消失を防ぎ、critical repositoryを独立したrecovery copyから所定のRPOとRTO内に復旧できることを検証する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: SOURCE-MASS-REPOSITORY-DELETION
    description: A compromised source-platform administrator or faulty automation destroys multiple critical repositories and their refs settings or history.
  - id: SOURCE-BACKUP-CO-DESTRUCTION
    description: The same compromised authority can delete the source repositories and their mutable same-domain recovery copies.
  - id: SOURCE-RECOVERY-FALSE-ASSURANCE
    description: An incomplete inventory stale recovery copy or untested restore path is interpreted as recoverability.
implementations:
  insecure:
    - insecure/evidence.json
  secure:
    - secure/policy.json
    - secure/evidence.json
verification:
  commands:
    - make verify-control CONTROL=PSB-SOURCE-005
    - make assess-control CONTROL=PSB-SOURCE-005
  expected:
    - secure fixture proves exact critical scope bounded destructive action attacker-separated recovery copies and a complete isolated restore drill
    - unsafe authoritative evidence returns FAIL without being confused with unavailable evidence
    - missing organization evidence returns NOT_CHECKED and collector parser or malformed-input failure returns ERROR
    - policy tamper stale partial symbolic or credential-bearing evidence never produces PASS
    - assessment output contains only check identities statuses and sanitized messages
assessment:
  command: assessment/assess.py
  platforms:
    - linux
    - macos
  output_formats:
    - json
    - csv
  result_statuses:
    - PASS
    - FAIL
    - NOT_CHECKED
    - ERROR
checks:
  - id: RDR-001
    title: Critical repository scope is complete and stable-ID bound
    required_state: every repository required to rebuild patch or investigate the product occurs once by immutable provider ID in a fresh completely paginated inventory
    responsible_role: repository-admin
    applies_to:
      - source-repository-inventory
      - critical-repository-scope
    context:
      threat_actor: compromised administrator or incomplete inventory collector omitting a critical repository outside the visible scope
      attack_or_failure_scenario: deletion safeguards and restore drills cover only known repositories while one product-critical repository is missing duplicated renamed or represented by a mutable name
      why_required: prevention and recovery can be evaluated only against a complete stable-ID scope; a perfect recovery copy for listed repositories cannot compensate for an omitted product source
    verification:
      type: hybrid
      method: compare fresh completely paginated provider inventory evidence to the adopter policy stable-ID set
      expected: exact unique critical scope passes and missing duplicate partial stale or unavailable scope does not pass
      evidence:
        - sanitized stable repository IDs criticality and collector completeness metadata
    mapping_status: reviewed
  - id: RDR-002
    title: Destructive repository actions have a bounded blast radius
    required_state: bulk deletion is denied and any permitted single-repository deletion is default-deny independently approved and recently phishing-resistant reauthenticated
    responsible_role: repository-admin
    applies_to:
      - repository-deletion-control
      - source-platform-administrator-session
    context:
      threat_actor: attacker using a stolen owner session or faulty repository administration automation
      attack_or_failure_scenario: one credential or automation request destroys multiple critical repositories before a human can intervene
      why_required: a per-request limit and independent authorization reduce the amount of product source that one compromised authority or error can destroy before recovery is needed
    verification:
      type: hybrid
      method: inspect normalized provider deletion-control state and a harmless denied bulk-operation policy test
      expected: default allow bulk targets self approval missing phishing-resistant reauthentication or an allowed harmless bulk test fails
      evidence:
        - sanitized deletion-control state and dry-run decision receipt
    mapping_status: reviewed
  - id: RDR-003
    title: Critical repositories have current attacker-separated recovery copies
    required_state: every required repository has a current retention-locked metadata-bound recovery copy in a security domain that source administrators cannot delete
    responsible_role: shared
    applies_to:
      - repository-recovery-copy
      - backup-security-domain
      - backup-retention
    context:
      threat_actor: compromised source-platform administrator attempting to destroy repositories and recovery copies with the same authority
      attack_or_failure_scenario: a recovery copy is stale mutable short-retained or stored under the source administration boundary and disappears with the source organization
      why_required: destructive-action controls may be bypassed; an independently retained exact copy is the last source state from which product patching rebuilding and investigation can resume
    verification:
      type: hybrid
      method: compare recovery-copy age domain retention lock delete authority and content refs settings digests for every required stable repository ID
      expected: missing same-domain mutable source-admin-deletable stale or short-retained recovery copies fail
      evidence:
        - metadata-only recovery-copy manifest and retention decision
    mapping_status: reviewed
  - id: RDR-006
    title: An isolated restore drill proves complete recovery within RPO and RTO
    required_state: a current isolated drill restores every required repository within the adopter objectives and matches the selected recovery copy content refs and protected-settings digests
    responsible_role: repository-admin
    applies_to:
      - repository-restore-drill
      - git-object-and-ref-state
      - repository-protection-settings
    context:
      threat_actor: latent copy corruption incomplete export missing protected settings or an operator procedure that has never restored the complete critical scope
      attack_or_failure_scenario: recovery copies exist but cannot recreate every required repository object ref and security setting inside the product recovery objective
      why_required: storage receipts prove retention only; an isolated full-scope restore with exact-state comparison demonstrates that product source can actually be recovered
    verification:
      type: hybrid
      method: compare drill age isolation scope duration recovery-copy identities and exact content refs settings digests
      expected: missing partial stale slow in-place mismatched or unverified restore evidence fails and absent organization evidence remains NOT_CHECKED
      evidence:
        - metadata-only isolated restore receipts and RPO RTO measurements
    mapping_status: reviewed
mappings:
  - framework: sitf
    version: "1.0.0@d1d1536"
    id: T-V009
    relationship: mitigates
    confidence: high
    rationale: Complete stable-ID scope bounded destructive actions attacker-separated retained recovery copies and exact isolated restore drills directly reduce repository mass-deletion impact while live provider adoption remains external.
    reviewer: product-security
    review_date: "2026-08-25"
    applies_to:
      - RDR-001
      - RDR-002
      - RDR-003
      - RDR-006
  - framework: mitre-attack
    version: "v19.1"
    id: T1485
    relationship: mitigates
    confidence: medium
    rationale: Destructive-action limits independent retained recovery copies and verified restoration reduce the impact and duration of source data destruction without claiming enterprise disaster-recovery coverage.
    reviewer: product-security
    review_date: "2026-08-25"
    applies_to:
      - RDR-002
      - RDR-003
      - RDR-006
limitations:
  - The runnable implementation assesses provider-neutral sanitized evidence and does not configure GitHub GitLab Bitbucket backup storage identity providers or alert receivers.
  - The control applies to repositories classified critical for product rebuilding security patching or incident investigation; applying it to every temporary or reproducible repository is not required.
  - Stable repository IDs settings and export shapes require a reviewed provider adapter with complete organization scope including archived disabled transferred and forked repositories where relevant.
  - Recovery-copy lock metadata is not proof of storage-provider enforcement root-account separation key custody legal retention or resistance to provider control-plane compromise.
  - Digest equality does not prove semantic correctness of every provider object such as issues pull requests discussions release assets LFS objects packages hooks keys environments or external integrations.
  - Audit delivery credential containment and incident authorization are integration dependencies owned by privileged-change credential-lifecycle and incident-readiness controls rather than duplicated here.
  - Reference RPO RTO retention reauthentication and drill-age values require product impact analysis and may be made stricter; weakening them requires a reviewed time-bound exception.
status: prototype
owner: product-security
evidence_level: E3
