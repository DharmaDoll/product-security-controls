# Declarative example policy. This file is inspected; it does not change the host.
disk_encryption=required
screen_lock=required
automatic_updates=required
local_admin=false
credential_lifetime=short-lived
credential_storage=system-keychain-or-approved-manager
hardware_backed_keys=required
secrets_in_workspace=false
pre_commit_secret_scan=required
repository_secret_scan=required
docker_socket_exposed=false
package_install_isolation=required
dependency_update_guard=release-cooldown-and-security-updates
local_debug_services=disabled
developer_egress_control=allowlist
phishing_resistant_mfa=required
sensitive_data_file_guard=required
ai_tools_network=allowlist
workspace_mount=read-only-by-default
backup_encryption=required
