id: PSB-SOURCE-001
title: Harden developer endpoints and local trust boundaries
domain: source-protection
summary: Protect developer source code, credentials, and local development tools with enforceable endpoint policy requirements.
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: DEV-ENDPOINT-CREDENTIAL-THEFT
    description: A stolen, malware-infected, or over-privileged developer endpoint exposes credentials or source code.
  - id: DEV-ENDPOINT-UNTRUSTED-EXECUTION
    description: Untrusted packages, extensions, local services, or AI tools execute with excessive developer privileges.
  - id: DEV-ENDPOINT-DATA-EXFILTRATION
    description: Secrets, source code, or sensitive data leave the endpoint through commits, unmanaged services, or unauthorized cloud storage.
  - id: DEV-ENDPOINT-IDENTITY-PERSISTENCE
    description: Long-lived credentials or weak identity lifecycle controls preserve access after credential theft or offboarding.
implementations:
  insecure:
    - insecure/endpoint-policy.conf
  secure:
    - secure/endpoint-policy.conf
verification:
  commands:
    - make verify-control CONTROL=PSB-SOURCE-001
  expected:
    - secure endpoint policy passes all 28 required checks, including all ten imported operational requirements
    - insecure endpoint policy is rejected with a non-zero result and 28 failed checks
    - complete verifier output matches the sanitized expected evidence
    - policy validation failure is distinct from a clean result
    - read-only Linux assessment emits all 20 check states without host identifiers or matched secret values
    - FAIL NOT_CHECKED and assessment execution ERROR use distinct exit states
assessment:
  command: assessment/assess.py
  platforms:
    - linux
  output_formats:
    - json
    - csv
  result_statuses:
    - PASS
    - FAIL
    - NOT_CHECKED
    - ERROR
    - N/A
checks:
  - id: DEH-001
    title: Credentials are short lived
    required_state: static credentials replaced by short-lived sessions
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - identity-platform
    context:
      threat_actor: malware credential stealer or attacker obtaining cached developer credentials
      attack_or_failure_scenario: a long-lived token remains usable after theft and grants sustained source or service access
      why_required: short-lived sessions reduce the exploitation window independently of endpoint detection and revocation speed
    verification:
      type: external-evidence
      method: inspect credential issuance and maximum lifetime policy
      expected: routine development access does not depend on long-lived static tokens
      evidence:
        - identity or source-platform credential policy
    mapping_status: reviewed
  - id: DEH-002
    title: Credentials use an approved secure store
    required_state: system keychain or approved secret manager
    responsible_role: developer
    applies_to:
      - developer-endpoint
    context:
      threat_actor: local malware another user or accidental file disclosure
      attack_or_failure_scenario: plaintext credential files or Git helpers expose reusable secrets from developer storage
      why_required: an approved OS-backed store adds access control and avoids recoverable plaintext persistence
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and review the credential platform policy
      expected: plaintext workspace shell-history and dotfile storage is prohibited
      evidence:
        - credential helper configuration
        - sanitized assessment result
    mapping_status: reviewed
  - id: DEH-003
    title: Developer keys are hardware backed
    required_state: non-exportable hardware-backed key with user verification
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - identity-platform
    context:
      threat_actor: malware or attacker attempting to copy a developer private key
      attack_or_failure_scenario: an exportable key is stolen and used from another device without user verification
      why_required: hardware-backed non-exportable keys constrain credential use even after filesystem compromise
    verification:
      type: external-evidence
      method: inspect key enrollment and authenticator policy
      expected: approved SSH or authentication keys are hardware protected
      evidence:
        - key enrollment record
    mapping_status: reviewed
  - id: DEH-004
    title: Secrets are scanned before commit
    required_state: reviewed pre-commit secret scanning enabled
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - source-repository
    context:
      threat_actor: developer accidentally staging a secret or malware placing one in the worktree
      attack_or_failure_scenario: sensitive content enters a commit before repository-side controls can react
      why_required: pre-commit scanning provides immediate prevention at the earliest source-publication boundary
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and a sanitized negative hook fixture
      expected: a representative fake secret is rejected before commit
      evidence:
        - hook configuration
        - sanitized assessment result
        - sanitized negative-test output
    mapping_status: reviewed
  - id: DEH-005
    title: Repository-side secret scanning is enforced
    required_state: mandatory server-side scan independent of local hooks
    responsible_role: repository-admin
    applies_to:
      - source-repository
    context:
      threat_actor: contributor bypassing local hooks Web UI user or unmanaged clone
      attack_or_failure_scenario: a secret reaches the shared repository through a path where endpoint scanning did not run
      why_required: mandatory server-side enforcement covers publication paths and bypasses outside local policy
    verification:
      type: external-evidence
      method: inspect repository rulesets and secret-scanning configuration
      expected: bypassing the local hook does not permit an undetected merge
      evidence:
        - repository ruleset or required-check evidence
    mapping_status: reviewed
  - id: DEH-006
    title: Dependency installation is isolated from the host
    required_state: disposable restricted package-install environment
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - dependency-install
    context:
      threat_actor: malicious package install script or compromised build backend
      attack_or_failure_scenario: dependency installation reads developer files credentials sockets or modifies the host
      why_required: disposable restricted installation isolates unavoidable package execution from endpoint assets
    verification:
      type: external-evidence
      method: inspect developer environment provisioning and sandbox policy
      expected: install-time code cannot read routine host credentials
      evidence:
        - sandbox or managed workspace policy
    mapping_status: unmapped
  - id: DEH-007
    title: Dependency updates use cooldown and security exception policy
    required_state: release cooldown with expedited reviewed vulnerability updates
    responsible_role: repository-admin
    applies_to:
      - dependency-update
    context:
      threat_actor: attacker publishing a new compromised dependency or maintainer delaying an urgent security fix
      attack_or_failure_scenario: automation adopts a fresh malicious release or cooldown blocks necessary remediation without review
      why_required: cooldown plus narrow security exception balances observation time with controlled urgent updates
    verification:
      type: hybrid
      method: verify PSB-DEPS-001 and inspect update automation policy
      expected: new releases wait for the cooldown unless an exact reviewed exception applies
      evidence:
        - dependency update configuration
        - PSB-DEPS-001 verifier output
    mapping_status: unmapped
  - id: DEH-008
    title: Developer egress uses an approved allowlist
    required_state: managed access to approved repositories and storage services
    responsible_role: security
    applies_to:
      - developer-network
    context:
      threat_actor: malware malicious development tool or compromised dependency using outbound connectivity
      attack_or_failure_scenario: source credentials or prompts are exfiltrated to an arbitrary external endpoint
      why_required: managed destination allowlisting limits exfiltration when local process controls are bypassed
    verification:
      type: external-evidence
      method: inspect SWG CASB proxy DNS or equivalent policy
      expected: unauthorized repositories and storage services are denied
      evidence:
        - managed egress policy
        - sanitized access-control test
    mapping_status: reviewed
  - id: DEH-009
    title: Authentication is centralized and phishing resistant
    required_state: managed IdP lifecycle with phishing-resistant MFA
    responsible_role: security
    applies_to:
      - identity-platform
    context:
      threat_actor: phishing adversary or attacker using an orphaned developer account
      attack_or_failure_scenario: stolen passwords or incomplete offboarding grant repository and development-service access
      why_required: centralized lifecycle and phishing-resistant MFA address identity compromise beyond device configuration
    verification:
      type: external-evidence
      method: inspect IdP authentication and deprovisioning policy
      expected: FIDO2 passkey or equivalent phishing-resistant authentication is required
      evidence:
        - IdP policy and lifecycle evidence
    mapping_status: reviewed
  - id: DEH-010
    title: Sensitive data files are detected before commit
    required_state: staged file size type and content checks enabled
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - source-repository
    context:
      threat_actor: developer or tool adding archives databases keys binaries or oversized sensitive files
      attack_or_failure_scenario: high-risk file types bypass text-only secret patterns and enter source history
      why_required: file type size and content guards cover disclosure forms that credential regex alone cannot
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 then inspect repository-side enforcement
      expected: representative sensitive data files are rejected without exposing their contents
      evidence:
        - sanitized assessment result
        - sanitized negative-test output
        - repository required-check evidence
    mapping_status: reviewed
  - id: END-001
    title: Full-disk encryption is enforced
    required_state: encryption required for all developer endpoint storage
    responsible_role: shared
    applies_to:
      - developer-endpoint
    context:
      threat_actor: thief or unauthorized person obtaining a powered-off developer device or storage media
      attack_or_failure_scenario: source credentials caches and local artifacts are read directly from unencrypted storage
      why_required: full-disk encryption protects data at rest when login and runtime controls are unavailable
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect endpoint-management compliance
      expected: the managed endpoint reports full-disk encryption enabled
      evidence:
        - sanitized assessment result
        - MDM compliance record
    mapping_status: reviewed
  - id: END-002
    title: Automatic screen lock is enforced
    required_state: organization-approved inactivity timeout
    responsible_role: shared
    applies_to:
      - developer-endpoint
    context:
      threat_actor: nearby unauthorized person accessing an unattended unlocked workstation
      attack_or_failure_scenario: an active developer session exposes source credentials and authenticated services without device theft
      why_required: enforced inactivity lock shortens physical access opportunity during routine absence
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect endpoint-management screen-lock policy
      expected: unattended access requires reauthentication
      evidence:
        - sanitized assessment result
        - MDM compliance record
    mapping_status: reviewed
  - id: END-003
    title: Operating system and developer tools update automatically
    required_state: supported versions with enforced security updates
    responsible_role: shared
    applies_to:
      - developer-endpoint
    context:
      threat_actor: attacker exploiting known vulnerabilities in the OS browser editor or developer tools
      attack_or_failure_scenario: unsupported or unpatched software enables local compromise and credential theft
      why_required: automatic enforced security updates reduce exposure time to publicly known endpoint exploits
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect patch compliance
      expected: unsupported or overdue endpoints are reported noncompliant
      evidence:
        - sanitized assessment result
        - patch compliance record
    mapping_status: reviewed
  - id: END-004
    title: Routine development does not use local administrator privileges
    required_state: standard user by default with controlled elevation
    responsible_role: shared
    applies_to:
      - developer-endpoint
    context:
      threat_actor: malicious package tool or user mistake executing with administrator authority
      attack_or_failure_scenario: routine development code modifies system security settings credentials or other users data
      why_required: standard-user operation limits blast radius while controlled elevation preserves necessary administration
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect endpoint privilege policy
      expected: routine developer sessions are not permanent local administrators
      evidence:
        - sanitized assessment result
        - privilege-management compliance record
    mapping_status: reviewed
  - id: END-005
    title: Workspaces contain no secrets
    required_state: no credentials in project files dotfiles or shell history
    responsible_role: developer
    applies_to:
      - developer-endpoint
    context:
      threat_actor: malware backup process support tool or accidental repository publication
      attack_or_failure_scenario: credentials stored in workspaces dotfiles or shell history are copied or committed
      why_required: absence checks address secret locations outside approved stores that secure-helper configuration does not cover
    verification:
      type: hybrid
      method: run an approved local secret scan and inspect credential practices
      expected: no active credential is stored in plaintext workspace locations
      evidence:
        - sanitized secret-scan report
    mapping_status: reviewed
  - id: END-006
    title: Container sockets are not broadly exposed
    required_state: no unrestricted host Docker socket access
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - local-container-runtime
    context:
      threat_actor: compromised container dependency or development tool accessing the host runtime socket
      attack_or_failure_scenario: unrestricted Docker socket access becomes effective root-level control of the endpoint
      why_required: removing broad socket access preserves the container boundary instead of exposing a host takeover interface
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect all container runtime policies
      expected: untrusted development workloads cannot control the host container daemon
      evidence:
        - sanitized assessment result
        - container runtime configuration
    mapping_status: reviewed
  - id: END-007
    title: Local debug services are disabled by default
    required_state: no unmanaged externally reachable debug service
    responsible_role: developer
    applies_to:
      - developer-endpoint
    context:
      threat_actor: network attacker discovering an unmanaged debugger database or development service
      attack_or_failure_scenario: a debug listener exposes code execution data or unauthenticated administration beyond loopback
      why_required: default-disabled externally reachable services reduce attack surface not covered by repository controls
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect development launch configuration
      expected: debug services are disabled or bound to an approved local interface
      evidence:
        - sanitized assessment result
        - sanitized service inventory
    mapping_status: reviewed
  - id: END-008
    title: AI development tools use approved network destinations
    required_state: allowlisted AI tool and MCP network access
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - ai-development-tool
    context:
      threat_actor: compromised AI tool MCP server plugin or malicious prompt causing unauthorized network access
      attack_or_failure_scenario: source prompts credentials or workspace data are sent to unapproved services
      why_required: destination controls bound AI integrations whose dynamic behavior may exceed the immediate coding task
    verification:
      type: external-evidence
      method: inspect managed AI tool and developer egress policy
      expected: unapproved model endpoints tools and MCP servers are denied
      evidence:
        - AI tool allowlist
        - managed egress policy
    mapping_status: reviewed
  - id: END-009
    title: Shared workspaces are read only by default
    required_state: explicit narrow write mounts only
    responsible_role: developer
    applies_to:
      - developer-endpoint
      - development-sandbox
    context:
      threat_actor: compromised sandbox process package or AI agent with mounted host paths
      attack_or_failure_scenario: development workload overwrites source credentials configuration or unrelated host files
      why_required: read-only defaults make write authority explicit and narrow rather than inheriting the whole workspace
    verification:
      type: hybrid
      method: run make assess-control CONTROL=PSB-SOURCE-001 and inspect sandbox filesystem policy
      expected: broad host and shared workspace write access is absent
      evidence:
        - sanitized assessment result
        - workspace mount configuration
    mapping_status: reviewed
  - id: END-010
    title: Developer endpoint backups are encrypted
    required_state: approved encrypted backup with controlled access
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - backup-service
    context:
      threat_actor: backup service compromise storage theft or unauthorized backup administrator
      attack_or_failure_scenario: historical source credentials and local artifacts remain readable in backup copies
      why_required: encrypted access-controlled backups extend endpoint confidentiality to retained copies and recovery media
    verification:
      type: external-evidence
      method: inspect managed backup encryption and access policy
      expected: endpoint source and local artifacts are not copied to plaintext backups
      evidence:
        - backup compliance record
    mapping_status: reviewed
  - id: END-011
    title: Only approved applications are installed
    required_state: centrally enforced application allowlist and removal of unnecessary software
    responsible_role: shared
    applies_to:
      - developer-endpoint
    context:
      threat_actor: malicious publisher compromised updater or developer installing unnecessary software
      attack_or_failure_scenario: an unapproved application extension or background service expands the endpoint attack surface and gains access to source or credentials
      why_required: an enforced inventory and allowlist removes avoidable execution paths instead of depending on each developer to identify unsafe software
    verification:
      type: external-evidence
      method: inspect managed application inventory allowlist and removal policy
      expected: unauthorized and unsupported applications are blocked or automatically removed
      evidence:
        - endpoint application compliance record
        - approved software catalog
    mapping_status: reviewed
  - id: END-012
    title: EDR or XDR protection is enforced
    required_state: centrally managed endpoint detection prevention and response coverage
    responsible_role: security
    applies_to:
      - developer-endpoint
      - endpoint-management
    context:
      threat_actor: malware credential stealer or hands-on-keyboard attacker operating on a developer endpoint
      attack_or_failure_scenario: malicious execution credential access or persistence continues without timely detection containment or investigation evidence
      why_required: managed behavioral telemetry and response provide a control after preventive hardening is bypassed and cannot be replaced by developer vigilance
    verification:
      type: external-evidence
      method: inspect EDR or XDR enrollment health prevention mode telemetry and response policy
      expected: every in-scope endpoint reports healthy enforced coverage and stale agents are noncompliant
      evidence:
        - sanitized EDR or XDR coverage report
        - endpoint response policy
    mapping_status: reviewed
  - id: END-013
    title: Commit signing is enforced
    required_state: signed commits with repository-side verification and protected signing keys
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - source-repository
    context:
      threat_actor: attacker with repository credentials or contributor attempting to impersonate another author
      attack_or_failure_scenario: unsigned or unverified commits enter protected history without a cryptographic binding to an approved developer identity
      why_required: local signing plus repository-side enforcement provides reviewable authorship evidence beyond the mutable commit author fields
    verification:
      type: hybrid
      method: inspect Git signing configuration and repository rules then test rejection of an unsigned fixture commit
      expected: protected branches reject unsigned or unverified commits and signing is enabled by managed developer configuration
      evidence:
        - sanitized Git signing configuration
        - repository ruleset evidence
        - unsigned-commit negative test
    mapping_status: reviewed
  - id: END-014
    title: IDE security feedback is enabled
    required_state: approved SAST and SCA feedback integrated into supported editors
    responsible_role: shared
    applies_to:
      - developer-endpoint
      - source-code
    context:
      threat_actor: developer mistake insecure generated code or vulnerable dependency introduced during editing
      attack_or_failure_scenario: a detectable code or dependency weakness remains invisible until a later pipeline stage or production release
      why_required: immediate IDE feedback shortens remediation time while mandatory server-side checks retain enforcement when the editor integration is bypassed
    verification:
      type: external-evidence
      method: inspect managed editor extension policy and a representative SAST and SCA finding
      expected: supported editors provide approved real-time findings without replacing mandatory repository checks
      evidence:
        - managed editor policy
        - sanitized representative finding
    mapping_status: reviewed
  - id: END-015
    title: High-risk development uses a managed environment
    required_state: organization-controlled disposable cloud workspace container or VM for high-risk code execution
    responsible_role: shared
    applies_to:
      - development-sandbox
      - managed-development-environment
    context:
      threat_actor: malicious dependency external code sample or AI-generated code executed during development
      attack_or_failure_scenario: untrusted code executes directly on the endpoint and reads persistent source credentials or unrelated host data
      why_required: managed disposable environments reduce persistent local data and apply centrally reviewed isolation to operations with elevated execution risk
    verification:
      type: external-evidence
      method: inspect development environment provisioning data retention and high-risk workload routing policy
      expected: defined high-risk operations run only in approved disposable environments with no routine local credentials
      evidence:
        - managed environment policy
        - sanitized workspace configuration
    mapping_status: reviewed
  - id: END-016
    title: Sandbox behavior is monitored and restricted
    required_state: file network process privilege and socket activity constrained and observable
    responsible_role: security
    applies_to:
      - development-sandbox
      - local-container-runtime
    context:
      threat_actor: compromised installer build script dependency or AI-generated program executing inside the sandbox
      attack_or_failure_scenario: sandboxed code accesses unexpected files credentials network destinations or host interfaces without detection
      why_required: runtime policy and behavior telemetry verify that the isolation boundary actually constrains execution instead of relying on container placement alone
    verification:
      type: external-evidence
      method: inspect sandbox policy and sanitized runtime telemetry such as eBPF audit or equivalent controls
      expected: prohibited filesystem network privilege and socket operations are blocked and generate reviewable events
      evidence:
        - sandbox enforcement policy
        - sanitized negative execution trace
    mapping_status: reviewed
  - id: END-017
    title: Endpoint configuration is centrally enforced
    required_state: MDM or equivalent continuously deploys and evaluates the security baseline
    responsible_role: security
    applies_to:
      - developer-endpoint
      - endpoint-management
    context:
      threat_actor: developer mistake local attacker configuration drift or unmanaged device enrollment
      attack_or_failure_scenario: a required hardening setting is disabled or never installed while the endpoint retains access to source and product systems
      why_required: centralized enforcement converts guidance into a measurable guardrail and detects drift that voluntary setup cannot reliably prevent
    verification:
      type: external-evidence
      method: inspect MDM enrollment configuration deployment and compliance enforcement
      expected: noncompliant or unenrolled endpoints lose access or enter a time-bound remediation workflow
      evidence:
        - sanitized MDM compliance report
        - conditional-access or remediation policy
    mapping_status: reviewed
  - id: END-018
    title: Physical device protection is required
    required_state: controlled storage transport and hardware locking appropriate to endpoint risk
    responsible_role: shared
    applies_to:
      - developer-endpoint
    context:
      threat_actor: thief visitor or unauthorized person obtaining physical access to a developer device
      attack_or_failure_scenario: an unattended or transported endpoint is stolen tampered with or used before logical controls can respond
      why_required: physical custody and locking reduce opportunities that disk encryption and screen lock address only after the device has already been accessed or removed
    verification:
      type: external-evidence
      method: inspect endpoint physical security remote response and travel handling policy
      expected: in-scope devices follow controlled storage transport and loss reporting requirements
      evidence:
        - endpoint physical security policy
        - sanitized loss response exercise or record
    mapping_status: reviewed
