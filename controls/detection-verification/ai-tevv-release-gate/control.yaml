limitations:
  - The synthetic evaluator artifact subject behaviors and scenarios prove the evidence contract and negative state semantics but do not execute a live model provider judge or production release system.
  - The six inert scenarios cover bounded examples and do not establish complete attack coverage model robustness semantic quality fairness privacy legal safety or domain accuracy.
  - The 5-run 800000 ppm threshold is a deterministic repository fixture for the contract and is not a universal organization risk threshold or statistically sufficient production sample.
  - Known-vulnerable calibration detects evaluator regression for configured failures but does not estimate false-negative rates for unknown obfuscated multilingual delayed multimodal or adaptive attacks.
  - Garak Giskard Counterfit ART and other tools remain adapters until exact versions artifacts integrity execution boundaries output semantics and unique coverage are reviewed.
  - Live red-team data retention access control provider contracts judge drift runner isolation and release enforcement require organization-owned evidence and remain NOT_CHECKED.
  - Upstream control bindings verify repository artifact identity and do not prove those controls are adopted by a live AI product.
  - Mappings do not claim complete MITRE ATLAS OWASP Agentic NIST SSDF or product security coverage or compliance.
status: prototype
