limitations:
  - Offline fixtures do not prove that a live Linux host kernel daemon firewall audit subsystem or hardware root of trust enforces the recorded state.
  - Windows container hosts and managed control planes are NOT_CHECKED until provider-specific adapters define equivalent evidence.
  - Version allowlists and patch deadlines are organization policy inputs and do not replace a live vendor vulnerability or support feed.
  - A valid isolation exception remains NOT_CHECKED rather than PASS and requires compensating controls until the limitation is removed.
  - Runtime socket mount prevention inside workload specifications remains PSB-CONTAINER-001 while this control consumes host-side mount observations.
  - Falco or Sysdig installation driver choice performance and update verification require a later live adapter; runtime event evaluation remains PSB-CONTAINER-004.
  - Workload application behavior image vulnerability and registry security remain separate controls.
  - CIS Docker Benchmark mapping remains unavailable until an authorized versioned source and exact recommendation inventory are reviewed.
  - SLSA Build levels do not cover production container host hardening and are intentionally not mapped.
