limitations:
  - Fixtures model a sanitized Terraform plan contract and do not execute Terraform or authenticate to a cloud provider.
  - Resolved plans can contain unknown or sensitive values and policy must block or require explicit review when required facts are unavailable.
  - AWS GCP and Azure examples are minimum common outcomes and do not replace provider-specific threat models modules tests or organization controls.
  - A hardened or CIS-labeled image still requires immutable identity update ownership vulnerability management and runtime hardening evidence.
  - CloudFormation Hooks and similar controls may cover only selected provisioning paths resource types operations accounts and regions.
  - Drift detection cannot prove continuous compliance when the scanner lacks permission coverage or availability.
  - Automatic remediation can cause outages or destroy evidence and is restricted to reviewed reversible actions.
  - Planned Trivy SCA SBOM provenance distribution signing and OIDC profiles remain gaps until their dedicated controls are implemented and verified.
  - Framework mappings are supporting relationships and do not establish cloud security certification or compliance.
