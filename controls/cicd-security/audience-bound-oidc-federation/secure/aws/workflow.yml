name: Verify exact AWS deployment identity

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-aws-identity:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Exchange GitHub OIDC token for the deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::111122223333:role/github-oidc-secure-app-prod
          role-duration-seconds: 900
          role-session-name: gh-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: "111122223333"
          unset-current-credentials: true

      - name: Confirm the assumed identity without exposing credentials
        run: >-
          aws sts get-caller-identity
          --query '{Account:Account,Arn:Arn}'
          --output json
