id: PSB-CICD-006
title: Enforce exact GitHub Actions federation to AWS
domain: cicd-security
summary: GitHub Actionsのworkload identityをAWSのexact audienceとimmutable subjectへ限定し、長期AWS keyを残さず、対象resourceだけの900秒sessionへ交換する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: CICD-OIDC-OVERBROAD-TRUST
    description: A valid GitHub token from another repository environment or purpose matches an overbroad AWS IAM role trust policy and obtains production authority.
  - id: CICD-OIDC-CREDENTIAL-EXPOSURE
    description: A long-lived stored AWS access key or an overprivileged STS role is stolen by compromised workflow code and used beyond the intended deployment.
  - id: CICD-OIDC-UNVERIFIED-LIVE-STATE
    description: Repository fixtures missing provider evidence or a failed exchange check are interpreted as proof that the live GitHub and AWS federation is secure.
implementations:
  insecure:
    - insecure/aws/wildcard-trust-policy.json
    - insecure/aws/stored-credentials-workflow.yml
  secure:
    - secure/aws/workflow.yml
    - secure/aws/role-trust-policy.json
    - secure/aws/role-permissions-policy.json
verification:
  type: manual
  procedure: README.md#verification
  expected:
    - the current AWS IAM role trust uses the GitHub issuer exact sts.amazonaws.com audience and exact immutable repository and production Environment subject
    - only the protected production job can request an OIDC token and a trusted main run obtains the expected AWS account and role
    - harmless wrong-subject and wrong-audience runs are rejected by AWS STS before any deployment operation
    - the dedicated role permits only reviewed deployment actions on exact resources and the workflow requests a 900-second session
    - repository Environment and organization secret-name inventories contain no long-lived AWS access key used by the deployment
    - missing stale incomplete or failed live verification remains NOT_CHECKED or ERROR rather than PASS
checks:
  - id: OIDC-001
    title: AWS validates the GitHub OIDC issuer and token
    required_state: the current AWS IAM OIDC provider is exactly token.actions.githubusercontent.com with sts.amazonaws.com as an allowed audience and AWS performs the token validation
    responsible_role: ci-platform
    applies_to:
      - github-actions-oidc-jwt
      - aws-iam-oidc-provider
    context:
      threat_actor: attacker network intermediary or compromised pipeline component presenting a token from an untrusted or fabricated issuer
      attack_or_failure_scenario: AWS grants a role without authenticating the GitHub issuer and the token through its configured OIDC federation service
      why_required: audience and subject conditions have no security value unless AWS first authenticates the token and issuer that supplied those claims
    verification:
      type: external-evidence
      method: Inspect the current AWS IAM OIDC provider and a successful AssumeRoleWithWebIdentity event for the target role
      expected: the provider URL and audience are exact and AWS records a successful web-identity exchange only for the trusted issuer
      evidence:
        - current AWS IAM OIDC provider setting with account and capture time
        - sanitized CloudTrail AssumeRoleWithWebIdentity event
    mapping_status: reviewed
  - id: OIDC-002
    title: AWS role trust uses an exact audience and immutable repository subject
    required_state: the current role trust uses StringEquals for sts.amazonaws.com and one immutable owner ID repository ID and production Environment subject without wildcard
    responsible_role: ci-platform
    applies_to:
      - aws-iam-role-trust-policy
      - github-repository-identity
    context:
      threat_actor: malicious repository namespace squatter or administrator using an organization or repository wildcard for convenience
      attack_or_failure_scenario: a valid GitHub-issued token from another repository environment or purpose matches the production role trust policy
      why_required: token authenticity proves GitHub issued a token while exact audience and immutable subject decide whether this particular workload may assume the role
    verification:
      type: hybrid
      method: Compare secure/aws/role-trust-policy.json with the current AWS role trust and run the wrong-subject and wrong-audience tests in README.md
      expected: the live trust has no wildcard and AWS STS rejects both mismatched contexts
      evidence:
        - current AWS IAM role trust policy with account role and capture time
        - sanitized negative exchange results
    mapping_status: reviewed
  - id: OIDC-003
    title: GitHub Environment limits the trusted deployment context
    required_state: the direct workflow uses the production Environment and its current deployment branch policy permits only main with required independent review where the provider plan supports it
    responsible_role: repository-admin
    applies_to:
      - github-actions-deploy-job
      - github-environment
    context:
      threat_actor: untrusted branch contributor compromised maintainer or operator starting the deployment workflow from an unreviewed ref
      attack_or_failure_scenario: a non-main run reaches the production Environment and obtains a token whose environment subject matches the AWS role trust
      why_required: an environment-based OIDC subject does not itself encode the branch so the live Environment branch policy supplies the missing trusted-ref restriction
    verification:
      type: external-evidence
      method: Inspect the current production Environment deployment branch required reviewer self-review and bypass settings then run a harmless branch rejection drill
      expected: only main can enter the production job and unavailable plan-dependent protections remain explicitly NOT_CHECKED or documented residual risk
      evidence:
        - current GitHub Environment setting with repository and capture time
        - sanitized protected-job drill result
    mapping_status: reviewed
  - id: OIDC-004
    title: GitHub token and AWS STS session are current and short lived
    required_state: AWS validates token time claims and the workflow requests a 900-second AssumeRoleWithWebIdentity session
    responsible_role: ci-platform
    applies_to:
      - github-actions-oidc-jwt
      - aws-sts-session
    context:
      threat_actor: attacker replaying a token or temporary credential captured from runner memory logs telemetry or a compromised deploy step
      attack_or_failure_scenario: an expired token is accepted or an issued AWS session remains useful longer than the smallest supported deployment window
      why_required: provider-side time validation rejects stale tokens and the 900-second request bounds the useful lifetime of a stolen AWS session without claiming single-use enforcement
    verification:
      type: external-evidence
      method: Inspect the successful AWS STS and CloudTrail exchange for token acceptance time and durationSeconds 900
      expected: stale or invalid tokens are rejected and the accepted session request is 900 seconds
      evidence:
        - sanitized successful and rejected exchange records
        - CloudTrail request duration
    mapping_status: reviewed
  - id: OIDC-005
    title: OIDC token issuance is isolated to the protected exchange job
    required_state: workflow deny-all with id-token write only on the production Environment job that performs the AWS exchange
    responsible_role: repository-admin
    applies_to:
      - github-actions-workflow
      - protected-deploy-job
      - github-environment
    context:
      threat_actor: compromised test dependency pull-request code or maintainer granting OIDC permission to unrelated jobs
      attack_or_failure_scenario: code outside the reviewed production exchange job requests a valid GitHub token and attempts to use the AWS role
      why_required: exact AWS claims limit which token is accepted while job isolation limits which executed code can request a candidate token in the first place
    verification:
      type: hybrid
      method: Review every id-token write grant under PSB-CICD-004 and compare the deployed workflow with secure/aws/workflow.yml
      expected: only the exact production federation job has id-token write and all other jobs remain denied
      evidence:
        - exact deployed workflow revision
        - PSB-CICD-004 permission review record
    mapping_status: reviewed
  - id: OIDC-006
    title: Long-lived AWS credentials are absent
    required_state: workflow and current repository Environment and organization secret-name inventories contain no long-lived AWS access key used by this deployment
    responsible_role: repository-admin
    applies_to:
      - github-actions-secret
      - workflow-environment
    context:
      threat_actor: compromised Action malicious step repository maintainer or attacker obtaining a legacy stored AWS key
      attack_or_failure_scenario: a long-lived AWS key remains after OIDC adoption and can be stolen and reused independently of the exact federation conditions
      why_required: exact OIDC trust reduces durable credential risk only when the legacy credential path and its known consumers are actually removed
    verification:
      type: external-evidence
      method: Review current repository Environment and organization secret names migrate known consumers remove the old key and rerun the positive exchange
      expected: no deployment consumer or GitHub secret inventory contains a long-lived AWS access key
      evidence:
        - sanitized current secret-name inventories with target and capture time
        - old-key deletion and consumer migration record
        - post-removal positive exchange result
    mapping_status: reviewed
  - id: OIDC-007
    title: AWS session is dedicated and least privilege
    required_state: the expected account issues one named role for a 900-second session and that role permits only reviewed actions on exact deployment resources
    responsible_role: ci-platform
    applies_to:
      - aws-sts-session
      - aws-iam-role
      - deployment-resource
    context:
      threat_actor: compromised production step or cloud administrator assigning wildcard permissions or an unrelated account role
      attack_or_failure_scenario: a correctly authenticated workflow receives authority over unrelated AWS resources or a different account than reviewers intended
      why_required: strong workload authentication cannot compensate for an overprivileged or misdirected authorization decision after token exchange
    verification:
      type: hybrid
      method: Match the live role policy to documented deployment operations validate it with IAM Access Analyzer and confirm account and role through sts get-caller-identity
      expected: the expected account and role are used with no wildcard action or resource and every grant has a reviewed deployment operation
      evidence:
        - current IAM role permissions policy
        - IAM Access Analyzer result
        - sanitized caller identity and semantic permission review
    mapping_status: reviewed
  - id: OIDC-008
    title: Live federation verification fails closed
    required_state: missing stale partial or failed GitHub AWS secret-inventory and exchange evidence remains NOT_CHECKED or ERROR and an unexpectedly denied trusted exchange is FAIL
    responsible_role: security
    applies_to:
      - oidc-federation-verification
      - deployment-quality-gate
    context:
      threat_actor: provider API failure insufficient reviewer permission partial inventory or operator treating skipped verification as success
      attack_or_failure_scenario: deployment federation is reported secure even though one or more live trust authorization or legacy-credential facts could not be evaluated
      why_required: explicit non-clean states prevent repository samples and missing provider evidence from becoming a false organization adoption claim
    verification:
      type: manual
      method: Complete every README verification row and record PASS FAIL NOT_CHECKED or ERROR without inferring missing observations
      expected: only complete current live evidence can support PASS and the canonical runner reports NOT_CHECKED before that review
      evidence:
        - dated manual verification record with target reviewer and result per check
    mapping_status: unmapped
mappings:
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-CONCEPT-OIDC
    relationship: verifies
    confidence: high
    rationale: The AWS reference and live procedure verify exact GitHub workload trust short-lived role exchange and removal of duplicated long-lived AWS credentials without treating repository files as adoption evidence.
    reviewer: product-security
    review_date: "2026-09-06"
    applies_to:
      - OIDC-001
      - OIDC-002
      - OIDC-004
      - OIDC-006
      - OIDC-007
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-REF-OIDC
    relationship: verifies
