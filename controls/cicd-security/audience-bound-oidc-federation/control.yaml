    applies_to:
      - OIDC-006
limitations:
  - The first slice is a provider-neutral offline contract and does not validate AWS Azure GCP or another provider-specific trust-policy syntax or live configuration.
  - Production validation must use issuer discovery and rotating JWKS with authenticated transport while the committed public key is synthetic test material only.
  - Repository and environment secret inventory and GitHub Environment protection require separately collected current API evidence.
  - The static JSON replay fixture demonstrates the decision contract but production single-use enforcement requires an atomic durable provider-side ledger.
  - A malicious step in the approved deploy job can still steal the OIDC or exchanged credential during its short lifetime so build separation egress restriction and runtime monitoring remain necessary.
  - Provider claim support minimum credential TTL session cleanup and audit fields vary and require a reviewed provider adapter.
  - Package registry Trusted Publishing is a separate future adoption profile and is not covered by this cloud deployment control.
status: prototype
owner: product-security
evidence_level: E3
