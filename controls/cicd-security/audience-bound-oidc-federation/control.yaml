limitations:
  - The reference profile covers the standard AWS partition and does not establish equivalent audiences ARNs conditions or behavior for AWS China AWS GovCloud Azure Google Cloud or another provider.
  - GitHub Enterprise Server may not support the immutable subject format used by the reference and requires a separate reviewed profile.
  - GitHub Environment protection and secret inventory require current provider evidence and cannot be inferred from the committed workflow.
  - AWS STS does not provide the synthetic single-use JTI ledger previously modeled by this package so replay within a stolen temporary session lifetime remains residual risk.
  - A successful sts get-caller-identity call verifies the account and role but not the semantic minimum of every deployment permission.
  - A malicious step in the approved job can steal the OIDC token or AWS session during its short lifetime so job separation egress restriction and runner monitoring remain necessary.
  - IAM trust permission Environment and Action behavior can change and require review against the linked official guidance before updates.
status: reference
owner: product-security
evidence_level: E1
