# INSECURE EXAMPLE: isolated reference only; never copy into .github/workflows.
name: Insecure stored AWS credentials

on:
  push:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
    steps:
      - name: Long-lived keys remain reusable outside this run
        run: aws sts get-caller-identity
