# INSECURE FIXTURE: this file is outside .github/workflows and must not be deployed.
name: Shared executable cache crossing into release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-producer:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Restore and automatically save executable state
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .venv
          key: python-${{ runner.os }}
          restore-keys: |
            python-

      - name: Populate executable state without an integrity identity
        shell: bash
        run: python3 -m venv .venv

  simulated-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: insecure-cache-example-do-not-create
    steps:
      - name: Restore shared executable state in a privileged phase
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .venv
          key: python-${{ runner.os }}
          restore-keys: |
            python-

      - name: Execute the restored cache
        shell: bash
        run: .venv/bin/python -c 'print("insecure cached interpreter executed")'
