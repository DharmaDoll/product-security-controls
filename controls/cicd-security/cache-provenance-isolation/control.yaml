limitations:
  - Repository files and reference workflow presence do not prove current GitHub cache scope branch protection workflow inventory or live run behavior in an adopting repository.
  - GitHub native cache archives are not signed or independently authenticated before extraction and a compromised trusted default-branch producer can still supply malicious bytes to non-privileged consumers.
  - The reference depends on complete hash-locked binary Python requirements and does not support sdist-only projects without a separately isolated dependency build design.
  - Pull requests can read default-branch cache contents so secrets credentials private source and other sensitive data must never enter a cached path.
  - Cache service outage eviction quota and denial of service can increase build time or network use and are not integrity findings when the job resets to a clean verified install.
  - GitHub Enterprise Server self-hosted runners macOS Windows and other CI providers require separate review of cache access extraction runtime and evidence behavior.
  - Branch protection workflow review token policy runner lifecycle install hooks and release provenance remain owned by their related controls and are not reimplemented here.
  - Static cache-poisoning audits detect known release and cache patterns but cannot prove live provider state custom client behavior cache contents or complete organization adoption.
status: prototype
