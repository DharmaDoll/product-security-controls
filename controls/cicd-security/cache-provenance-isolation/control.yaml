id: PSB-CICD-009
title: GitHub Actions cacheをtrusted writerと非特権consumerへ隔離する
domain: cicd-security
summary: GitHub Actions cacheの保存をprotected default branchへ限定し、PRをrestore-only、lookupをexact、内容をhash再検証するdownload cacheへ限定し、privileged jobからcacheを除外する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: CICD-CACHE-POISONING
    description: An untrusted or compromised cache producer stores executable or dependency state that a later privileged workflow restores and executes.
  - id: CICD-CACHE-IDENTITY-CONFUSION
    description: A broad key partial match or restore prefix selects cache state created for another workflow purpose platform runtime or dependency graph.
  - id: CICD-CACHE-INTEGRITY-BYPASS
    description: A cache hit causes the consumer to skip dependency integrity verification or execute an installed tree build output tool or hook directly from cache.
  - id: CICD-CACHE-VERIFICATION-GAP
    description: Missing workflow inventory inaccessible provider state or failed live tests are treated as proof that cache isolation is active.
implementations:
  insecure:
    - insecure/workflow.yml
  secure:
    - secure/workflow.yml
verification:
  type: manual
  procedure: README.md#verification
  expected:
    - the canonical command reports NOT_CHECKED instead of treating repository files as proof of live GitHub adoption
    - only a reviewed push to the protected default branch can save the reference cache
    - pull-request and fork runs restore only and cannot create or update the default-branch cache
    - cache lookup accepts only the exact purpose platform runtime and lockfile identity and resets all other restore results
    - cached paths contain dependency downloads rather than secrets installed trees tools build output or startup state
    - every cache hit is followed by hash-locked dependency verification and every privileged release deploy or signing job remains cache-free
    - incomplete provider evidence and failed collection remain NOT_CHECKED or ERROR rather than PASS
checks:
  - id: CAC-001
    title: Cache save is limited to a reviewed protected-default-branch producer
    required_state: only the reference dependency job on a reviewed push to the protected default branch can execute the cache save action
    responsible_role: repository-admin
    applies_to:
      - github-actions-cache-writer
      - protected-default-branch
      - cache-save-trigger
    context:
      threat_actor: untrusted contributor compromised workflow dependency or operator enabling cache writes on an actor-influenced trigger
      attack_or_failure_scenario: a workflow running attacker-controlled or unreviewed bytes writes cache state into the default branch namespace consumed by later runs
      why_required: provider branch scope does not identify the workflow purpose or prove the producer executed reviewed bytes so save authority must be constrained at the workflow boundary
    verification:
      type: external-evidence
      method: inspect every cache save step and compare its event and ref condition with a live reviewed default-branch run and current branch protection
      expected: save executes only for push on the protected default branch and every other trigger skips the save step
      evidence:
        - exact workflow revision and sanitized trusted push run showing the save decision
        - current protected default branch rule or ruleset with target and capture time
    mapping_status: reviewed
  - id: CAC-002
    title: Cache lookup binds exact purpose platform runtime and dependency identity
    required_state: the cache key contains a fixed purpose and schema namespace runner OS architecture exact runtime version and non-empty lockfile SHA-256 and defines no restore prefixes
    responsible_role: developer
    applies_to:
      - github-actions-cache-key
      - dependency-lockfile
      - runtime-platform
    context:
      threat_actor: workflow author compromised producer or configuration mistake choosing a shared stale or incomplete cache identity
      attack_or_failure_scenario: a consumer receives bytes created for another workflow purpose platform runtime or dependency graph through a broad or empty key
      why_required: branch isolation alone permits multiple workflows to share cache entries and a lockfile hash alone does not separate incompatible runtime or cache format contexts
    verification:
      type: manual
      method: review the resolved live cache key lockfile hash and absence of restore-keys for the exact workflow revision
      expected: every identity component is present the lockfile hash is non-empty and no fallback key is configured
      evidence:
        - reviewed workflow revision and sanitized resolved key
        - exact reviewed lockfile digest
    mapping_status: reviewed
  - id: CAC-003
    title: Pull-request and fork consumers are restore-only
    required_state: pull-request runs do not invoke cache save and cannot create or update cache entries in the protected default branch scope
    responsible_role: repository-admin
    applies_to:
      - github-actions-pull-request-job
      - github-actions-cache-writer
      - default-branch-cache-scope
    context:
      threat_actor: fork or pull-request author controlling source dependency inputs tests or workflow changes in the untrusted run
      attack_or_failure_scenario: a pull-request run populates a cache later restored by a trusted default-branch or privileged workflow
      why_required: removing direct secrets from an untrusted job does not prevent indirect elevation when attacker-controlled persistent state can cross into a higher-trust run
    verification:
      type: external-evidence
      method: run a harmless pull request and compare the default-branch cache list before and after while confirming the save step is skipped
      expected: the pull request may restore readable cache state but performs no save and creates or updates no default-branch cache entry
      evidence:
        - sanitized pull-request run with event ref workflow revision and skipped save step
        - before and after read-only cache listings scoped to the protected default branch
    mapping_status: reviewed
  - id: CAC-004
    title: Cache paths contain no secret or directly executed persistent state
    required_state: cache paths are limited to reviewed package download stores and exclude credentials source installed dependency trees environments tools build output plugins startup files and PATH directories
    responsible_role: developer
    applies_to:
      - cached-path-inventory
      - dependency-download-cache
      - workflow-secret-boundary
    context:
      threat_actor: cache-reading fork contributor compromised cache writer or developer accidentally selecting a broad directory
      attack_or_failure_scenario: sensitive data is disclosed through a readable cache or restored files are executed directly without dependency artifact verification
      why_required: trusted-writer restrictions do not provide cache confidentiality and do not make executable cache contents safe when a trusted producer is compromised
    verification:
      type: manual
      method: inspect each live cache path and the package manager cache contract then trace whether any restored file is executed or contains sensitive data
      expected: only dependency download data is cached and no cached path contains secrets installed environments tools or build output
      evidence:
        - dated cache path inventory with content classification and reviewer
        - reviewed package manager cache documentation or observed path behavior
    mapping_status: reviewed
  - id: CAC-005
    title: Non-exact restores are discarded and dependency integrity is revalidated
    required_state: a failed missing or partial restore is removed before clean download and an exact hit still passes complete hash-locked wheel-only installation and dependency consistency checks
    responsible_role: developer
    applies_to:
      - cache-restore-decision
      - restored-dependency-artifact
      - dependency-integrity-check
    context:
      threat_actor: cache storage attacker compromised trusted producer stale cache entry or service failure leaving partial bytes on disk
      attack_or_failure_scenario: the consumer treats any restored bytes as an exact trusted dependency set or skips integrity verification because the cache action reported a match
      why_required: exact naming authorizes a lookup context but only independent artifact hashes detect malicious or corrupted content returned for that identity
    verification:
      type: external-evidence
      method: compare an exact-hit run with a harmless lockfile-change run and confirm cleanup plus require-hashes only-binary installation and pip check in both paths
      expected: only exact hits survive cleanup every install verifies hashes and missing partial corrupt or unavailable cache state cannot bypass dependency checks
      evidence:
        - sanitized exact-hit and changed-lockfile run logs
        - dependency integrity command and result bound to the reviewed lockfile digest
    mapping_status: reviewed
  - id: CAC-006
    title: Privileged release deploy and signing jobs consume no CI cache
    required_state: every job with secret write OIDC protected Environment release deploy or signing authority uses no cache-aware action or cached path
    responsible_role: release-manager
    applies_to:
      - privileged-ci-job
      - release-workflow
      - deployment-workflow
      - signing-workflow
    context:
      threat_actor: compromised cache writer workflow dependency or trusted producer able to persist malicious executable state
      attack_or_failure_scenario: a privileged job restores cache state and executes attacker-influenced tools hooks dependencies interpreters or build output with release or deployment authority
      why_required: avoiding the high-impact consumer closes the cache-to-privilege path even when native cache content cannot be cryptographically authenticated before extraction
    verification:
      type: manual
      method: inventory all privileged workflows and trace cache-aware actions setup-action caching custom clients and shared cache paths
      expected: no privileged job restores saves or directly consumes CI cache state
      evidence:
        - dated complete privileged workflow inventory with reviewer
        - exact reviewed workflow revisions and cache-use decision for each privileged job
    mapping_status: reviewed
  - id: CAC-007
    title: Incomplete live cache verification is never reported as clean
    required_state: missing workflow inventory inaccessible branch or cache state incomplete pagination stale evidence and failed positive or negative runs remain NOT_CHECKED or ERROR
    responsible_role: security
    applies_to:
      - cache-workflow-inventory
      - github-provider-evidence
      - cache-isolation-assessment
    context:
      threat_actor: provider API failure permission denial partial inventory stale evidence or reviewer relying on copied reference files
      attack_or_failure_scenario: one or more cache writers consumers or provider states cannot be evaluated but the adopting repository is reported as protected
      why_required: configuration examples establish a design but only complete current live observations can establish whether the provider enforces that design for the target repository
    verification:
      type: manual
      method: require a complete dated workflow inventory provider cache listing and both harmless live runs with explicit result status for every check
      expected: only complete current evidence supports PASS while missing observations are NOT_CHECKED and collection or evaluation failures are ERROR
      evidence:
        - manual assessment record with PASS FAIL NOT_CHECKED or ERROR for every check
        - source target capture time and reviewer for every live observation
    mapping_status: unmapped
mappings:
