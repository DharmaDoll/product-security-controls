id: PSB-CICD-008
title: CI/CDの特権control-plane変更を本人・承認・監査証跡へ結合する
domain: cicd-security
summary: SCM、CI、cloud、registry、signing serviceの重要設定変更を、記名管理者、具体的な変更内容、独立承認、provider audit、変更後確認へ結び付ける。
check_context_version: "1.0"
security_functions:
  - detect
  - verify
  - govern
threats:
  - id: CICD-CONTROL-PLANE-ACCOUNT-COMPROMISE
    description: A stolen shared or malicious administrator identity weakens a software supply-chain setting outside the reviewed change path and the changed authority is then usable by a downstream workflow or actor.
  - id: CICD-CONTROL-PLANE-CHANGE-SUBSTITUTION
    description: A request or approval names one target and desired setting but the administrator applies a different target or value and the mismatch is not reviewed against provider state.
  - id: CICD-CONTROL-PLANE-EMERGENCY-BYPASS
    description: An emergency change remains active without bounded independent review or missing provider evidence is treated as proof that no unauthorized change occurred.
implementations:
  insecure:
    - insecure/uncontrolled-change.md
  secure:
    - secure/privileged-change-runbook.md
    - secure/change-record-template.md
verification:
  type: manual
  procedure: README.md#verification
  expected:
    - the canonical command reports NOT_CHECKED instead of treating repository documentation as live adoption
    - each in-scope privileged change names an attributable current administrator and an independent approver
    - the request records the exact provider target readable before and after values impact conditions and rollback before execution
    - the provider audit event and current setting are reviewed after execution and match the approved change
    - emergency changes expire within one hour and receive an independent accepted or reverted decision
    - missing partial stale inaccessible or inconsistent live evidence remains NOT_CHECKED FAIL or ERROR rather than PASS
    - a harmless sandbox drill verifies both the ordinary path and detection of an unapproved direct change without weakening production protection
checks:
  - id: CPC-001
    title: Privileged change actor is an attributable current human
    required_state: each change is performed by one named current human in an explicit service-specific administrator role rather than a shared or anonymous account
    responsible_role: shared
    applies_to:
      - scm-control-plane
      - ci-control-plane
      - cloud-identity-control-plane
      - artifact-registry-control-plane
      - signing-control-plane
    context:
      threat_actor: an external attacker using a stolen administrator session or an insider using a shared owner account
      attack_or_failure_scenario: a security-impacting setting is changed but the organization cannot identify one current authorized person responsible for the action
      why_required: attribution and current role review limit shared ambient authority and make investigation and revocation possible without claiming that identity alone prevents misuse
    verification:
      type: external-evidence
      method: compare the live provider audit actor with current organization membership and the approved service-specific administrator role
      expected: the audit event identifies one named current human authorized for the exact target service
      evidence:
        - current membership and role observation with source target and capture time
        - provider audit event identifying the human actor
    mapping_status: reviewed
  - id: CPC-002
    title: Administrator authentication and session are bounded
    required_state: the administrator uses phishing-resistant authentication and the reference session is at most one hour with step-up no more than 15 minutes before execution
    responsible_role: shared
    applies_to:
      - administrator-session
      - privileged-reauthentication
    context:
      threat_actor: an attacker reusing a phished browser session or an unattended unlocked administrator workstation
      attack_or_failure_scenario: a long-lived session changes a supply-chain trust setting well after the human last proved possession of a strong authenticator
      why_required: named identity does not limit session replay while bounded lifetime and recent reauthentication reduce the useful window for a stolen session
    verification:
      type: external-evidence
      method: inspect the current provider or IdP authentication policy and the session or reauthentication record associated with the live drill
      expected: phishing-resistant authentication is enforced and the observed execution meets the reference session and step-up limits
      evidence:
        - current authentication policy with source and capture time
        - sanitized session or reauthentication observation
    mapping_status: reviewed
  - id: CPC-003
    title: Request fixes the exact target and readable before-after change
    required_state: the request records the provider service stable target setting name current value intended value reason impact conditions and rollback before execution
    responsible_role: ci-platform
    applies_to:
      - privileged-change-request
      - branch-protection
      - environment-protection
      - runner-registration-policy
      - workload-identity-trust
      - registry-protection
      - signing-policy
    context:
      threat_actor: a compromised administrator or mistaken operator substituting a broader target or weaker value after review
      attack_or_failure_scenario: an approval for one repository branch role or policy is reused to apply a materially different control-plane change
      why_required: a reviewer can compare intent with provider state only when the request identifies the exact target and understandable values rather than granting a generic permission to change settings
    verification:
      type: manual
      method: review the completed change record before execution and compare its target and before-after values with the provider screen or approved export
      expected: wildcard unowned ambiguous or value-less requests are not approved and large machine-readable policies use an attached reviewed representation
      evidence:
        - completed change request
        - provider before-state observation or approved export
    mapping_status: reviewed
  - id: CPC-004
    title: Ordinary privileged changes receive independent approval
    required_state: a person other than the requester and executor approves the exact target and intended after value before execution
    responsible_role: security
    applies_to:
      - privileged-change-approval
      - separation-of-duties
    context:
      threat_actor: a malicious or compromised administrator able to propose approve and execute a trust-boundary change alone
      attack_or_failure_scenario: one administrator weakens branch runner federation registry or signing protection without another person seeing the actual intended value
      why_required: independent review reduces unilateral mistakes and misuse while making a direct provider bypass unauthorized and detectable even where the provider cannot enforce two-person approval
    verification:
      type: manual
      method: compare requester executor approver target after value approval time and execution time in the completed change record
      expected: self-approval generic approval approval after execution and approval for another target or value are FAIL
      evidence:
        - timestamped approval in the organization change system
        - completed identity separation review
    mapping_status: reviewed
  - id: CPC-005
    title: Provider audit and current state match the approved change
    required_state: an independent reviewer confirms that the provider event actor action time and stable target plus the current setting match the approved request
    responsible_role: security
    applies_to:
      - provider-audit-log
      - privileged-change-execution
      - provider-current-setting
    context:
      threat_actor: a compromised administrator applying a different value or an operator mistakenly changing the wrong provider object
      attack_or_failure_scenario: the ticket appears approved but the provider records another actor target action or resulting setting and the mismatch is never noticed
      why_required: provider-side observation checks what actually happened instead of treating the request or executor statement as proof of the applied state
    verification:
      type: external-evidence
      method: inspect the live provider audit event and current setting then compare them with the completed request and approval
      expected: actor action time target and current value agree with the approved change and any missing or inconsistent observation is not PASS
      evidence:
        - provider audit event ID or durable reference
        - current setting observation with source target and capture time
        - independent comparison result
    mapping_status: reviewed
  - id: CPC-006
    title: Emergency changes are bounded and independently reviewed
    required_state: each emergency change has an incident reason exact target intended state one-hour expiry and a separate timely accepted or reverted decision
    responsible_role: incident-response
    applies_to:
      - emergency-control-plane-change
      - break-glass-governance
    context:
      threat_actor: an attacker or operator retaining emergency authority or a temporary weak setting after urgent containment is complete
      attack_or_failure_scenario: pre-approval is skipped during an incident and the change remains active indefinitely without another person checking what was applied
      why_required: a bounded independent post-review permits urgent containment without converting emergency access into a permanent approval bypass
    verification:
      type: external-evidence
      method: inspect the incident record provider event current state expiry reviewer identity review time and accepted or reverted decision
      expected: missing late self-reviewed unscoped or indefinitely extended emergency changes are FAIL
      evidence:
        - incident-linked emergency change record
        - provider current-state observation
        - independent post-change decision
    mapping_status: reviewed
  - id: CPC-007
    title: In-scope change verification is complete and fails closed
    required_state: every declared service and security-impacting change type has an owner review path current evidence source and explicit PASS FAIL NOT_CHECKED ERROR or reviewed N/A result
    responsible_role: ci-platform
    applies_to:
      - control-plane-change-inventory
      - live-verification-record
      - evidence-collection
    context:
      threat_actor: an incomplete inventory inaccessible provider setting stale record missing audit event or failed evidence collection
      attack_or_failure_scenario: one unreviewed provider or change path is omitted and the organization reports the whole control as clean because the documented sandbox example passed
      why_required: explicit scope completeness and non-clean failure states prevent one successful example or missing data from becoming false assurance about every control-plane change
    verification:
      type: external-evidence
      method: compare the approved scope inventory with current completed change records audit access evidence and result states including the harmless drill
      expected: omitted unavailable stale partial or inconsistent evidence is NOT_CHECKED FAIL or ERROR and only an owner-reviewed absent target can be N/A
      evidence:
        - current in-scope service and change-type inventory
        - result record for each in-scope check and provider
        - evidence-source and failure-owner review
    mapping_status: reviewed
mappings:
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHSC-SECURE-ACCOUNTS
    relationship: supports
    confidence: high
    rationale: The guidance requires named current administrators phishing-resistant authentication bounded sessions and an independent approver without claiming that repository templates configure GitHub.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-001
      - CPC-002
      - CPC-004
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-REF-SECURE-USE
    relationship: supports
    confidence: medium
    rationale: Exact change review provider-side observation and bounded emergency handling support secure Actions administration while live enforcement and wider organization adoption remain external evidence.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-003
      - CPC-004
      - CPC-005
      - CPC-006
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GH-ADMIN-SAML-IAM
    relationship: related-to
    confidence: medium
    rationale: Current membership strong authentication and bounded session evidence are relevant to the administrator identity boundary but must be confirmed in the adopting organization and IdP.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-001
      - CPC-002
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GH-ADMIN-RULESETS
    relationship: related-to
    confidence: medium
    rationale: The GitHub reference drill reviews one exact sandbox ruleset before and after a privileged change but does not prove complete repository or organization ruleset coverage.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-003
      - CPC-005
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GH-ADMIN-AUDIT-EVENTS
    relationship: supports
    confidence: medium
    rationale: Provider audit review supplies the actor action time and target observation for the reference change while complete export retention and provider integrity remain organization-owned.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-005
      - CPC-006
      - CPC-007
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-AC-01.01
    relationship: supports
    confidence: high
    rationale: Requiring phishing-resistant authentication and bounded reauthentication for sensitive administration supports MFA-protected privileged actions without proving the live provider state.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-001
      - CPC-002
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-AC-02.01
    relationship: supports
    confidence: medium
    rationale: Named administrators and independent approval support restricted collaborator privilege but do not assess the complete access inventory owned by PSB-SOURCE-006.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-001
      - CPC-004
  - framework: mitre-attack
    version: "v19.1"
    id: T1078
    relationship: mitigates
    confidence: medium
    rationale: Named administrators phishing-resistant authentication and bounded sessions reduce the opportunity to reuse stolen valid accounts but do not eliminate an unlocked endpoint or malicious authorized administrator.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-001
      - CPC-002
  - framework: mitre-attack
    version: "v19.1"
    id: T1098
    relationship: detects
    confidence: medium
    rationale: Comparing approved target and values with provider audit and current state can detect unauthorized account trust runner and policy manipulation without claiming prevention where direct administration remains possible.
    reviewer: product-security
    review_date: "2026-09-07"
    applies_to:
      - CPC-003
      - CPC-005
limitations:
  - Repository templates and metadata do not prove live provider settings organization membership authentication assurance approval enforcement audit completeness or adoption.
  - Where the provider allows direct administrator changes without a two-person gate the reference process detects unauthorized changes only at the audit-review cadence and does not guarantee prevention.
  - Provider or IdP compromise can forge or omit identity setting and event observations unless independently protected export and provider assurance are established.
  - Current-state observation may not prove the historical before state when the provider exposes no immutable history.
  - Human reviewers can approve an unsafe setting or misunderstand its downstream authority and must compose this control with the domain control that defines the secure required state.
  - Session and emergency time defaults may require provider-specific implementation and unsupported evidence remains NOT_CHECKED rather than a self-asserted PASS.
  - Machine workload federation remains PSB-CICD-006 runner lifecycle remains PSB-CICD-007 and GitHub organization posture remains PSB-SOURCE-006.
status: reference
owner: product-security
evidence_level: E1
