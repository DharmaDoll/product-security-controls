id: PSB-CICD-008
title: CI/CDの特権control-plane変更を本人・承認・監査証跡へ結合する
domain: cicd-security
summary: SCM、CI、cloud federation、registry、signing serviceの特権設定変更を、named administrator、phishing-resistant session、exact policy差分、独立承認、実行、provider audit eventへ結合する。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
  - govern
threats:
  - id: CICD-CONTROL-PLANE-ACCOUNT-COMPROMISE
    description: A stolen or shared administrator session changes privileged software supply-chain configuration outside the reviewed pipeline.
  - id: CICD-CONTROL-PLANE-CHANGE-SUBSTITUTION
    description: Approval or audit evidence is replayed for a different target request policy version or resulting configuration.
  - id: CICD-CONTROL-PLANE-EMERGENCY-BYPASS
    description: An emergency path becomes a permanent unreviewed bypass or missing provider evidence is interpreted as a clean change.
