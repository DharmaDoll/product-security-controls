verification:
  commands:
    - make verify-control CONTROL=PSB-CICD-008
  expected:
    - every privileged change names one current human administrator and phishing-resistant bounded session
    - request execution and provider audit event bind the exact service target policy version and before-after digests
    - ordinary changes require independent digest-bound approval before execution
    - emergency changes are time-bound and independently reviewed against the applied digest
    - required SCM CI cloud identity registry and signing service evidence is complete fresh and collector-pinned
    - missing stale malformed incomplete or credential-bearing evidence returns ERROR rather than PASS
    - the GitHub adapter joins stable audit actor request exact environment old-new settings and a runner-group current-state snapshot but remains partial until composed with the complete service inventory
    - the GitHub live collector proves a bounded query and complete pagination before atomically publishing a field-allow-listed audit export
    - the runner-group collector reads one stable group ID and completely paginates selected repository access before publishing a canonical current-state snapshot
    - the GitHub SCM adapter joins branch tag or repository-scoped push repository_ruleset.update to stable source ruleset and exact before-after history while push additionally requires one complete root-bound fork-network digest
    - the GitHub legacy branch adapter joins exact force-push deletion administrator-enforcement and CODEOWNER-review updates to stable repository and branch identity external human session reviewed before state and a current protection snapshot
    - the AWS adapter joins a successful CloudTrail UpdateAssumeRolePolicy event to an IAM GetRole snapshot external human session and reviewed change through stable account role event and request identities
    - the ECR adapter joins a successful CloudTrail SetRepositoryPolicy event to DescribeRepositories and GetRepositoryPolicy current state external human session and reviewed change while detecting same-name repository recreation
    - the KMS adapter joins a successful CloudTrail PutKeyPolicy event to DescribeKey and GetKeyPolicy current state external human session and reviewed change through one signing key ID and ARN while rejecting lockout-safety bypass
checks:
  - id: CPC-001
    title: Privileged change actor is an attributable current human
    required_state: named organization administrator in an explicit service-specific role allow-list using phishing-resistant authentication rather than a shared or anonymous identity
    responsible_role: ci-platform
    applies_to:
      - scm-control-plane
      - ci-control-plane
      - cloud-identity-control-plane
      - artifact-registry-control-plane
      - signing-control-plane
    context:
      threat_actor: external attacker using a phished administrator credential or an insider using a shared owner account
      attack_or_failure_scenario: branch environment runner federation registry or signing policy changes cannot be attributed to one current authorized person
      why_required: workflow least privilege does not protect provider settings when a broad or shared human administrator can change the trust boundary directly
    verification:
      type: hybrid
      method: normalize provider identity and membership evidence and evaluate it with make verify-control CONTROL=PSB-CICD-008
      expected: each change actor is one named current organization human in an allowed service role authenticated with phishing-resistant assurance
      evidence:
        - sanitized administrator identity record
        - organization membership decision
        - authentication assurance record
    mapping_status: reviewed
  - id: CPC-002
    title: Privileged session is short-lived and recently reauthenticated
    required_state: exact session ID with at most one-hour lifetime and step-up authentication no more than 15 minutes before execution
    responsible_role: ci-platform
    applies_to:
      - administrator-session
      - privileged-reauthentication
    context:
      threat_actor: attacker reusing a stolen browser session or unattended administrator workstation
      attack_or_failure_scenario: a long-lived session changes a supply-chain trust policy hours after the user last proved possession of a phishing-resistant authenticator
      why_required: actor naming alone does not limit replay; bounded lifetime and recent step-up reduce the usable window for stolen authenticated sessions
    verification:
      type: automated
      method: compare session issuance expiry reauthentication request and execution timestamps
      expected: execution occurs inside the session and within the reviewed reauthentication age
      evidence:
        - content-free session timeline
    mapping_status: reviewed
  - id: CPC-003
    title: Request fixes exact target policy and before-after configuration
    required_state: digest-pinned policy version exact service type target before digest after digest reason and owned change record
    responsible_role: ci-platform
    applies_to:
      - privileged-change-request
      - branch-protection
      - environment-protection
      - runner-registration-policy
      - workload-identity-trust
      - registry-protection
      - signing-policy
    context:
      threat_actor: compromised administrator or faulty automation substituting a broader target or weaker configuration after review
      attack_or_failure_scenario: an approval for one branch environment trust policy or digest is reused to apply a different privileged configuration
      why_required: immutable request identity makes reviewer intent comparable to the provider-side result and prevents approval from becoming a generic write permit
    verification:
      type: automated
      method: validate policy pin exact target type and distinct SHA-256 before-after digests
      expected: wildcard unclassified mutable unowned or digest-less changes are rejected
      evidence:
        - sanitized change request
        - before-after configuration digests
    mapping_status: reviewed
  - id: CPC-004
    title: Ordinary privileged changes receive independent approval
    required_state: at least one non-requesting approver binds approval to exact request and after digest before execution
    responsible_role: security
    applies_to:
      - privileged-change-approval
      - separation-of-duties
    context:
      threat_actor: malicious or compromised administrator able to propose approve and execute a trust-boundary change alone
      attack_or_failure_scenario: one privileged account silently weakens branch runner federation registry or signing protections without a second party seeing the resulting policy
      why_required: digest-bound separation of duties detects and blocks unilateral control-plane tampering that repository pull-request review cannot observe
    verification:
      type: automated
      method: compare approver identity request ID resulting digest and timestamp to the execution record
      expected: requester or executor self-approval replay late approval and digest mismatch are rejected
      evidence:
        - sanitized approval receipt
    mapping_status: reviewed
  - id: CPC-005
    title: Provider execution and audit event match the approved request
    required_state: unique provider event binds actor session request target execution time and exact applied digest
    responsible_role: security
    applies_to:
      - provider-audit-log
      - privileged-change-execution
      - incident-evidence
    context:
      threat_actor: compromised provider session or administrator applying a different configuration than reviewers approved
      attack_or_failure_scenario: ticket and approval appear valid but the provider audit record names another actor session target request or resulting policy
      why_required: provider-side observation closes the evidence chain at the actual control plane instead of trusting only self-reported change-management records
    verification:
      type: hybrid
      method: correlate normalized provider audit events to request execution and applied configuration digest
      expected: missing duplicate early or mismatched audit events and substituted executions are rejected
      evidence:
        - provider audit event ID
        - applied configuration digest
        - correlation result
    mapping_status: reviewed
  - id: CPC-006
    title: Emergency changes are bounded and independently reviewed
    required_state: owned incident reason one-hour expiry and separate timely review bound to exact request and applied digest
    responsible_role: security
    applies_to:
      - emergency-control-plane-change
      - break-glass-governance
    context:
      threat_actor: attacker or operator retaining an emergency bypass after urgent containment is complete
      attack_or_failure_scenario: approval is skipped during an incident and the weakened or changed trust policy persists without independent review or reversion
      why_required: a bounded separately reviewed emergency path supports urgent containment without turning break-glass authority into an indefinite approval bypass
    verification:
      type: automated
      method: evaluate emergency reason expiry post-review independence digest binding and decision
      expected: missing late self-reviewed unbound or overlong emergency changes are rejected
      evidence:
        - incident change record
        - post-change review receipt
    mapping_status: reviewed
  - id: CPC-007
    title: Cross-service collection is complete fresh and fails closed
    required_state: digest-pinned collector covers required SCM CI cloud identity registry and signing services with evidence age at most 15 minutes and no credentials
    responsible_role: ci-platform
    applies_to:
      - control-plane-evidence-collector
      - cross-provider-change-inventory
      - control-plane-change-verifier
    context:
      threat_actor: collector outage provider API failure stale cache malformed input or evidence export accidentally containing a credential
      attack_or_failure_scenario: an unseen privileged change or unsafe evidence bundle is interpreted as no findings because one provider was not collected or parsing failed
      why_required: complete explicit service coverage and ERROR semantics prevent partial inventory from becoming false assurance while secret-field rejection keeps audit evidence from creating another credential leak
    verification:
      type: automated
      method: run negative tests for missing services unavailable stale malformed incomplete mutable and credential-bearing evidence
      expected: evidence failure returns ERROR and never echoes credential values
      evidence:
        - collector identity and coverage record
        - sanitized negative-test output
    mapping_status: unmapped
