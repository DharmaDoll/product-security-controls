limitations:
  - The fixtures are provider-neutral normalized evidence and do not prove live GitHub GitLab cloud registry or signing-service configuration.
  - The verifier does not call provider APIs mutate settings validate hardware authenticator custody or establish organization membership.
  - The GitHub normalizer consumes reviewed exports and does not itself call the live REST API; GitHub audit fields cannot prove phishing-resistant authentication or independent approval without the organization identity/session and change-register joins.
  - The live GitHub collector selects environment.update_protection_rule org.runner_group_updated repository_ruleset.update protected_branch.update_allow_force_pushes_enforcement_level protected_branch.update_allow_deletions_enforcement_level protected_branch.update_admin_enforced and protected_branch.update_require_code_owner_review; runner ruleset and legacy branch events become evidence only after their required current-state or history joins are complete.
  - GitHub runner-group current state independently confirms the applied after digest but not the historical before state; the before digest remains a reviewed change-register assertion and needs an independently retained pre-change snapshot for stronger historical assurance.
  - Runner-group update and snapshot collection are not transactionally atomic; the normalizer rejects later updates found before the snapshot, but provider event omission or concurrent changes outside the complete audit window remain residual risk.
  - The GitHub SCM adapters cover repository- and organization-scoped branch and tag ruleset updates repository-scoped push updates and legacy branch force-push deletion administrator-enforcement and CODEOWNER-review updates; other legacy branch fields ruleset create delete organization-wide push repository transfer rename and archive require separately reviewed adapters.
  - Repository push rulesets bind a private or internal non-fork root stable identity network_count completely paginated fork identities and reviewed network digest; the REST reads are not transactional and fork visibility or concurrent network changes remain residual risk.
  - Organization-wide push rulesets require complete expansion of every repository selector and every resulting root fork network; this adapter rejects that scope rather than extrapolating one repository snapshot.
  - Organization ruleset audit classification is an implementation inference from the documented repository_ruleset.update event ruleset_source_type Organization stable org_id and absent repository fields; validate the sanitized event shape in the adopting tenant and fail closed on divergence.
  - Reading repository or organization ruleset bypass actors and exact history requires the corresponding Administration write permission even though the collector only performs GET requests; isolate that credential from mutation paths and monitor all use because GitHub does not expose a narrower read-only history permission and organization scope has a larger blast radius.
  - Ruleset state is structurally canonicalized and may fail closed for semantically harmless list ordering changes; current and history APIs are not transactionally atomic despite later-version rejection.
  - The legacy branch adapter covers protected_branch.update_allow_force_pushes_enforcement_level protected_branch.update_allow_deletions_enforcement_level protected_branch.update_admin_enforced and protected_branch.update_require_code_owner_review; the versioned contract accepts force-push and deletion numeric levels zero disabled and one or two enabled plus strict boolean admin_enforced and require_code_owner_review fields. The numeric enum meaning is not documented in the public audit-event catalog, so tenant event shape must be validated before adoption and any other value fails closed.
  - GitHub exposes current legacy branch protection but no version history through this REST path, so the before state remains a reviewed register assertion; a separately retained pre-change snapshot is required for stronger historical assurance.
  - The AWS adapter is limited to root-path IAM roles changed through UpdateAssumeRolePolicy; roles with another path, CloudFormation or Terraform replacement, CreateRole, service-linked roles, SAML trust, permission policies, Azure, and GCP need separately reviewed adapters.
  - IAM GetRole confirms the applied trust policy and stable RoleId but does not return its historical predecessor; the before digest remains a reviewed register assertion unless an independent pre-change snapshot is retained.
  - CloudTrail identity attributes do not prove phishing-resistant authentication or current employment; those properties come from an organization identity and session export joined to the exact assumed-role principal and source identity.
  - IAM policy canonicalization is structural JSON rather than full IAM semantic normalization; harmless statement or array reordering may fail closed and require a new reviewed adapter version.
  - The ECR adapter covers repository access-policy changes only; transport workload identity image tag immutability operation audit and lifecycle enforcement remain PSB-CONTAINER-002, while registry-level policy replication lifecycle and scanning configuration need distinct adapters.
  - ECR has no immutable repository ID equivalent to IAM RoleId, so the adapter binds account region repository ARN name and creation time as one generation; assurance still depends on trustworthy DescribeRepositories evidence and complete delete-create audit retention.
  - Forced SetRepositoryPolicy operations can intentionally bypass lockout prevention and are rejected by the ordinary path until a separately governed emergency adapter binds the force decision and post-review.
  - GetRepositoryPolicy confirms the current after state but not the historical before state, and structural JSON canonicalization may reject semantically equivalent ordering changes.
  - The KMS adapter covers direct default-policy PutKeyPolicy changes for enabled customer-managed SIGN_VERIFY keys only; key creation deletion disablement grants aliases imported material custom key stores multi-Region operations and cryptographic Sign use need separately owned controls or adapters.
  - DescribeKey and GetKeyPolicy confirm the current signing key identity purpose and after policy but not the historical before state; structural JSON canonicalization may reject semantically equivalent ordering changes.
  - A KMS key policy alone is not the complete effective-authorization graph; IAM policies grants and VPC endpoint policies require separate inventory and review before claiming that signing or policy-administration authority was actually removed.
  - BypassPolicyLockoutSafetyCheck is rejected by the ordinary KMS path because it can make a key unmanageable; its use requires a separately governed emergency adapter that binds the exact bypass decision expiry and post-review.
  - Each GitHub CI or SCM fragment remains partial and cannot satisfy the five-service completeness check by itself.
  - Provider control-plane compromise could forge or omit events unless independent export integrity retention and provider assurance are established.
  - Machine workload federation remains PSB-CICD-006 and runner registration lifecycle remains PSB-CICD-007.
  - Repository workflow permissions branch behavior and untrusted PR execution remain PSB-CICD-004 and PSB-CICD-005.
  - Emergency response still requires organization incident authority rollback testing and an independently protected audit backend.
