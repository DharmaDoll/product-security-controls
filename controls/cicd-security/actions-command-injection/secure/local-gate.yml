name: Actions command injection gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  actions-command-injection:
    name: Reject direct expressions in run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out candidate workflows as data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reject direct expression interpolation
        shell: bash
        run: >-
          python3 .security/actions-command-injection/verify.py
          .github/workflows
