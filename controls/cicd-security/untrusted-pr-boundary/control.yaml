limitations:
  - Repository files cannot prove current fork approval token branch Environment or runner-group settings and cannot prove which permissions an actual run received.
  - The presence of a token secret OIDC Environment cache artifact or self-hosted label alone does not establish compromise and each finding requires a traced path from attacker-controlled execution to usable authority or a privileged consumer.
  - The copyable reference conservatively excludes pull_request_target workflow_run shared pull-request caches and privileged reusable-workflow paths even when a separately designed metadata-only or data-only use could be safe.
  - GitHub-hosted execution does not prevent malicious tests from contacting public endpoints but the pull-request job must contain no privileged credential or internal network authority worth exfiltrating.
  - Workflow static analysis is delegated to PSB-CICD-003 and may not model every dynamic expression third-party action dependency or provider-specific behavior.
  - Exact token purpose remains PSB-CICD-004 runner lifecycle remains PSB-CICD-007 cache provenance remains PSB-CICD-009 and build sandboxing remains PSB-BUILD-001.
  - Strong isolation can reduce pre-merge coverage increase CI cost delay external contributors and require mocks mirrors merge queues or post-merge rollback capability.
  - GitHub protections and event behavior can change and GitHub Enterprise Server can differ so adopters must recheck official documentation and live behavior for their deployed version.
status: prototype
owner: product-security
evidence_level: E1
