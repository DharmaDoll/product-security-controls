id: PSB-CICD-005
title: Isolate fork and untrusted pull-request workflows from privileged CI
domain: cicd-security
summary: PR作成者が変更できるcodeや実行可能stateとprivileged authorityを分離し、権限処理へ移る前にreview可能なtrust boundaryを再確立する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: CICD-UNTRUSTED-PR-PRIVILEGE
    description: A contributor-controlled command test or dependency executes in a job where token scope referenced secrets OIDC approved Environment runner state or network reachability is actually available and usable.
  - id: CICD-UNTRUSTED-RUN-ELEVATION
    description: A privileged event or later run checks out attacker content or consumes an attacker-controlled cache artifact output or dependency as executable or otherwise unsafe input.
implementations:
  insecure:
    - insecure/workflow.yml
  secure:
    - secure/pr-validation.yml
    - secure/trusted-after-merge.yml
verification:
  type: manual
  commands:
    - make verify-control CONTROL=PSB-CICD-005
    - follow the live verification table in controls/cicd-security/untrusted-pr-boundary/README.md
  expected:
    - the canonical command reports NOT_CHECKED instead of claiming that repository files prove live adoption
    - every pull-request-related workflow identifies which code and executable state the pull-request author controls
    - the live untrusted run has no write token secret OIDC protected Environment persistent runner asset or internal network authority
    - privileged processing does not execute untrusted code or inherit unverified executable state from the pull-request run
    - the reference profile begins privileged processing in a separate run for the reviewed protected-branch revision
    - missing workflow inventory provider settings or run evidence remains NOT_CHECKED or ERROR rather than PASS
checks:
  - id: PRB-001
    title: Pull-request-controlled execution remains explicitly unprivileged
    required_state: any job executing pull-request-controlled code or executable state has no secret write authority OIDC or protected Environment access
    responsible_role: repository-admin
    applies_to:
      - github-actions-pr-job
      - github-token
      - github-environment
    context:
      threat_actor: fork contributor or compromised contributor account controlling pull-request code workflow changes tests or dependencies
      attack_or_failure_scenario: attacker-controlled execution uses a write token or a delivered secret or requests OIDC accepted by the cloud trust policy or runs after Environment protection passes
      why_required: removing effective privileged authority from the untrusted job prevents contribution access from becoming repository cloud or deployment authority even when arbitrary test commands run
    verification:
      type: external-evidence
      method: inventory jobs that execute pull-request-controlled state and inspect effective permissions secret Environment and OIDC availability in a harmless live run
      expected: every untrusted execution context is read-only and cannot access secrets OIDC protected Environments or write APIs
      evidence:
        - sanitized GitHub Actions run URL with repository commit event and effective permission details
        - current Actions token and fork-workflow settings with target and capture time
    mapping_status: reviewed
  - id: PRB-002
    title: Untrusted code runs without persistent runner or internal network authority
    required_state: the actual untrusted job uses the reference GitHub-hosted profile or a separately verified ephemeral isolated runner with no privileged local asset or internal route
    responsible_role: ci-platform
    applies_to:
      - github-actions-runner
      - github-actions-pr-job
    context:
      threat_actor: fork contributor executing persistence discovery credential theft or network-probing code on a reusable organization-controlled runner
      attack_or_failure_scenario: untrusted pull-request code runs on a reused or privileged self-hosted runner that exposes later jobs local credentials daemon authority or internal network services
      why_required: token restrictions do not remove credential files network position persistence or daemon authority when those assets are actually present on an organization-controlled runner
    verification:
      type: external-evidence
      method: inspect live job runner identity lifecycle network reachability and organization runner-group access for the target repository
      expected: the reference uses the approved GitHub-hosted profile and any alternative runner has separately verified one-job isolation and no privileged reachability
      evidence:
        - sanitized job metadata identifying the hosted or separately approved isolated runner profile
        - current runner lifecycle network and runner-group access record with target and capture time
    mapping_status: reviewed
  - id: PRB-003
    title: Checkout and code loading preserve the declared trust boundary
    required_state: every checkout and indirect code-loading path matches the job trust classification retains no credential and never loads untrusted executable state into a privileged context
    responsible_role: repository-admin
    applies_to:
      - actions-checkout-step
      - pull-request-revision
    context:
      threat_actor: pull-request author supplying a malicious head SHA branch repository checkout input or indirect code-loading path
      attack_or_failure_scenario: a privileged workflow executes attacker-selected content or any untrusted workflow leaves a usable repository token in Git configuration
      why_required: event separation is ineffective when code loading crosses the declared trust boundary or leaves a credential available to attacker-controlled commands
    verification:
      type: manual
      method: review every pull-request checkout and indirect code-loading step then compare the actual revision authority and credential state with the declared job trust
      expected: the reference uses a SHA-pinned checkout with persist-credentials false and no privileged context loads pull-request-controlled executable state
      evidence:
        - reviewed workflow revision and reviewer record
        - sanitized live run event and checked-out revision details
    mapping_status: reviewed
  - id: PRB-004
    title: Automatic cross-run and privileged-event elevation paths are blocked
    required_state: no privileged event cache artifact output dependency or reusable-workflow path automatically executes or trusts untrusted pull-request state
    responsible_role: repository-admin
    applies_to:
      - github-actions-trigger
      - github-actions-cache
      - github-actions-artifact
      - reusable-workflow-caller
    context:
      threat_actor: fork contributor poisoning a cache artifact workflow output dependency or reusable-workflow input consumed by a privileged context
      attack_or_failure_scenario: pull_request_target workflow_run issue_comment or another privileged path receives authority and executes data or code produced by an untrusted run
      why_required: separating jobs is insufficient when attacker-controlled state is promoted across an event trigger storage namespace dependency or called-workflow boundary
    verification:
      type: manual
      method: inventory all pull-request-related workflows and trace privileged events caches artifacts outputs dependencies and reusable-workflow calls across run boundaries
      expected: no path automatically promotes untrusted executable state and every data-only exception has a separately reviewed trust design
      evidence:
        - dated workflow inventory and trust-boundary review
        - review record for each cross-run data path or an explicit record that none exist
    mapping_status: reviewed
  - id: PRB-005
    title: Privileged work starts only after a new trust decision
    required_state: privileged processing begins in a context that does not execute pull-request-controlled code or inherit unverified executable state from the original pull-request run
    responsible_role: repository-admin
    applies_to:
      - privileged-ci-job
      - trusted-branch-run
      - protected-branch-ruleset
    context:
      threat_actor: pull-request author manipulating actor label author association approval state job output artifact or other attacker-influenced elevation input
      attack_or_failure_scenario: the original pull-request run gains authority or a later privileged workflow treats attacker-controlled code artifact cache output actor or label as trusted
      why_required: a distinct trust decision prevents privileged processing from depending on attacker-controlled execution state while the reference uses a new post-merge run as the simplest boundary
    verification:
      type: external-evidence
      method: trace the trust decision and every input to privileged processing then for the reference compare the ruleset merge revision trusted-run event SHA and run identity
      expected: privileged processing loads no unverified executable state and the reference starts a new protected-branch push run without a dependency on the pull-request run
      evidence:
        - current protected-branch ruleset with target and capture time
        - sanitized pull-request merge and separate trusted-run records linked by reviewed commit SHA
    mapping_status: reviewed
  - id: PRB-006
    title: Incomplete trust-boundary verification is never reported as clean
    required_state: missing workflow inventory inaccessible provider settings ambiguous data flow and failed live checks remain NOT_CHECKED or ERROR
    responsible_role: security
    applies_to:
      - workflow-inventory
      - provider-setting-review
      - live-run-evidence
    context:
      threat_actor: incomplete workflow inventory permission denial provider API failure stale evidence or reviewer misunderstanding of event and run boundaries
      attack_or_failure_scenario: one or more execution or authority paths cannot be evaluated but the repository is nevertheless reported as fork-safe
      why_required: distinct NOT_CHECKED and ERROR states prevent missing provider facts and partial review coverage from becoming false assurance
    verification:
      type: manual
      method: confirm that the review covers every pull-request-related workflow and records unavailable settings failed checks and stale evidence explicitly
      expected: only complete current live observations can support PASS while missing or failed observations are NOT_CHECKED or ERROR
      evidence:
        - dated workflow inventory with reviewer and target repository
        - manual verification record containing PASS FAIL NOT_CHECKED or ERROR for every check
    mapping_status: unmapped
