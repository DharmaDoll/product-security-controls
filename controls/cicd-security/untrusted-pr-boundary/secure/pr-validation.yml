name: Fork-safe pull-request validation

# Copying this file creates a pull-request job that executes PR-controlled code.
# Keep the job credential-free; replace only the runner label and test command.
on:
  pull_request:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the pull-request merge revision without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Run validation without privileged credentials
        # This command can be changed by the PR author through repository files.
        # It must not need secrets, a write token, or access to an internal network.
        run: make test
