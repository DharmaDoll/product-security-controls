name: Fork-safe validation and trusted reporting

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the pull-request merge revision or trusted push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Run validation without privileged credentials
        run: make test

  report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Publish trusted-branch result
        run: echo "trusted push result"
