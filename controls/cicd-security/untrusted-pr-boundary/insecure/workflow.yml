# INSECURE FIXTURE: DO NOT COPY, ENABLE, OR DEPLOY.
name: Privileged untrusted pull request

on:
  pull_request_target:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions: {}

jobs:
  pwn:
    runs-on: [self-hosted, linux]
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Checkout attacker-controlled head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Restore attacker-controlled cache
        uses: actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092
        with:
          path: .cache
          key: pr-${{ github.event.pull_request.head.sha }}
      - run: ./scripts/from-pull-request.sh

  reuse:
    uses: ./.github/workflows/privileged.yml
    permissions:
      contents: write
    secrets: inherit

  elevate:
    if: github.actor == 'trusted-maintainer'
    needs: pwn
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: ./scripts/from-pull-request.sh
