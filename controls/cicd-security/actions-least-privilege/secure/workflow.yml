name: Least-privilege workflow

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: make test

  report:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - run: printf '%s\n' 'synthetic report'

  release:
    if: github.ref == 'refs/tags/v1.0.0'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - run: printf '%s\n' 'synthetic release'

  deploy:
    if: github.ref == 'refs/tags/v1.0.0'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - run: printf '%s\n' 'synthetic deploy'

  reusable-check:
    permissions:
      contents: read
    uses: example-org/ci/.github/workflows/check.yml@0123456789abcdef0123456789abcdef01234567
