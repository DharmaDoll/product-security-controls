      - PERM-003
      - PERM-004
      - PERM-005
limitations:
  - A reviewer can approve an unnecessary permission because job intent cannot be derived mechanically from YAML alone.
  - Static analysis detects obvious excessive permissions but does not prove semantic minimum privilege or live GitHub settings.
  - GITHUB_TOKEN restrictions do not reduce separately supplied PAT GitHub App cloud or other credentials.
  - GitHub Environment features and required reviewer availability depend on repository visibility and provider plan.
  - Actions and shell steps in one job share that job token so different trust boundaries require separate jobs.
  - Fork safety remains PSB-CICD-005 and cloud OIDC claim trust remains PSB-CICD-006.
status: reference
owner: product-security
evidence_level: E1
