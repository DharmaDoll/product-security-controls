    id: GHAS-CONCEPT-GITHUB-TOKEN
    relationship: addresses
    confidence: high
    rationale: The secure configuration and review procedure directly establish explicit job-visible GITHUB_TOKEN boundaries while keeping live adoption separate.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - PERM-001
      - PERM-002
      - PERM-003
      - PERM-004
      - PERM-005
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-REF-SECURE-USE
    relationship: supports
    confidence: high
    rationale: Workflow deny-all purpose-bound job grants and live setting review implement GitHub least-privilege guidance without treating fixture configuration as adoption evidence.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - PERM-001
