  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-AC-04.01
    relationship: supports
    confidence: high
    rationale: Explicit workflow deny-all and mandatory job opt-in avoid a task silently receiving a more permissive pipeline or repository default.
    reviewer: product-security
