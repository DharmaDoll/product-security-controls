name: Over-privileged workflow

on:
  pull_request:
  push:

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: make test

  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - run: printf '%s\n' 'synthetic report'

  release:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: printf '%s\n' 'synthetic release'

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - run: printf '%s\n' 'synthetic deploy'

  reusable-check:
    permissions:
      contents: write
    uses: example-org/ci/.github/workflows/check.yml@0123456789abcdef0123456789abcdef01234567
