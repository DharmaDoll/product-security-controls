name: Over-privileged workflow

on:
  pull_request:
  push:

# No workflow-level deny-all: jobs inherit the provider default.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: make test

  publish:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: printf '%s\n' 'inert fixture; do not deploy'
