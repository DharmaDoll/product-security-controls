id: PSB-CICD-007
title: CI runnerをjobごとに隔離し使用後に破棄する
domain: cicd-security
summary: GitHub-hostedまたはmanaged ephemeral runnerを既定とし、必要なself-hosted runnerを限定groupのJIT one-job fresh computeとして隔離・破棄する。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: CICD-RUNNER-PERSISTENCE
    description: Malicious job or implanted runner image leaves processes workspace state or tooling that affects a later job.
  - id: CICD-RUNNER-HOST-CREDENTIAL-ACCESS
    description: Job code reaches host credentials cloud metadata runtime sockets or management services outside the intended CI boundary.
  - id: CICD-RUNNER-MANAGEMENT-COMPROMISE
    description: Reusable registration authority broad runner groups or interactive ingress lets an attacker register control or persist on a runner.
implementations:
  insecure:
    - insecure/README.md
    - insecure/persistent-self-hosted.yml
  secure:
    - secure/github-hosted.yml
    - secure/takumi-runner.yml
    - secure/self-hosted-jit.yml
    - docs/ADOPTION.md
verification:
  type: external-evidence
  procedure: docs/ADOPTION.md#live-verification
  expected:
    - every job routes to an approved exact runner profile and self-hosted scope excludes untrusted repositories and workflows
    - two consecutive jobs use clean separate runner generations and a forced inert marker produces the documented negative result
    - managed or self-hosted ephemeral jobs use one fresh compute instance per job without returning it to a reusable pool
    - self-hosted runners cannot reach host credentials metadata management networks internal services or host runtime sockets
    - actual provider events show deregistration compute and storage destruction while correlated logs remain externally available
    - unavailable incomplete stale or failed live verification is ERROR or NOT_CHECKED and never PASS
checks:
  - id: RNR-001
    title: Trust class routes to an exact runner profile
    required_state: untrusted jobs use reviewed hosted runners and self-hosted profiles use exact trusted repository and workflow scope
    responsible_role: ci-platform
    applies_to:
      - ci-job-dispatch
      - runner-group
      - workflow-identity
    context:
      threat_actor: malicious fork contributor or compromised workflow selecting an organization-controlled runner
      attack_or_failure_scenario: untrusted code runs on a self-hosted runner or a wildcard group repository workflow or event bypasses the reviewed runner boundary
      why_required: exact routing keeps attacker-controlled jobs away from organization assets and prevents an overly broad runner group from silently expanding trust
    verification:
      type: external-evidence
      method: compare the current workflow revision and live dispatch with provider runner-group repository and workflow settings
      expected: every dispatch matches one approved profile and no untrusted job uses organization-controlled self-hosted infrastructure
      evidence:
        - workflow revision and run link
        - current runner-group access export or read-only view
        - current selected repository and workflow scope
    mapping_status: reviewed
  - id: RNR-002
    title: Ephemeral runner accepts exactly one job on fresh compute
    required_state: each managed or self-hosted ephemeral job uses one JIT runner and one fresh compute generation that is never returned to a reusable pool
    responsible_role: ci-platform
    applies_to:
      - ephemeral-runner
      - runner-provisioner
      - underlying-compute
    context:
      threat_actor: malicious job persisting code state or processes for a later trusted job
      attack_or_failure_scenario: a registered runner or its underlying machine is reused and attacker changes survive into a second job
      why_required: one-job fresh-compute lifecycle removes the cross-job persistence channel that token minimization cannot address
    verification:
      type: external-evidence
      method: correlate two actual dispatches with distinct runner generations provider provision events and destruction events
      expected: each job has a separate clean compute generation and no completed generation returns to a runner pool
      evidence:
        - two GitHub job and runner identities
        - provider provision events
        - exact-generation destruction events
    mapping_status: reviewed
  - id: RNR-003
    title: Runner starts from a reviewed current image
    required_state: managed provider image contract or exact self-hosted image digest with verified provenance supported runner version and replacement updates
    responsible_role: ci-platform
    applies_to:
      - runner-image
      - runner-binary
    context:
      threat_actor: supply-chain attacker or operator introducing a modified stale or mutable runner image
      attack_or_failure_scenario: an implanted image or in-place update executes before job controls and persists outside review
      why_required: reviewed image identity and replacement make runner contents accountable and prevent a mutable host from becoming the hidden deployment artifact
    verification:
      type: external-evidence
      method: review the current managed image contract or verify the self-hosted image digest provenance and runner support decision
      expected: managed images follow the approved current contract and self-hosted images are immutable verified supported and replaced for updates
      evidence:
        - provider image documentation or release identity
        - self-hosted image digest when applicable
        - provenance verification and runner version decision when applicable
    mapping_status: reviewed
  - id: RNR-004
    title: Runner starts without prior-job or host credential state
    required_state: clean workspace no previous job foreign process host credential cloud credential or SSH key
    responsible_role: ci-platform
    applies_to:
      - runner-startup-state
      - runner-workspace
      - host-credential-store
    context:
      threat_actor: prior malicious job compromised image or accidental credential provisioning
      attack_or_failure_scenario: current job reads residual files processes or host identities that were not intentionally granted to it
      why_required: startup observation proves isolation exists at job assignment time instead of relying only on an intended image configuration
    verification:
      type: external-evidence
      method: run the harmless marker workflow twice and inspect the actual startup observation for the same runner generation
      expected: both positive runs are clean and no prior job marker foreign process or host credential is present
      evidence:
        - two workflow run links and sanitized marker results
        - sanitized startup observation for self-hosted profiles
    mapping_status: reviewed
  - id: RNR-005
    title: Runner cannot reach host or management identities
    required_state: default-deny boundary blocks metadata IPv4 and IPv6 management networks internal networks and host runtime sockets
    responsible_role: security
    applies_to:
      - runner-network
      - cloud-metadata-endpoint
      - management-network
      - host-runtime-socket
    context:
      threat_actor: malicious dependency workflow or test executing inside a runner job
      attack_or_failure_scenario: job code obtains cloud identity from metadata escapes through a host socket or laterally moves to a management service
      why_required: host-level denial prevents job compromise from inheriting infrastructure authority even when application-level egress controls are incomplete
    verification:
      type: external-evidence
      method: execute adopter-defined response-suppressing probes from the live runner namespace and review the effective boundary
      expected: all approved metadata management internal network and host socket probes are denied without collecting response bodies
      evidence:
        - sanitized live deny results
        - effective runner network and host policy revision
    mapping_status: reviewed
  - id: RNR-006
    title: Runner registration and management authority is bounded
    required_state: no ordinary interactive ingress with separate break-glass and one-use unretained JIT registration authority
    responsible_role: ci-platform
    applies_to:
      - runner-registration
      - runner-management-plane
      - break-glass-access
    context:
      threat_actor: external attacker compromised operator account or leaked runner registration authority
      attack_or_failure_scenario: attacker registers an unauthorized runner or uses SSH or another remote service to persist on an active runner
      why_required: one-use registration and isolated break-glass access reduce the window and paths for unauthorized fleet membership or management takeover
    verification:
      type: external-evidence
      method: inspect current JIT provision metadata runner group management ingress and break-glass approval path without retaining the encoded configuration
      expected: no reusable registration authority or ordinary interactive ingress exists and break-glass authority is separately approved and audited
      evidence:
        - sanitized JIT provision metadata
        - management network setting
        - break-glass approval path
    mapping_status: reviewed
  - id: RNR-007
    title: Self-hosted runner is deregistered and destroyed after the job
    required_state: exact-generation provider events prove deregistration compute destruction workspace disposal storage destruction and process termination within the adopted time limit
    responsible_role: ci-platform
    applies_to:
      - runner-teardown
      - ephemeral-compute
      - ephemeral-storage
    context:
      threat_actor: malicious job attempting persistence or a provisioner teardown failure
      attack_or_failure_scenario: job finishes but the runner remains registered reachable or retains recoverable workspace and process state
      why_required: verified teardown closes persistence after execution and makes one-job lifecycle an observed property rather than a configuration claim
    verification:
      type: external-evidence
      method: correlate actual job completion GitHub deregistration and provider compute and storage deletion by exact runner generation
      expected: the exact generation is removed from GitHub and destroyed by the compute provider within the adopted limit
      evidence:
        - GitHub deregistration event or read-only absence
        - compute and storage destruction events
        - job to runner generation correlation
    mapping_status: reviewed
  - id: RNR-008
    title: Runner security logs survive teardown with exact correlation
    required_state: investigation logs exported outside the runner before destruction and correlated by job ID and runner generation
    responsible_role: security
    applies_to:
      - runner-security-log
      - log-exporter
      - incident-evidence
    context:
      threat_actor: malicious job hiding activity or a teardown sequence deleting the only local evidence
      attack_or_failure_scenario: ephemeral runner is destroyed before process network registration and teardown evidence reaches an external system
      why_required: external correlated logs retain detection and investigation evidence without weakening the ephemeral lifecycle
    verification:
      type: external-evidence
      method: query the actual external backend for the completed job and runner generation after teardown
      expected: required diagnostic or trace records remain externally available with exact job and runner correlation
      evidence:
        - external log query result
        - log retention and access setting
    mapping_status: reviewed
  - id: RNR-009
    title: Live runner verification fails closed
    required_state: current complete live evidence with distinct PASS FAIL NOT_CHECKED and ERROR outcomes and no credential-bearing evidence committed to the repository
    responsible_role: ci-platform
    applies_to:
      - runner-live-verification
      - provider-and-log-sources
    context:
      threat_actor: collector outage partial pagination stale provider state malformed response or credential accidentally copied into an evidence record
      attack_or_failure_scenario: runner state cannot be evaluated safely but an unavailable or incomplete check is reported as satisfying the control or leaks authority
      why_required: explicit ERROR and NOT_CHECKED states prevent missing evidence from becoming false assurance while keeping sensitive provider data out of the repository
    verification:
      type: external-evidence
      method: exercise the adopted read-only verification failure path and review the recorded state when a required source is unavailable or incomplete
      expected: unavailable incomplete stale or permission-denied verification is ERROR or NOT_CHECKED never PASS and unsafe generations are not reused
      evidence:
        - actual error or not-checked result
        - assignment-stop or recovery record when applicable
    mapping_status: unmapped
mappings:
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-CONCEPT-COMPROMISED-RUNNERS
    relationship: mitigates
    confidence: high
    rationale: Hosted-first routing and observed one-job fresh-compute lifecycle reduce persistent runner compromise while self-hosted teardown still requires organization evidence.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - RNR-001
      - RNR-002
      - RNR-004
      - RNR-005
      - RNR-007
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-REF-SECURE-USE
    relationship: verifies
    confidence: high
    rationale: Restricted runner groups JIT execution fresh compute and external log review operationalize GitHub secure-use guidance without treating documentation as live adoption evidence.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - RNR-001
      - RNR-002
      - RNR-006
      - RNR-008
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PW.6.1
    relationship: supports
    confidence: medium
    rationale: A reviewed isolated and observable runner environment supports secure build-tool execution but does not assess all build practices or provider control-plane assurance.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - RNR-002
      - RNR-003
      - RNR-004
      - RNR-005
      - RNR-007
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-BR-01.03
    relationship: supports
    confidence: medium
    rationale: Hosted-first routing and one-job fresh-compute destruction support separation of untrusted code from privileged CI assets while PSB-CICD-005 owns the trust decision.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - RNR-001
      - RNR-002
      - RNR-004
      - RNR-005
      - RNR-007
  - framework: mitre-attack
    version: "v19.1"
    id: T1552.005
    relationship: mitigates
    confidence: high
    rationale: Default-deny runner boundaries and live metadata probes mitigate job access to cloud instance metadata credentials without claiming complete cloud IAM coverage.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - RNR-005
  - framework: mitre-attack
    version: "v19.1"
    id: T1133
    relationship: mitigates
    confidence: medium
    rationale: Denying ordinary interactive runner ingress and separating break-glass management reduces remote-service access paths without claiming complete service-control-plane coverage.
    reviewer: product-security
    review_date: "2026-09-02"
    applies_to:
      - RNR-006
limitations:
  - Workflow examples and marker self-tests do not attest live organization adoption provider tenant isolation or physical storage erasure.
  - GitHub-hosted and managed runner VM lifecycle remain provider-owned assurance boundaries that require contract and current documentation review.
  - Organization-owned JIT runners require provider-specific provision network log and destruction implementation that this provider-neutral package does not automate.
  - Job-internal credentials privilege application egress sandbox and runtime threat detection remain PSB-BUILD-001.
  - Workflow trust classification and untrusted pull-request event semantics remain PSB-CICD-005.
  - CI service control-plane compromise shared cache and artifact poisoning and provider availability are not verified.
  - External logs and managed trace data still require masking access control retention and vendor data-processing review.
status: reference
owner: product-security
evidence_level: E1
