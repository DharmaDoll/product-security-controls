id: PSB-CICD-001
title: Pin external GitHub Actions and reusable workflows to immutable commits
domain: cicd-security
summary: レビュー済みのワークフロー依存関係が、可変のGit参照によって気付かないうちに変更されることを防ぐ。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: SUPPLY-CHAIN-MUTABLE-ACTION
    description: A mutable Action or reusable workflow reference is moved or compromised and executes code that was not reviewed.
  - id: SUPPLY-CHAIN-VULNERABLE-ACTION
    description: A full-SHA-pinned Action release remains immutable but is affected by a subsequently published reviewed security advisory.
implementations:
  insecure:
    - insecure/workflow.yml
    - insecure/action-inventory.json
    - insecure/advisories.json
  secure:
    - secure/workflow.yml
    - secure/local-action/action.yml
    - secure/action-inventory.json
    - secure/advisories.json
verification:
  commands:
    - make verify-control CONTROL=PSB-CICD-001
  expected:
    - external GitHub Actions and reusable workflows use full 40-character commit SHAs
    - Docker-based actions use immutable sha256 image digests
    - mutable tags branches short SHAs and dynamic references are rejected
    - reviewed Action advisories are matched against the exact release inventory and vulnerable releases are rejected
    - stale incomplete malformed or unavailable advisory snapshots fail closed
    - policy violations and verifier execution errors have distinct exit codes
checks:
  - id: ACT-001
    title: External GitHub Actions use full commit SHAs
    required_state: full 40-character commit SHA
    responsible_role: repository-admin
    applies_to:
      - ci-workflow
    context:
      threat_actor: compromised Action maintainer or attacker moving a mutable upstream ref
      attack_or_failure_scenario: a reviewed workflow later executes different third-party Action code without repository change
      why_required: a full commit SHA makes dependency updates explicit and reviewable in the consuming repository
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-CICD-001
      expected: external Action references without a full SHA are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: ACT-002
    title: External reusable workflows use full commit SHAs
    required_state: full 40-character commit SHA
    responsible_role: repository-admin
    applies_to:
      - ci-workflow
    context:
      threat_actor: compromised reusable-workflow provider changing a branch or tag
      attack_or_failure_scenario: caller jobs inherit altered commands permissions or secret handling from an external workflow
      why_required: reusable workflows execute substantial remote policy and therefore need the same immutable binding as Actions
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-CICD-001
      expected: external reusable workflow references without a full SHA are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: ACT-003
    title: Docker-based Actions use immutable image digests
    required_state: sha256 image digest
    responsible_role: repository-admin
    applies_to:
      - ci-workflow
    context:
      threat_actor: container publisher or registry attacker replacing a mutable Action image tag
      attack_or_failure_scenario: Docker-based Action pulls different bytes while its tag and workflow text remain unchanged
      why_required: an image digest binds execution to exact container content instead of a mutable registry label
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-CICD-001
      expected: Docker image tags and unpinned images are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: ACT-004
    title: Mutable and dynamic workflow references are rejected
    required_state: no tag branch short SHA or dynamic external reference
    responsible_role: repository-admin
    applies_to:
      - ci-workflow
    context:
      threat_actor: contributor introducing a tag branch short SHA or computed external reference
      attack_or_failure_scenario: workflow review cannot determine the exact third-party code that will execute
      why_required: rejecting every mutable and dynamic form closes bypasses left by checking only common Action syntax
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-CICD-001
      expected: all mutable reference fixtures fail validation
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: ACT-005
    title: Reference verification failures are distinct from policy findings
    required_state: verifier errors and policy violations use different exit states
    responsible_role: repository-admin
    applies_to:
      - ci-verifier
    context:
      threat_actor: malformed workflow unsupported syntax or failed reference parser
      attack_or_failure_scenario: the verifier cannot inspect a dependency reference but reports no mutable references
      why_required: parser and execution errors must remain distinct so incomplete inspection never appears compliant
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-CICD-001
      expected: execution errors cannot be interpreted as clean results
      evidence:
        - negative-test output
    mapping_status: unmapped
  - id: ACT-006
    title: Pinned Action releases are checked for reviewed vulnerabilities
    required_state: exact Action name release version and commit SHA checked against a fresh complete GitHub-reviewed Actions advisory snapshot
    responsible_role: repository-admin
    applies_to:
      - github-action-dependency
      - github-advisory-database
    context:
      threat_actor: vulnerable Action implementation or attacker exploiting a publicly disclosed flaw in an immutable pinned release
      attack_or_failure_scenario: workflow continues executing a known-vulnerable Action because full-SHA pinning is mistaken for a security update mechanism
      why_required: immutability prevents silent replacement but cannot make already pinned code non-vulnerable or notify maintainers that a fixed release is required
    verification:
      type: automated
      method: collect a current reviewed Actions advisory snapshot then run make verify-github-action-advisories with the reviewed release inventory
      expected: affected Action versions are rejected while stale incomplete malformed and unavailable advisory evidence returns an error
      evidence:
        - sanitized advisory verifier output
        - reviewed Action release inventory
        - timestamped complete advisory snapshot
    mapping_status: reviewed
mappings:
  - framework: github-security-guidance
    version: "github/docs@b17436de8f10c3e7f6a185d6813bf94bc82d22f8 (2026-07-24)"
    id: GHAS-REF-SECURE-USE
    relationship: supports
    confidence: high
    rationale: The control directly implements GitHub's recommendation to pin third-party Actions to full-length commit SHAs while retaining separate review and update requirements.
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - ACT-001
      - ACT-002
      - ACT-004
  - framework: mitre-attack
    version: "v19.1"
    id: T1195.001
    relationship: mitigates
    confidence: medium
    rationale: Immutable references reduce the opportunity to replace a reviewed workflow dependency or development tool through a moved Git reference.
    reviewer: product-security
    review_date: "2026-07-25"
    applies_to:
      - ACT-001
      - ACT-002
      - ACT-003
      - ACT-004
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PW.4.1
    relationship: supports
    confidence: medium
    rationale: Pinning reviewed third-party workflow components and checking the bound release version against fresh reviewed advisories supports controlled acquisition and maintenance but does not establish that the component is secure.
    reviewer: product-security
    review_date: "2026-07-30"
    applies_to:
      - ACT-001
      - ACT-002
      - ACT-003
      - ACT-004
      - ACT-006
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-VM-05.03
    relationship: supports
    confidence: medium
    rationale: The Action-specific inventory and reviewed advisory gate automatically blocks known-vulnerable CI dependencies, while the requirement's broader malicious-dependency and exception scope remains outside this control.
    reviewer: product-security
    review_date: "2026-07-30"
    applies_to:
      - ACT-006
limitations:
  - A pinned commit can already contain malicious or undisclosed vulnerable code and must still be reviewed.
  - The verifier checks immutable reference syntax but does not prove that a SHA belongs to the named upstream repository.
  - The advisory verifier relies on a human-reviewed Action release version to commit SHA binding because advisory ranges are version-based rather than commit-based.
  - GitHub Advisory Database coverage publication timing and version ranges may be incomplete and do not replace upstream release review.
  - Nested dependencies inside an Action or reusable workflow are outside this local verifier's scope.
  - Pinning prevents automatic security updates so controlled update automation and review remain necessary.
  - Repository organization or enterprise enforcement must be configured separately and may apply different rules to reusable workflows.
status: prototype
owner: product-security
evidence_level: E3
