name: Secure immutable references

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run a repository-owned action
        uses: ./controls/cicd-security/action-sha-pinning/secure/local-action
      - name: Run a digest-pinned container action
        uses: docker://alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1

  reusable:
    permissions:
      contents: read
    uses: example-org/ci/.github/workflows/reviewed.yml@0123456789abcdef0123456789abcdef01234567 # v1.0.0
