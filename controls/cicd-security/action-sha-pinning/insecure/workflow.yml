name: Insecure mutable references

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a309ff8
      - uses: example-org/security-action@main
      - uses: example-org/dynamic-action@${{ inputs.action_ref }}
      - uses: docker://alpine:latest
      - "uses": example-org/quoted-action@v2

  reusable:
    uses: example-org/ci/.github/workflows/reviewed.yml@v1
