id: PSB-REL-001
title: release署名とProvenanceを期待値に照合する
domain: release-integrity
summary: Artifact署名とSLSA provenanceをconsumer-owned signer、builder、source、build expectationへ照合する。
check_context_version: "1.0"
security_functions:
  - prevent
  - verify
threats:
  - id: RELEASE-FORGED-PROVENANCE
    description: 攻撃者がartifactまたはprovenanceを差し替え、誤ったbuilderやsourceから生成されたreleaseを正規品として配布する。
  - id: RELEASE-TRUST-DOWNGRADE
    description: 過去に署名・provenanceが存在したartifact familyで信頼signalが欠落または低下する。
implementations:
  insecure:
    - insecure/artifact/release.bin
    - insecure/provenance.json
    - insecure/signature.b64
    - insecure/verification-policy.json
  secure:
    - secure/artifact/release.bin
    - secure/provenance.json
    - secure/signature.b64
    - secure/trusted-public-key.pem
    - secure/verification-policy.json
verification:
  commands:
    - make verify-control CONTROL=PSB-REL-001
  expected:
    - artifact digestとprovenance subjectが一致する
    - provenance署名がtrusted public keyで検証される
    - signer-builder pair、build type、source repository、full commit、refが期待値に一致する
    - trust signalの欠落または低下が拒否される
    - crypto toolまたはparser失敗がcleanな結果と区別される
checks:
  - id: REL-001
    title: Artifact digest matches the provenance subject
    required_state: exact cryptographic digest correspondence
    responsible_role: release-manager
    applies_to:
      - release-artifact
      - provenance
    context:
      threat_actor: attacker substituting an artifact while reusing unrelated valid provenance
      attack_or_failure_scenario: downloaded bytes differ from the subject digest authenticated by provenance
      why_required: signature validity alone does not bind evidence to the exact artifact being consumed
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-REL-001
      expected: substituted artifacts and mismatched subjects are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: REL-002
    title: Provenance signature verifies with the trusted public key
    required_state: valid signature from a consumer-approved signer
    responsible_role: release-manager
    applies_to:
      - release-artifact
      - provenance
    context:
      threat_actor: external forger or unauthorized signer creating plausible provenance
      attack_or_failure_scenario: provenance content is modified or signed by an identity the consumer did not approve
      why_required: consumer-owned trust roots authenticate provenance origin and integrity before field evaluation
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-REL-001
      expected: missing invalid and untrusted signatures are rejected
      evidence:
        - sanitized verifier output
        - trusted signer policy
    mapping_status: reviewed
  - id: REL-003
    title: Provenance matches consumer-owned build expectations
    required_state: signer builder build type source commit and ref match policy
    responsible_role: release-manager
    applies_to:
      - provenance
    context:
      threat_actor: compromised builder producer or release channel presenting authentic but unexpected output
      attack_or_failure_scenario: correctly signed provenance names an unapproved builder source revision ref or build type
      why_required: authenticity does not establish policy acceptability so consumer expectations must be checked separately
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-REL-001
      expected: provenance outside the approved build expectation is rejected
      evidence:
        - sanitized verifier output
        - verification policy
    mapping_status: reviewed
  - id: REL-004
    title: Release trust signals cannot silently downgrade
    required_state: required signature and provenance signals remain present
    responsible_role: release-manager
    applies_to:
      - release-artifact
    context:
      threat_actor: release operator or attacker removing verification signals to bypass a failing check
      attack_or_failure_scenario: a previously protected artifact family is distributed without required signature or provenance
      why_required: explicit no-downgrade rules prevent absence of evidence from silently becoming an accepted legacy path
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-REL-001
      expected: absent or weaker trust signals are rejected
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: REL-005
    title: Cryptographic verification failures are not clean results
    required_state: crypto tool and parser failures produce an error
    responsible_role: release-manager
    applies_to:
      - release-verifier
    context:
      threat_actor: malformed input unavailable cryptographic tooling or verifier infrastructure failure
      attack_or_failure_scenario: authenticity cannot be evaluated but the release is reported as trusted
      why_required: a separate error state ensures operational failure never becomes a clean verification result
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-REL-001
      expected: verifier execution failure uses a distinct non-zero result
      evidence:
        - negative-test output
    mapping_status: unmapped
mappings:
  - framework: slsa
    version: "1.2"
    id: build-l2#consumer-validates-authenticity
    relationship: verifies
    confidence: high
    rationale: Consumer-owned trusted keyでprovenance署名とartifact subject bindingを検証し、Build L2のconsumer authenticity validationを直接実装するが、hosted platformとprovenance生成要件は評価しない。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - REL-001
      - REL-002
  - framework: slsa
    version: "1.2"
    id: build-provenance
    relationship: verifies
    confidence: high
    rationale: SLSA provenance statementのsubject digest、predicate type、builder、build inputを署名とともにconsumer expectationへ照合する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - REL-001
      - REL-003
      - REL-004
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PS.2.1
    relationship: supports
    confidence: high
    rationale: Software releaseの完全性を暗号署名とprovenance expectationで検証し、改ざん検知を支援する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - REL-001
      - REL-002
      - REL-003
      - REL-004
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-BR-06.01
    relationship: verifies
    confidence: high
    rationale: Release artifactのcryptographic digestを含むsigned provenanceをconsumer expectationへ照合し、署名またはsigned manifest要件を検証する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - REL-001
      - REL-002
      - REL-004
limitations:
  - このfixtureはSLSA Build levelの正式assessmentまたはcomplianceを証明しない。
  - Keyless certificate、transparency log、revocation、timestamp検証は実環境adapterが必要である。
  - Trusted builderまたはsigning key自体の侵害は検出できない。
  - Crypto verifierの実行失敗をcleanな結果として扱ってはいけない。
status: prototype
owner: product-security
evidence_level: E3
