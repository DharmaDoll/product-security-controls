      - SBM-009
limitations:
  - Fixtures do not execute a package manager SBOM generator release API object store or live Dependency-Track instance.
  - The normalized receipt is a project contract and requires a version-specific production adapter whose OpenAPI permission and event semantics are independently reviewed.
  - Dependency-Track 4.14.3 fixture identity is not authorization to deploy it indefinitely; upgrades including version 5 require release integrity semantic diff migration and regression evidence.
  - Exact PURLs and complete declared graphs can still omit vendored statically linked dynamically downloaded or runtime plugin components.
  - Vulnerability matching depends on external data source PURL CPE alias and affected-range quality and can produce false positives or false negatives.
  - An SBOM is evidence and does not prove the release is vulnerability-free secure SLSA compliant or formally compliant with any framework.
  - This control is not a SLSA Build Level 2 requirement and does not replace provenance generation distribution authenticity or subject verification.
  - Source observations are early feedback and do not prove the content of built release bytes.
  - Deployment observations identify the deployed artifact and observed environment state but do not prove a complete inventory of every component loaded in memory.
  - Supplier-provided signed SBOM verification is not implemented by this control and requires a separate trust signature revocation product identity and quarantine boundary.
  - SPDX ingestion requires a version-pinned parser and equivalent negative tests before it can be added to the current CycloneDX 1.7 adapter.
status: prototype
owner: product-security
evidence_level: E3
