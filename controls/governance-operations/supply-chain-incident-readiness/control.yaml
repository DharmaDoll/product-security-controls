id: PSB-GOV-001
title: supply-chain incidentのbuild artifactと稼働deployment影響を即時特定する
domain: governance-operations
summary: SBOMとビルド証跡から汚染パッケージの影響をリポジトリ、ビルド、成果物、デプロイ先へ逆引きし、承認付きドライラン対応計画を生成する。
check_context_version: "1.0"
security_functions:
  - detect
  - respond
  - verify
  - govern
threats:
  - id: SUPPLY-CHAIN-INCIDENT-UNKNOWN-BLAST-RADIUS
    description: 汚染dependency発覚時に使用repository、build、artifact、credentialを特定できず、containmentと復旧が遅延する。
  - id: SUPPLY-CHAIN-RESPONSE-EVIDENCE-LOSS
    description: 証跡保全前のcache削除やcredential失効、未承認の破壊的対応により調査可能性または可用性が損なわれる。
  - id: SUPPLY-CHAIN-RUNTIME-INVENTORY-GAP
    description: SBOM対象artifactとactive deploymentのdigest関係が欠落し、稼働している影響serviceとenvironmentがincident scopeから漏れる。
implementations:
  insecure:
    - insecure/inventory/incomplete.cdx.json
    - insecure/build-records.json
    - insecure/runbook.json
    - insecure/dependency-track-policy.json
    - insecure/dependency-track-response.json
  secure:
    - secure/inventory/application-a.cdx.json
    - secure/inventory/application-b.cdx.json
    - secure/build-records.json
    - secure/runbook.json
    - secure/dependency-track-policy.json
    - secure/dependency-track-response.json
verification:
  commands:
    - make verify-control CONTROL=PSB-GOV-001
  expected:
    - package名とexact versionからrepository build artifactを逆引きできる
    - CycloneDX serialとbuild recordおよびevidence digestが対応する
    - 証跡保全を先頭にしたowner approval付きdry-run planを生成する
    - 影響検出、該当なし、検証不能が異なる終了コードになる
    - 不完全inventoryとunsafe runbookが拒否される
    - Dependency-Trackのexact CVE component portfolio結果がproject UUID version SBOM serial PURLとbuild evidenceへ相互照合される
    - Dependency-Trackの不完全pagination outage stale inventory analyzer failureがERRORになる
    - active deployment ID environment and observed artifact digest are linked to each impacted build record
checks:
  - id: INC-001
    title: Exact package versions can be traced to affected products
    required_state: repository build and artifact impact is queryable
    responsible_role: incident-response
    applies_to:
      - incident-response
      - sbom-inventory
    context:
      threat_actor: compromised dependency maintainer or attacker introducing a malicious exact package version
      attack_or_failure_scenario: responders know the package version but cannot identify affected repositories builds and artifacts
      why_required: exact reverse lookup converts a dependency alert into an actionable and bounded incident scope
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-GOV-001
      expected: an exact package version returns all linked repositories builds and artifacts
      evidence:
        - sanitized impact report
    mapping_status: reviewed
  - id: INC-002
    title: SBOM and build evidence remain integrity linked
    required_state: CycloneDX serial build record and evidence digest match
    responsible_role: build-platform
    applies_to:
      - sbom-inventory
      - build-evidence
    context:
      threat_actor: stale inventory tampering or accidental mismatch between SBOM and build records
      attack_or_failure_scenario: response decisions use an SBOM that does not correspond to the investigated build or evidence artifact
      why_required: integrity links establish that inventory findings refer to the actual product build under investigation
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-GOV-001
      expected: incomplete or mismatched inventory records are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: INC-003
    title: Response planning preserves evidence before containment
    required_state: owner-approved dry-run plan begins with evidence preservation
    responsible_role: incident-response
    applies_to:
      - incident-response
    context:
      threat_actor: rushed responder or unauthorized automation performing destructive containment
      attack_or_failure_scenario: caches credentials or artifacts are removed before evidence capture causing investigation loss or outage
      why_required: preservation-first owner-approved dry runs make response actions reviewable before changing production state
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-GOV-001
      expected: unsafe destructive or unapproved runbooks are rejected
      evidence:
        - generated dry-run response plan
    mapping_status: reviewed
  - id: INC-004
    title: Impact detected no impact and verification failure are distinct
    required_state: separate exit states for each assessment outcome
    responsible_role: incident-response
    applies_to:
      - incident-response
    context:
      threat_actor: incomplete assessment tooling or responder misinterpreting no result as no impact
      attack_or_failure_scenario: impacted no-impact and verification-failure outcomes collapse into one ambiguous status
      why_required: distinct states determine whether to contain close or repair the assessment rather than guess
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-GOV-001
      expected: verification failures can never be interpreted as no impact
      evidence:
        - negative-test output
    mapping_status: unmapped
  - id: INC-005
    title: Incomplete inventory and unsafe runbooks fail validation
    required_state: complete integrity-linked inventory and safe runbook
    responsible_role: incident-response
    applies_to:
      - incident-response
      - sbom-inventory
    context:
      threat_actor: incomplete asset inventory unsafe runbook or unreviewed response configuration
      attack_or_failure_scenario: response proceeds while products are missing from scope or destructive steps lack safeguards
      why_required: validation blocks plans that could miss affected assets or damage evidence and availability
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-GOV-001
      expected: insecure fixtures are rejected
      evidence:
        - negative-test output
    mapping_status: reviewed
  - id: INC-006
    title: Dependency-Track portfolio impact query is exact complete and evidence linked
    required_state: exact CVE and component identity across all pages with fresh healthy inventory linked by project UUID version SBOM serial and PURL
    responsible_role: incident-response
    applies_to:
      - dependency-track
      - sbom-inventory
      - incident-response
    context:
      threat_actor: compromised dependency publisher incomplete project ACL failed analyzer or responder relying on a first-page name-only search
      attack_or_failure_scenario: an exact affected release is omitted or an unrelated project is included because the portfolio query is stale partial ambiguous or disconnected from build evidence
      why_required: complete exact remote search broadens incident scope while bidirectional local evidence linkage prevents the analysis platform result from becoming an unaudited source of truth
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-GOV-001 and run a read-only organization Dependency-Track adapter
      expected: exact linked results pass while incomplete pagination outage stale data query mismatch or orphaned project evidence fails closed
      evidence:
        - sanitized Dependency-Track impact response
        - project UUID version SBOM serial and build-record linkage
    mapping_status: reviewed
  - id: INC-007
    title: Active deployments are linked to exact SBOM artifacts
    required_state: immutable deployment ID environment observation time and exact artifact digest match the build record
    responsible_role: incident-response
    applies_to:
      - deployment-inventory
      - sbom-inventory
      - incident-response
    context:
      threat_actor: stale deployment collector mutable image tag or incomplete environment inventory
      attack_or_failure_scenario: responders identify a vulnerable release artifact but cannot determine which active environments run those exact bytes
      why_required: digest-bound deployment relationships convert release impact into an actionable runtime scope without treating an image name or latest tag as identity
    verification:
      type: hybrid
      method: make verify-control CONTROL=PSB-GOV-001 and inspect the organization deployment inventory collector
      expected: mismatched mutable duplicate inactive or malformed deployment observations are rejected
      evidence:
        - sanitized deployment impact result
        - deployment inventory collector evidence
    mapping_status: reviewed
mappings:
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: RV.1.1
    relationship: supports
    confidence: high
    rationale: Releaseに含まれるcomponentをSBOM inventoryで継続的に識別し、exact artifact digestでactive deploymentへ関連付けて報告された汚染versionの稼働影響照合を支援する。
    reviewer: product-security
    review_date: "2026-07-31"
    applies_to:
      - INC-001
      - INC-002
      - INC-005
      - INC-006
      - INC-007
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: RV.2.1
    relationship: supports
    confidence: high
    rationale: 影響artifact、active deployment、build evidenceを特定し、containment、credential失効、safe rebuildのrisk response planを生成する。
    reviewer: product-security
    review_date: "2026-07-31"
    applies_to:
      - INC-001
      - INC-003
      - INC-005
      - INC-006
      - INC-007
  - framework: mitre-attack
    version: "v19.1"
    id: T1195.001
    relationship: detects
    confidence: medium
    rationale: 既知のcompromised dependency versionをSBOM inventoryへ照合して影響するsoftware dependency usageを検出する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - INC-001
      - INC-006
limitations:
  - SBOMの完全性と鮮度が不足するとfalse negativeが生じる。
  - Exact package version照合は侵害の事実を証明しない。
  - Reference runbookはdry-runのみで外部systemを変更しない。
  - Scanner inventoryまたはrecord読取失敗をcleanな結果として扱ってはいけない。
  - Dependency-Track adapterは4.14.3のnormalized fixture contractでありlive API access project ACL pagination and analyzer freshness require organization evidence.
  - Dependency-Track 5系はbreaking API distribution and notification changesを再レビューしてからadapter versionを更新する。
  - Deployment fixture proves artifact-to-deployment identity linkage but not that every process-loaded library or ephemeral workload was observed.
  - Live deployment completeness freshness cluster scope and collector health require organization evidence and unavailable collection must not become no impact.
status: prototype
owner: product-security
evidence_level: E3
