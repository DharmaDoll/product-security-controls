limitations:
  - Aggregated fixture counters do not prove provider usage events tokenizer identity invoice accuracy or live collector authenticity.
  - The exact AI-004 policy digest is not a substitute for signed live telemetry and protected collector key custody.
  - Production counters require atomic reservation to contain concurrent requests that cross a limit between observation and enforcement.
  - The safe-summary allowance may need a separately reserved termination budget and must not restore side-effect authority.
  - Circuit breaking does not roll back an already dispatched external mutation and must compose PSB-AI-006 reconciliation.
  - Budget values are illustrative fixture values not business SLO provider quota contract or universal safe thresholds.
  - Multi-agent aggregate budgets cross-session and tenant quotas kill-switch recovery and provider availability remain outside this first slice.
  - Passing resource checks does not establish model output correctness safety fairness or compliance.
status: prototype
evidence_level: E3
owner: product-security
