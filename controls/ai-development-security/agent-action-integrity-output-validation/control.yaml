limitations:
  - The authorization receipt is synthetic metadata; signature verification atomic consumption and actor separation remain implemented and tested by PSB-AI-004.
  - The fixture does not contact a live model MCP gateway source platform or backend and leaves adopted enforcement NOT_CHECKED.
  - SHA-256 binding is not an authenticated commitment when one actor can rewrite policy proposals decisions and evidence together.
  - Backend idempotency storage and authenticated outcome lookup are required to contain network ambiguity in production.
  - Strict schemas cannot determine whether a formally valid approved action is semantically harmful or based on a deceptive explanation.
  - Application authorization business invariants transactions rollback and compensating operations remain owned by domain-specific controls.
  - Tool compromise provider sandbox escape and endpoint compromise are outside this action-boundary fixture.
status: prototype
evidence_level: E3
owner: product-security
