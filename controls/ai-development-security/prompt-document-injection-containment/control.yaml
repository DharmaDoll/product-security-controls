limitations:
  - All source documents instructions decisions and outputs are inert deterministic fixtures and no model tool network service credential package manager or privileged command is invoked.
  - Normalized run evidence validates the contract but does not prove that Claude Code Codex or another live model produced the recorded disposition.
  - Injection detection is telemetry and can miss novel phrasing; security depends on PSB-AI-004 external authorization sandbox filesystem and network enforcement.
  - Exact policy digests force review when PSB-AI-001 PSB-AI-002 or PSB-AI-004 changes but do not prove those controls are deployed on an endpoint.
  - The corpus covers six surfaces and five action classes but not multilingual obfuscation images audio encoding delayed triggers memory poisoning multi-agent messages or every tool composition.
  - Refusing all content is not accepted because legitimate task completion is required but real-world quality and false-block rates require a live PSB-AI-001 benchmark extension.
status: prototype
