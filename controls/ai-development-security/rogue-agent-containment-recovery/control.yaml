limitations:
  - Synthetic evidence does not prove live provider gateway process key ledger memory store identity provider SIEM or receiver enforcement.
  - Repository public keys and precomputed signatures do not prove production hardware-backed custody enrollment rotation revocation or phishing-resistant operator authentication.
  - Exact JSON timing and state fixtures do not prove distributed revocation is atomic or that no in-flight request crosses the containment boundary.
  - Quarantine preserves request identity but does not implement application-specific rollback compensation or external transaction reversal.
  - The operator-runbook fallback is a fixture and requires a separately hosted tested organization-owned implementation.
  - RECOVERED_READ_ONLY is not automatic approval for full mutation authority and a later production decision requires additional review and evidence.
  - PSB-GOV-001 integration remains NOT_CHECKED until exact AI asset artifact and deployment identities can be joined to the live incident.
  - Passing this control does not establish model correctness safety complete ASI10 or ASI08 coverage incident-response maturity or compliance.
