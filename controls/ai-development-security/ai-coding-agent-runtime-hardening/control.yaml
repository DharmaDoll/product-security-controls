limitations:
  - Static configuration verification does not prove that a deployed Claude Code or Codex binary loaded or enforced the reviewed settings.
  - Claude Code arrays merge across settings scopes so managed-only permission and domain locks plus repository broadening review are both required; this slice does not assess every setting key.
  - Codex permission-profile enforcement in this sample requires version 0.138.0 or later and product-version drift requires renewed documentation review and negative testing.
  - Command-prefix approval is defense in depth and can miss shell indirection product parser changes or an approved malicious action; OS isolation remains required.
  - Network-off remains the ordinary profile; the destination-specific sample uses synthetic evidence and does not prove that a deployed product gateway pinned the classified address through its actual transport.
  - A compromised agent binary endpoint administrator sandbox implementation or human approving the wrong action remains outside the evidence established here.
  - The repository contains only a synthetic public key and precomputed signatures; production requires an independently protected issuer private key approval UI approver authentication key rotation revocation and managed trust-root delivery.
  - SQLite uniqueness makes local approval consumption atomic before allow but cannot form one transaction with an external MCP side effect; a crash can burn an approval and production adapters still require idempotency reconciliation and explicit retry approval.
  - The executable inventory reconciliation uses synthetic managed snapshots; production still requires a trustworthy fleet collector and PSB-AI-002 source digest review and revocation evidence.
  - Automatic bounded reversible writes still depend on correct target normalization idempotency implementation and rollback behavior; a compromised server can violate its advertised semantics.
  - Static adapter verification does not contact MCP servers or prove runtime tool annotations startup behavior authentication or revocation.
  - The managed PreToolUse files are reference deployment artifacts only; repository verification does not prove that fleet tooling installed the script policy and engine state at the configured absolute paths or that the active client loaded them.
  - Managed hooks authenticate and consume the sample approval but repository verification does not prove that production approval inbox actor identity trust manifest ledger permissions or OpenSSL binary are protected on a deployed endpoint.
  - The gate explicitly exits 2 for detected evaluation errors, but product-level command-hook startup failures and timeouts are not proven to block in this static evidence; bounded writes therefore retain native prompt fallback and production should prefer a supervised local policy service or MCP gateway when strict fail-closed behavior is required.
  - The managed audit event records the pre-execution decision rather than the external tool result; native Codex OTel or provider audit sources and server-side outcome telemetry remain separate evidence with their own coverage and retention boundaries.
  - The local audit writer requires administrator-managed rotation before its size ceiling and blocks when it cannot append; the reference state does not prove deployed ownership collector export immutability SIEM ingestion or alerting.
  - The network verifier does not perform DNS or connect to a destination; production requires managed resolver provenance TLS validation lower-layer egress enforcement and refreshed classification that cannot be changed by repository content or the agent.
  - Browser connector web-search product control-plane MCP server-side egress and approved sandbox escalation use separate network surfaces that this command-egress fixture does not govern.
  - The hook-failure boundary uses synthetic lifecycle and gateway state; it does not prove that a deployed MCP service authenticates request-bound permits or that the active Claude Code and Codex versions exhibit the modeled failure behavior.
  - Product hook timeout and failure semantics can change by version; production adoption requires version-pinned live startup timeout invalid-output and downstream side-effect tests before promptless automation.
  - Side-effect reconciliation uses synthetic gateway and backend state; it does not prove deployed idempotency durability authenticated outcome lookup mutation atomicity or that every external tool supports a stable idempotency key.
  - A backend can complete after an initial not-applied observation unless its idempotency protocol serializes lookup and mutation; production must define that race and never treat a point-in-time query alone as permission to change the key or restore approval.
  - The command broker classifies a deliberately small executable and operation vocabulary; it does not parse arbitrary shell languages inspect script contents resolve every executable path or prove that the deployed provider preserves argv boundaries.
  - Denying opaque scripts and task runners can increase workflow friction; production should expose reviewed typed broker operations instead of broadening shell auto-allow or repeatedly prompting users to override ambiguity.
  - Fleet telemetry evidence is synthetic and does not prove deployed collector identity authenticated transport SIEM durability endpoint coverage or live alert delivery; production adoption requires organization-owned source and receiver evidence.
  - A verified synthetic alert receipt proves rule execution and delivery latency only; it does not prove on-call acknowledgement investigation quality response time or successful containment.
  - The collector signature fixture uses a synthetic public key and precomputed statement; production requires protected private-key custody rotation revocation managed checkpoint rollback protection and independent trust distribution.
