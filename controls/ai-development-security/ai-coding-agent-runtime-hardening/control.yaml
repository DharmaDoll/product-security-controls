id: PSB-AI-004
title: Harden AI coding agent runtime authority
domain: ai-development-security
summary: 共通ポリシーと製品別アダプターにより、AIコーディングエージェントのファイルシステム、ネットワーク、拡張機能、高影響操作、バイパス経路を最小権限に制限して検証する。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
  - govern
threats:
  - id: AI-AGENT-TOOL-ABUSE
    description: Malicious instructions compromised extensions or agent mistakes cause a coding agent to invoke tools with unintended authority.
  - id: AI-AGENT-CREDENTIAL-HARVEST
    description: Repository content or a tool attempts to read credentials available on the developer endpoint.
  - id: AI-AGENT-EXFILTRATION
    description: An agent or invoked process sends source credentials or host data to an unapproved destination.
  - id: AI-AGENT-SANDBOX-BYPASS
    description: A bypass mode configuration downgrade or unavailable sandbox causes commands to run outside the intended boundary.
  - id: AI-AGENT-APPROVAL-CONFUSION
    description: An agent reuses a broad stale or altered approval for a different high-impact action target or parameter set.
  - id: AI-AGENT-EXTENSION-OVERREACH
    description: An unapproved or identity-confused MCP plugin Skill app or browser capability exposes tools and side effects beyond the reviewed task.
  - id: AI-AGENT-APPROVAL-FATIGUE
    description: Excessive confirmation prompts train a developer to approve high-impact agent actions without meaningful review.
  - id: AI-AGENT-HOOK-BYPASS
    description: Missing replaceable malformed or failed enforcement hooks allow an MCP invocation to skip machine-checkable capability constraints.
  - id: AI-AGENT-APPROVAL-FORGERY
    description: A local process forges or races approval evidence so one human decision authorizes an unreviewed or repeated high-impact action.
  - id: AI-AGENT-RUNTIME-DRIFT
    description: A previously installed or identity-confused plugin Skill or MCP server remains active outside the reviewed runtime extension set.
  - id: AI-AGENT-AUDIT-BLINDNESS
    description: Missing failed over-retained or sensitive runtime logs prevent investigation or expose source prompts tool arguments and outputs.
  - id: AI-AGENT-NETWORK-PIVOT
    description: Temporarily enabled agent networking reaches an unreviewed external destination local daemon private network cloud metadata endpoint proxy or rebound DNS address.
  - id: AI-AGENT-HOOK-FAIL-OPEN
    description: A managed enforcement hook cannot start times out exits abnormally or returns invalid output and the product continues a remote side effect without an independent permit check.
  - id: AI-AGENT-SIDE-EFFECT-REPLAY
    description: An uncertain remote outcome causes a consumed approval to be restored or retried with changed request identity and executes one logical side effect more than once.
  - id: AI-AGENT-COMMAND-INDIRECTION
    description: A protected command is hidden behind environment shell script task-runner interpreter or alias indirection and bypasses direct command classification.
  - id: AI-AGENT-TELEMETRY-PIPELINE-BLINDNESS
    description: Missing fleet enrollment stalled or incomplete export unsafe centralized collection or untested alert delivery hides runtime drift and fail-open agent activity or exposes sensitive request content.
  - id: AI-AGENT-TELEMETRY-EVIDENCE-FORGERY
    description: An agent endpoint process or pipeline intermediary fabricates modifies or replays a clean fleet snapshot so security evaluation trusts attacker-controlled telemetry state.
