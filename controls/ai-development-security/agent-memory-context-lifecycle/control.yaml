limitations:
  - The store payloads decisions retrievals and tombstones are local deterministic fixtures and do not prove a hosted provider exposes or enforces equivalent controls.
  - SHA-256 detects substitution against reviewed metadata but is not an authenticated store commitment when an attacker can rewrite both data and policy.
  - The first slice models deletion by bounded tombstone and payload absence but does not prove backup cache replica vector-index or model-provider deletion.
  - Encryption at rest key ownership residency backup governance and provider administrator access require organization and provider evidence and remain NOT_CHECKED.
  - Only exact single-user single-session single-task scope is modeled; reviewed collaboration delegation and cross-device synchronization need a separate authorization design.
  - Content classification is supplied as metadata and must be backed by organization data-classification tooling and human review in production.
  - Memory poisoning through images audio embeddings retrieval ranking delayed triggers and multi-agent messages remains outside this first corpus.
status: prototype
evidence_level: E3
owner: product-security
