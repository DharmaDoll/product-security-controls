limitations:
  - Synthetic text fixtures and deterministic whole-document chunks do not represent production parsers OCR media extraction tokenizers semantic chunking or vector similarity behavior.
  - The inert marker verifies admission semantics and does not prove detection of obfuscated multilingual delayed multimodal or novel RAG poisoning.
  - The embedding binding is a metadata digest and does not generate or validate a real vector; live embedding execution and model behavior remain NOT_CHECKED.
  - Source owner license authorization classification and tenant records are repository fixtures; production evidence requires independently governed connectors identity and approval lifecycle.
  - A complete exact source can still contain false biased outdated or malicious claims that deterministic scanning does not identify.
  - Vector database ACL cache replica backup encryption residency availability and deletion propagation are not exercised by the local adapter.
  - Retrieval result provenance does not prove that the application or model actually consumed only those chunks or that the response did not leak information.
  - PSB-AI-003 runtime prompt-injection containment PSB-AI-005 memory lifecycle PSB-DEPS-005 model trust and PSB-AI-010 application egress remain independent required controls.
  - AI TEVV and adversarial release thresholds remain a separate detection-verification control.
  - Mappings do not claim complete MITRE ATLAS OWASP Agentic or product security coverage.
