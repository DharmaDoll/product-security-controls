id: PSB-AI-010
title: Enforce an authenticated AI application gateway and data egress policy
domain: ai-development-security
summary: ApplicationのLLM通信を署名workload identity、mandatory gateway、exact provider／model／tenant／region、classification、minimization、redaction、retentionへbindし、bypassと機密data egressをfail closedにする。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: AI-APPLICATION-GATEWAY-BYPASS
    description: An application or dependency connects directly to a provider and bypasses centralized identity data and routing controls.
  - id: AI-INFERENCE-TARGET-DRIFT
    description: Requests reach an unreviewed provider model tenant region training or retention configuration.
  - id: AI-SENSITIVE-DATA-EGRESS
    description: Secrets credentials source personal or regulated data cross the application boundary without minimization redaction or denial.
  - id: AI-WORKLOAD-IDENTITY-ABUSE
    description: A forged stale wrong-audience or cross-tenant workload identity obtains model inference authority.
  - id: AI-GATEWAY-FAIL-OPEN
    description: Identity policy enforcement classification or telemetry failure is converted to direct fallback or an allow decision.
  - id: AI-GATEWAY-EVIDENCE-LEAK
    description: Prompts responses customer content secrets or source are copied into gateway evidence and centralized telemetry.
  - id: AI-GATEWAY-ADOPTION-OVERCLAIM
    description: Deterministic local fixtures are presented as proof that live application routes provider contracts and enforcement are adopted.
implementations:
  insecure:
    - insecure/workload-session.json
    - insecure/gateway-evidence.json
  secure:
    - secure/policy.json
    - secure/trust/workloads.json
    - secure/workload-session.json
    - secure/scenario-corpus.json
    - secure/gateway-evidence.json
    - scripts/verify.py
verification:
  commands:
    - make verify-control CONTROL=PSB-AI-010
  expected:
    - exact mandatory HTTPS route workload trust public key and gateway policy are immutable
    - a signed five-minute workload session binds service account tenant audience nonce sequence and policy digest
    - public minimized and completely redacted personal-data scenarios are authorized
    - secret unapproved model wrong tenant or region direct bypass unknown workload and oversized scenarios are denied
    - provider model tenant region training and zero-retention conditions are evaluated as one exact target
    - every decision is derived independently audited before dispatch and contains no prompt response secret source or personal content
    - gateway identity decision enforcement and telemetry health are complete fresh and fail closed
    - forged bypass unapproved sensitive oversized and adoption-overclaim behavior is FAIL
    - malformed unavailable cryptographic evaluator or sensitive evidence is ERROR
    - synthetic fixture output leaves all live enforcement points NOT_CHECKED
checks:
  - id: AIG-001
    title: Gateway route workload trust and policy are immutable
    required_state: one versioned policy binds the mandatory HTTPS gateway route exact workload trust manifest public key inference targets data rules and fail-closed behavior
    responsible_role: security
    applies_to:
      - ai-application-gateway-policy
      - application-route
      - workload-trust-manifest
      - workload-public-key
    context:
      threat_actor: compromised application operator or dependency replacing the gateway route trust root or data policy with a weaker version
      attack_or_failure_scenario: later identity and data checks execute against mutable or mismatched semantics and appear valid while direct provider access is enabled
      why_required: every request decision depends on one stable route trust and policy identity and cannot safely combine independently drifting configuration fragments
    verification:
      type: automated
      method: validate policy schema identity exact HTTPS host port path mandatory mode trust manifest and public-key SHA-256 before scenario evaluation
      expected: the reviewed route and trust root resolve exactly while missing or tampered artifacts are ERROR
      evidence:
        - policy route comparison
        - trust manifest and public-key digest result
    mapping_status: reviewed
  - id: AIG-002
    title: Workload session is authenticated and audience bound
    required_state: an active workload Ed25519-signs a maximum-five-minute session binding exact service account tenant gateway audience policy digest nonce and sequence
    responsible_role: shared
    applies_to:
      - application-workload-identity
      - gateway-session
      - service-account
      - identity-replay
    context:
      threat_actor: attacker forging application identity stale session holder or service from another tenant reusing inference authority
      attack_or_failure_scenario: a syntactically valid request reaches the gateway without proving which workload and tenant received authority for this policy and audience
      why_required: network location and API format do not authenticate the application subject or prevent a token issued for a direct provider from being replayed at the gateway
    verification:
      type: automated
      method: canonicalize the session verify Ed25519 signature and compare workload service tenant audience policy digest TTL nonce and sequence
      expected: the exact signed session passes while changed audience invalid signature stale identity or unavailable verifier fails closed
      evidence:
        - workload signature decision
        - session identity audience and freshness output
    mapping_status: reviewed
  - id: AIG-003
    title: Application requests cannot bypass the mandatory gateway
    required_state: only exact HTTPS gateway host port and path routing can receive an authorized dispatch and a direct provider route is blocked before network execution
    responsible_role: shared
    applies_to:
      - application-egress-route
      - direct-provider-bypass
      - network-enforcement
      - gateway-dispatch
    context:
      threat_actor: compromised application SDK environment override or developer configuring a provider endpoint outside the managed gateway
      attack_or_failure_scenario: all policy logic exists at the gateway but a direct HTTPS connection sends the same payload without encountering any decision
      why_required: an advisory gateway changes no security outcome unless the network and application route make it the mandatory path
    verification:
      type: automated
      method: derive route equality from mode scheme host port and path then compare direct-bypass decision enforcement and upstream dispatch state
      expected: exact gateway requests proceed to later checks while the direct-provider fixture is denied and not dispatched
      evidence:
        - route comparison
        - bypass block and dispatch state
    mapping_status: reviewed
  - id: AIG-004
    title: Inference target is an exact reviewed tuple
    required_state: provider model provider tenant region training-on-inputs false and retention zero all match one allowlisted target before dispatch
    responsible_role: security
    applies_to:
      - inference-provider
      - model-identity
      - provider-tenant
      - provider-region
      - training-policy
      - retention-policy
    context:
      threat_actor: routing drift compromised gateway or operator selecting an unreviewed model consumer tenant foreign region training-enabled endpoint or longer retention
      attack_or_failure_scenario: a familiar provider name hides materially different model data use residency and tenant isolation conditions
      why_required: provider identity alone does not express the complete processing boundary or contract applied to one inference request
    verification:
      type: automated
      method: compare all six target attributes as one tuple and require both unapproved-model and wrong-tenant-region scenarios to remain blocked
      expected: only the exact reviewed target is eligible and either identity or data-use mismatch prevents dispatch
      evidence:
        - inference target tuple comparison
        - target and retention enforcement decisions
    mapping_status: reviewed
  - id: AIG-005
    title: Outbound data is classified minimized and size bounded
    required_state: every request has an approved output classification outbound bytes and forwarded fields do not exceed input and class-specific maximum size is enforced
    responsible_role: developer
    applies_to:
      - ai-request-data
      - data-classification
      - field-minimization
      - payload-size-limit
    context:
      threat_actor: malicious user verbose application context builder or implementation forwarding whole records and logs when only a few fields are required
      attack_or_failure_scenario: allowed public or redacted classification is used to justify unnecessary large context that increases exposure and prompt injection surface
      why_required: classification decides sensitivity but does not establish that the minimum necessary amount of that class is sent
    verification:
      type: automated
      method: validate nonnegative byte and field counters compare outbound to input and enforce public and internal-redacted maximums
      expected: minimized public data is allowed while the 5000-byte public output is denied before dispatch
      evidence:
        - byte and field count comparisons
        - oversized request decision
    mapping_status: reviewed
  - id: AIG-006
    title: Prohibited sensitive data classes are denied before dispatch
    required_state: credential secret source-code and regulated input classes never receive an authorized provider dispatch regardless of route identity or target approval
    responsible_role: shared
    applies_to:
      - sensitive-data-egress
      - application-secret
      - source-code
      - regulated-data
    context:
      threat_actor: prompt injection malicious user debug collector or application developer placing high-impact sensitive material into an otherwise approved AI request
      attack_or_failure_scenario: exact workload and provider policy pass but the payload itself crosses a trust or legal boundary that redaction cannot safely repair
      why_required: identity and target controls answer who and where but cannot make inherently prohibited content safe to transmit
    verification:
      type: automated
      method: compare input class with the explicit deny set and require data-class-denied blocked no-upstream state
      expected: the synthetic secret-class scenario is denied before dispatch and no raw matched value appears in evidence
      evidence:
        - prohibited class decision
        - blocked dispatch metadata
    mapping_status: reviewed
  - id: AIG-007
    title: Personal data is redacted locally before zero-retention inference
    required_state: personal-data input becomes internal-redacted only when every detected item is redacted locally fields are minimized and the exact target disables training and retention
    responsible_role: shared
    applies_to:
      - personal-data-redaction
      - local-data-processing
      - provider-training-policy
      - zero-retention-target
    context:
      threat_actor: incomplete redactor classifier miss or provider policy drift exposing personal data to training retention or another processing region
      attack_or_failure_scenario: an application labels data redacted while detected items remain or relies on the external provider to remove data after egress
      why_required: personal data requires a transformation and processing contract beyond the ordinary allowed-class and size checks
    verification:
      type: automated
      method: compare detected and redacted counts require fewer forwarded fields internal-redacted output and target training and retention enforcement
      expected: the two-item fully redacted fixture is authorized while partial redaction or nonzero provider use remains denied
      evidence:
        - redaction count comparison
        - minimization training and retention decisions
    mapping_status: reviewed
  - id: AIG-008
    title: Gateway telemetry is complete content-free and pre-dispatch
    required_state: one contiguous decision record per scenario is committed before dispatch and contains only identities counts classifications reasons digests timestamps and enforcement state
    responsible_role: security
    applies_to:
      - gateway-decision-audit
      - data-minimized-telemetry
      - request-content-digest
      - dispatch-order
    context:
      threat_actor: malicious evidence producer collector failure or logging configuration copying prompts responses customer records secrets or source into central telemetry
      attack_or_failure_scenario: investigators see incomplete post-action logs while the monitoring system becomes a second uncontrolled store for the protected content
      why_required: fail-closed enforcement needs attributable pre-dispatch evidence but raw AI content is unnecessary and creates another breach surface
    verification:
      type: automated
      method: require eight unique sequences pre-dispatch audit content digest network-not-performed fixture state and recursive forbidden-field rejection
      expected: metadata-only complete decisions pass while missing late malformed or content-bearing evidence is ERROR or FAIL as appropriate
      evidence:
        - decision sequence and audit ordering
        - expected-results/errors.txt
    mapping_status: reviewed
  - id: AIG-009
    title: Gateway independently derives and enforces every decision
    required_state: reported decision and sorted reasons equal policy-derived results allowed requests are only authorized and every denied request is blocked without upstream dispatch
    responsible_role: shared
    applies_to:
      - gateway-policy-decision
      - egress-enforcer
      - fail-closed-dispatch
      - decision-integrity
    context:
      threat_actor: compromised application or gateway adapter self-reporting allow overriding denial reasons or dispatching before the policy response
      attack_or_failure_scenario: fixture expectations or application claims are trusted instead of independently recalculating the policy and observing enforcement
      why_required: detection and metadata have no preventive value unless one mandatory point applies the independently derived result before network egress
    verification:
      type: automated
      method: recompute identity route target classification minimization redaction and size reasons for all scenarios and compare dispatch states
      expected: two allow and six deny outcomes match exactly and no fixture performs network dispatch
      evidence:
        - derived-versus-reported decision output
        - dispatch authorization and block states
    mapping_status: reviewed
  - id: AIG-010
    title: Gateway control and evidence health fails closed
    required_state: decision engine egress enforcer identity verifier and telemetry sink have a complete healthy observation no older than 300 seconds
    responsible_role: security
    applies_to:
      - gateway-health
      - identity-verifier-health
      - egress-enforcer-health
      - telemetry-sink-health
    context:
      threat_actor: service outage partial deployment stale health cache or operator enabling direct fallback to preserve availability
      attack_or_failure_scenario: absence of one control component is interpreted as no finding and requests continue without identity data or enforcement evidence
      why_required: a clean decision is meaningful only when all required components were available and observed for the same evaluation window
    verification:
      type: automated
      method: compare exact health component set status completeness and observation age while treating unavailable collection or evaluator as exit code 2
      expected: four fresh healthy components pass and missing stale unavailable or malformed evidence is ERROR
      evidence:
        - health component inventory
        - health freshness result
    mapping_status: reviewed
  - id: AIG-011
    title: Fixture evidence does not overclaim live gateway adoption
    required_state: deterministic evidence explicitly reports application route gateway decision identity provider provider policy and telemetry receiver as NOT_CHECKED
    responsible_role: security
    applies_to:
      - live-application-route
      - live-gateway-enforcement
      - live-provider-policy
      - live-telemetry-adoption
    context:
      threat_actor: adopter or reporting automation presenting local JSON decisions as proof that production provider routing identity contract and data enforcement are active
      attack_or_failure_scenario: direct egress or provider drift exists in production but a passing fixture is reported as an adopted security boundary
      why_required: offline policy behavior can be tested deterministically but only live negative requests and provider evidence prove the real path is constrained
    verification:
      type: automated
      method: require synthetic-fixture source and the exact five live enforcement keys all set to NOT_CHECKED
      expected: E3 fixture passes without claiming route IdP provider contract gateway or receiver adoption
      evidence:
        - synthetic evidence source
        - live enforcement NOT_CHECKED output
    mapping_status: unmapped
