limitations:
  - Synthetic fixtures do not prove live application network routes identity provider gateway provider contract region training retention or telemetry receiver behavior.
  - Repository public keys and signatures do not establish production workload key custody rotation revocation or mTLS DPoP and workload-attestation strength.
  - Classification and count metadata do not prove semantic redaction completeness or detect unknown sensitive categories and non-text content.
  - Provider request fields cannot prove the provider actually applies tenant region no-training zero-retention or deletion commitments.
  - The first slice does not evaluate model responses output filtering prompt safety hallucination embedding attachments images audio or tool-mediated egress.
  - Business-field allowlists application authorization legal basis consent purpose limitation and jurisdiction-specific compliance remain application and governance responsibilities.
  - A gateway is bypassable until independent application egress network policy blocks direct provider and alternate proxy paths.
  - Passing the fixture does not establish complete ASI03 or ATLAS coverage AI product safety data protection compliance or live adoption.
