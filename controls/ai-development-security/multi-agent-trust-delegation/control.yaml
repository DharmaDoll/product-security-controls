limitations:
  - Synthetic public keys and precomputed signatures do not prove live agent enrollment key custody rotation revocation or transport authenticity.
  - The repository retains no fixture private key and cannot use these identities for production signing.
  - Static replay evidence does not implement atomic nonce or sequence consumption under concurrency.
  - Child budget comparison does not reserve provider quota atomically across concurrent agents sessions or tenants.
  - One exact review edge does not cover dynamic discovery multi-hop workflows consensus quorum failover rollback or rogue-agent recovery.
  - Dedicated context and ambient credential fields are synthetic claims until a live runtime collector verifies isolation.
  - Path scope assumes upstream canonicalization and does not resolve symlink ref alias URL case or filesystem races.
  - Passing the fixture does not establish agent goal correctness model safety or complete OWASP or ATLAS coverage.
status: prototype
owner: product-security
evidence_level: E3
