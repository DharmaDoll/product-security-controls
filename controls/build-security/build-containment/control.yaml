id: PSB-BUILD-001
title: dependency buildを権限・credential・networkから隔離する
domain: build-security
summary: 未信頼のビルドをデプロイ権限から分離し、一時的なサンドボックス、最小権限、外向き通信のデフォルト拒否、監視状態を検証する。
check_context_version: "1.0"
security_functions:
  - prevent
  - detect
  - verify
threats:
  - id: BUILD-DEPENDENCY-CREDENTIAL-EXFILTRATION
    description: Compromised dependencyまたはbuild scriptがCI credential、source、artifactを外部へ送信する。
  - id: BUILD-TO-DEPLOY-PRIVILEGE-ESCALATION
    description: Untrusted sourceを実行するjobがdeploy権限またはproduction environmentへ到達する。
implementations:
  insecure:
    - insecure/build-plan.json
  secure:
    - secure/build-plan.json
verification:
  commands:
    - make verify-control CONTROL=PSB-BUILD-001
  expected:
    - untrusted buildにcredentialとwrite permissionが存在しない
    - buildとdeployが別trust boundaryでartifactだけを受け渡す
    - egressがcredentialなしHTTPS origin allowlistでdefault denyになる
    - ephemeral non-root read-only sandboxとprocess network telemetryが必須になる
    - input欠落またはparse失敗がcleanな結果と区別される
checks:
  - id: BLD-001
    title: Untrusted build has no credential or write permission
    required_state: credential-free and read-only control-plane access
    responsible_role: build-platform
    applies_to:
      - build-environment
    context:
      threat_actor: malicious or compromised dependency executing inside the build
      attack_or_failure_scenario: dependency code reads credentials or uses control-plane write access to alter repositories releases or infrastructure
      why_required: removing credentials and write authority limits impact even when untrusted build code executes
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-BUILD-001
      expected: untrusted build plans with credentials or write permissions are rejected
      evidence:
        - sanitized verifier output
    mapping_status: reviewed
  - id: BLD-002
    title: Build and deploy use separate trust boundaries
    required_state: artifact-only handoff between build and deploy
    responsible_role: build-platform
    applies_to:
      - build-environment
      - deployment-pipeline
    context:
      threat_actor: compromised build process attempting to cross into deployment authority
      attack_or_failure_scenario: the environment executing dependencies also holds release or production deployment credentials
      why_required: an artifact-only handoff prevents build-time code from directly exercising deploy privileges
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-BUILD-001
      expected: build cannot directly use deploy privileges
      evidence:
        - sanitized verifier output
        - build and deploy job definition
    mapping_status: reviewed
  - id: BLD-003
    title: Build egress is default deny
    required_state: credential-free HTTPS origin allowlist
    responsible_role: build-platform
    applies_to:
      - build-network
    context:
      threat_actor: malicious dependency or build script using outbound network access
      attack_or_failure_scenario: build code exfiltrates source or downloads an unreviewed secondary payload from arbitrary destinations
      why_required: default-deny egress constrains exfiltration and payload retrieval independently of filesystem controls
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-BUILD-001
      expected: broad or credential-bearing egress is rejected
      evidence:
        - sanitized verifier output
        - egress policy
    mapping_status: reviewed
  - id: BLD-004
    title: Untrusted build runs in an ephemeral restricted sandbox
    required_state: ephemeral non-root read-only sandbox
    responsible_role: build-platform
    applies_to:
      - build-environment
    context:
      threat_actor: untrusted package build logic and compromised build tools
      attack_or_failure_scenario: build code persists changes escalates through root privileges or writes outside the intended workspace
      why_required: ephemeral non-root read-only isolation reduces persistence and host compromise when execution is unavoidable
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-BUILD-001
      expected: persistent privileged or writable sandboxes are rejected
      evidence:
        - sanitized verifier output
        - runner policy
    mapping_status: reviewed
  - id: BLD-005
    title: Build process and network activity is observable
    required_state: process and network telemetry required
    responsible_role: security
    applies_to:
      - build-environment
    context:
      threat_actor: malicious build code hiding activity within otherwise successful output
      attack_or_failure_scenario: unexpected processes or network connections occur without evidence for detection or incident reconstruction
      why_required: containment reduces capability but telemetry is needed to detect attempts and verify boundary operation
    verification:
      type: hybrid
      method: verify the reference policy and inspect the telemetry integration
      expected: policy requires telemetry and the production backend records it
      evidence:
        - sanitized verifier output
        - telemetry policy and sample event
    mapping_status: reviewed
  - id: BLD-006
    title: Build-policy verification fails closed
    required_state: invalid or missing input is an error rather than clean
    responsible_role: build-platform
    applies_to:
      - build-verifier
    context:
      threat_actor: malformed evidence missing input or an operator misreading verifier failure
      attack_or_failure_scenario: policy evaluation cannot complete but the build is reported as satisfying containment requirements
      why_required: a distinct error state prevents unavailable verification from becoming false assurance
    verification:
      type: automated
      method: make verify-control CONTROL=PSB-BUILD-001
      expected: malformed and missing input use a distinct non-zero result
      evidence:
        - negative-test output
    mapping_status: reviewed
mappings:
  - framework: slsa
    version: "1.2"
    id: build-track-basics#build-l3-hardened-builds
    relationship: supports
    confidence: medium
    rationale: Build間の影響を抑えるephemeral isolationとprovenance signing secretをuser-defined buildから分離するSLSA Build L3の方向性を支援するが、platform assessmentは行わない。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - BLD-001
      - BLD-002
      - BLD-004
  - framework: nist-ssdf
    version: "1.1 (SP 800-218, 2022)"
    id: PW.6.1
    relationship: supports
    confidence: high
    rationale: Build processをleast privilegeと分離された環境で実行し、softwareをsecureにcompile packageするpracticeを支援する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - BLD-001
      - BLD-002
      - BLD-003
      - BLD-004
      - BLD-005
  - framework: openssf-osps-baseline
    version: "2026.02.19"
    id: OSPS-BR-01.03
    relationship: verifies
    confidence: high
    rationale: Untrusted code snapshotを扱うbuildからprivileged CI/CD credentialとdeploy assetを分離する要件をfail-closed policy testで検証する。
    reviewer: product-security
    review_date: "2026-07-27"
    applies_to:
      - BLD-001
      - BLD-002
      - BLD-006
limitations:
  - Reference JSONはrunner sandboxまたはnetwork firewall自体を構築しない。
  - SLSA Build levelの正式assessmentやcomplianceを証明しない。
  - 許可endpoint、runner control plane、telemetry backendの侵害は別途対策が必要である。
  - Policy verifierまたはtelemetry失敗をcleanな結果として扱ってはいけない。
status: prototype
owner: product-security
evidence_level: E3
