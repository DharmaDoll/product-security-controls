name: Product Security Blueprint verification

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify security controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned test utility
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep=14.1.0-1ubuntu1
          rg --version
      - name: Lint controls
        run: make lint
      - name: Test controls
        run: make test
      - name: Verify controls
        run: make verify
